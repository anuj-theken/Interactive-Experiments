<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Timeline - Asian Paints</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-group">
                <h1>Beyond the founding families</h1>
                <p class="subtitle">Five hires in the 1950s and ’60s defined Asian Paints’ professional culture for decades.</p>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <span class="square founder-bg"></span>
                    <span>New Hire</span>
                </div>
                <div class="legend-item">
                    <span class="line"></span>
                    <span>1 year</span>
                </div>
            </div>
        </header>

        <div id="timeline-chart"></div>

        <div id="info-card" class="card">
            <h2 id="founder-name"></h2>
            <p id="founder-desc"></p>
        </div>

        <p class="footer-hint">Hover/click on the orange squares to see more</p>
    </div>

    <script src="timeline.js"></script>
</body>
</html>
