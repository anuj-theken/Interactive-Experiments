<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #170D1D;
            margin: 0;
            padding: 40px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-panel {
            background: rgba(23, 13, 29, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 900px;
            max-width: 95%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-container {
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            gap: 15px;
        }

        .nav-btn {
            padding: 15px 5px;
            border: 2px solid #C1D1DF;
            background: transparent;
            color: #C1D1DF;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            font-size: 24px;
            font-family: 'Reckless', 'Times New Roman', serif;
            white-space: nowrap;
        }

        .nav-btn.active {
            background: #F9F3E6;
            color: #170D1D;
            border-color: #F9F3E6;
        }

        .nav-btn:hover:not(.active) {
            background: rgba(193, 209, 223, 0.1);
        }

        .charts-row {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
        }

        .chart-container {
            flex: 1;
            height: 380px;
            min-width: 0;
        }

        @media (max-width: 600px) {
            .nav-container { grid-template-columns: 1fr; }
            .nav-btn { font-size: 20px; }
            .charts-row { flex-direction: column; }
            .chart-container { height: 320px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-panel">
        <div class="nav-container">
            <button class="nav-btn active" onclick="updateDashboard(0, this)">1996 - 2005</button>
            <button class="nav-btn" onclick="updateDashboard(1, this)">2006 - 2015</button>
            <button class="nav-btn" onclick="updateDashboard(2, this)">2016 - 2025</button>
        </div>

        <div class="charts-row">
            <div id="sourceChart" class="chart-container"></div>
            <div id="appChart" class="chart-container"></div>
        </div>
    </div>

    <script>
        const CREAM  = '#F9F3E6';
        const RED    = '#8A7C92';
        const BLUE   = '#C1D1DF';
        const PURPLE = '#E84C31';
        const BG     = '#170D1D';

        let sourceChart, appChart;

        const financialData = [
            {
                source: [{ value: 75, name: 'Cash flow from operating activities' }, { value: 25, name: 'Other' }],
                app:    [{ value: 31, name: 'Dividend' }, { value: 35, name: 'Net Capex' }, { value: 34, name: 'Other' }]
            },
            {
                source: [{ value: 94, name: 'Cash flow from operating activities' }, { value: 6,  name: 'Other' }],
                app:    [{ value: 48, name: 'Dividend' }, { value: 31, name: 'Net Capex' }, { value: 21, name: 'Other' }]
            },
            {
                source: [{ value: 83, name: 'Cash flow from operating activities' }, { value: 17, name: 'Other' }],
                app:    [{ value: 46, name: 'Dividend' }, { value: 32, name: 'Net Capex' }, { value: 22, name: 'Other' }]
            }
        ];

        const sourceColors = [RED, BLUE];
        const appColors    = [BLUE, PURPLE, RED];

        function getOption(title, data, colors) {
            return {
                title: {
                    text: title,
                    left: 'center',
                    textStyle: { fontSize: 16, color: CREAM, fontFamily: 'Reckless' }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}%',
                    backgroundColor: '#2a1a30',
                    borderColor: PURPLE,
                    textStyle: { color: CREAM }
                },
                legend: {
                    bottom: '0',
                    left: 'center',
                    itemWidth: 12,
                    itemHeight: 12,
                    textStyle: { color: CREAM, fontSize: 11 }
                },
                series: [{
                    name: title,
                    type: 'pie',
                    radius: '60%',
                    center: ['50%', '48%'],
                    data: data,
                    color: colors,
                    label: {
                        show: true,
                        formatter: '{d}%',
                        fontSize: 13,
                        color: CREAM
                    },
                    labelLine: {
                        lineStyle: { color: PURPLE }
                    },
                    itemStyle: {
                        borderWidth: 2,
                        borderColor: BG
                    },
                    animationDuration: 800,
                    animationEasing: 'cubicOut'
                }]
            };
        }

        function updateDashboard(index, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            sourceChart.setOption({ series: [{ data: financialData[index].source }] });
            appChart.setOption({ series: [{ data: financialData[index].app }] });
        }

        document.addEventListener('DOMContentLoaded', () => {
            sourceChart = echarts.init(document.getElementById('sourceChart'), null, { backgroundColor: 'transparent' });
            appChart    = echarts.init(document.getElementById('appChart'),    null, { backgroundColor: 'transparent' });

            sourceChart.setOption(getOption('Sources of Capital',    financialData[0].source, sourceColors));
            appChart.setOption(getOption('Application of Capital', financialData[0].app,    appColors));

            window.addEventListener('resize', () => {
                sourceChart.resize();
                appChart.resize();
            });
        });
    </script>
</body>
</html>
