<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBFC Revenue Growth Vector Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 95%;
            max-width: 1300px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 28px;
            margin-top: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .title-area h2 {
            margin: 0 0 6px 0;
            color: #111827;
            font-size: 24px;
        }
        .title-area p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        .toggle-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .toggle-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
        #chart-container {
            width: 100%;
            height: 600px;
        }
        .legend-bar {
            display: flex;
            gap: 20px;
            background: #f9fafb;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #4b5563;
            border: 1px solid #f3f4f6;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            border-radius: 50%;
            background-color: #9ca3af;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-area">
            <h2>NBFC Growth Analysis Matrix (Capped Metric View)</h2>
            <p>X-Axis: Entity Index (Hover for Details) | Y-Axis: Revenue Growth Rate (%) | Bubble Size: Active Revenue Value</p>
        </div>
        <button class="toggle-btn" id="stateBtn">View Growth Vector Shift (FY25 → FY26)</button>
    </div>

    <div class="legend-bar">
        <span style="font-weight: 600; color: #1f2937;">Bubble Size Reference (Revenue):</span>
        <div class="legend-item"><span class="dot" style="width: 8px; height: 8px;"></span> Micro Size (< ₹1 Cr)</div>
        <div class="legend-item"><span class="dot" style="width: 16px; height: 16px;"></span> Medium Scale (₹2 Cr - ₹15 Cr)</div>
        <div class="legend-item"><span class="dot" style="width: 32px; height: 32px;"></span> Major Volume (> ₹30 Cr)</div>
    </div>
    
    <div id="chart-container"></div>
</div>

<script>
    const rawData = [
        { name: "Ampire Finance Private Limited", yoe: 1981, fy24: 0.4, fy25: 2.2 },
        { name: "Ayaan Finserve India Private Limited", yoe: 1982, fy24: 3.5, fy25: 7.9 },
        { name: "Comero Leasing & Financials Pvt. Ltd.", yoe: 1992, fy24: 1.1, fy25: 6.4 },
        { name: "Devmuni Leasing & Finance Ltd.", yoe: 1993, fy24: 32.9, fy25: 74.7 },
        { name: "Niskha Finvest Pvt. Ltd.", yoe: 1994, fy24: 2.5, fy25: 4.7 },
        { name: "Avinash Capital Markets Pvt. Ltd.", yoe: 1994, fy24: 0.24, fy25: 0.237 },
        { name: "Agrim Fincap Pvt.Ltd.", yoe: 1995, fy24: 0.197, fy25: 2.65 },
        { name: "Ava Finance Private Limited", yoe: 1995, fy24: 0.23, fy25: 3.5 },
        { name: "SURYA SHAKTI VYAPAAR Pvt. Ltd.", yoe: 1995, fy24: 14.6, fy25: 14.6 },
        { name: "Dev-Aashish Capital (P) Ltd.", yoe: 1995, fy24: 0.18, fy25: 1.0 },
        { name: "Digner Finlease & Investment Pvt. Ltd.", yoe: 1995, fy24: 0.11, fy25: 2.35 },
        { name: "Everlight Holding Pvt Ltd", yoe: 1995, fy24: 0.13, fy25: 0.224 },
        { name: "Girdhar Finlease Pvt Ltd.", yoe: 1995, fy24: 8.0, fy25: 14.3 },
        { name: "Goodskill Securities And Services Limited", yoe: 1995, fy24: 36.8, fy25: 47.9 },
        { name: "Kasar Credit & Capital Pvt.Ltd.", yoe: 1995, fy24: 0.013, fy25: 3.3 },
        { name: "Loan2Grow Fincap Private Limited", yoe: 1995, fy24: 0.4, fy25: 0.44 },
        { name: "Tycoon Credit & Portfolio Ltd.", yoe: 1995, fy24: 0.7, fy25: 16.2 },
        { name: "Junoon Capital Services (P) Ltd.", yoe: 1996, fy24: 2.9, fy25: 11.5 },
        { name: "Achiievers Finance India Lmtd", yoe: 1996, fy24: 14.7, fy25: 25.4 },
        { name: "Agf Finlease (India) Ltd", yoe: 1996, fy24: 5.0, fy25: 22.6 },
        { name: "Aman Fincap Ltd.", yoe: 1996, fy24: 1.2, fy25: 0.8 }
    ];

    const vibrantColors = [
        '#ff4d4d', '#33d9b2', '#34ace0', '#ffb142', '#ff793f', '#706fd3', '#474787',
        '#b33939', '#218c74', '#227093', '#cc8e35', '#cd6133', '#5758bb', '#1289A7',
        '#D980FA', '#9980FA', '#ED4C67', '#F79F1F', '#A3CB38', '#12CBC4', '#FDA7DF'
    ];

    function getGrowthRate(fy24, fy25) {
        if (!fy24) return 0;
        return parseFloat((((fy25 - fy24) / fy24) * 100).toFixed(1));
    }

    const xCategories = rawData.map((_, idx) => `${idx + 1}`);

    const dataFY25 = rawData.map((item, idx) => [
        idx, 
        0, 
        item.fy24, 
        item.name,
        "Baseline (FY24 Position)",
        vibrantColors[idx % vibrantColors.length],
        item.yoe
    ]);

    const dataFY26 = rawData.map((item, idx) => {
        let exactGrowth = getGrowthRate(item.fy24, item.fy25);
        let displayGrowthStr = `${exactGrowth}%`;
        let plottedY = exactGrowth;

        // Force-cap high flyers like Digner at the top edge threshold line
        if (exactGrowth > 1300) {
            plottedY = 1300;
            displayGrowthStr = `${exactGrowth}% (Out of Bounds)`;
        }

        return [
            idx, 
            plottedY, 
            item.fy25, 
            item.name,
            displayGrowthStr,
            vibrantColors[idx % vibrantColors.length],
            item.yoe
        ];
    });

    const chartDom = document.getElementById('chart-container');
    const myChart = echarts.init(chartDom);
    let currentState = 'FY25';

    const option = {
        grid: {
            left: '4%', right: '4%', bottom: '10%', top: '10%', containLabel: true
        },
        tooltip: {
            padding: 12,
            backgroundColor: 'rgba(255, 255, 255, 0.98)',
            borderColor: '#ddd',
            borderWidth: 1,
            formatter: function (param) {
                return `<div style="font-weight:bold; margin-bottom:6px; color:#111; font-size:14px;">${param.data[3]}</div>
                        <div style="width:100%; height:1px; background:#f0f0f0; margin:6px 0;"></div>
                        Est. Year: <span style="font-weight:600; float:right;">${param.data[6]}</span><br/>
                        Revenue: <span style="font-weight:600; float:right; color:#2563eb;">₹ ${param.data[2].toFixed(3)} Cr</span><br/>
                        Growth Status: <span style="font-weight:600; float:right; color:#10b981;">${param.data[4]}</span>`;
            }
        },
        xAxis: {
            type: 'category',
            data: xCategories,
            name: 'NBFC Registry Index References',
            nameLocation: 'center',
            nameGap: 35,
            axisTick: { show: true },
            splitLine: { 
                show: true,
                lineStyle: { type: 'dashed', color: '#e5e7eb' }
            },
            axisLabel: {
                fontSize: 11,
                color: '#6b7280'
            },
            axisLine: { lineStyle: { color: '#9ca3af' } }
        },
        yAxis: {
            type: 'value',
            name: 'Revenue Shift Rate Change (%)',
            nameLocation: 'center',
            nameGap: 55,
            min: -50, 
            max: 1300, 
            splitLine: { 
                show: true,
                lineStyle: { type: 'dashed', color: '#e5e7eb' }
            },
            axisLabel: {
                formatter: function (value) {
                    if (value >= 1300) return '>1300%'; // Replaced top text label boundary
                    return value + '%';
                }
            },
            axisLine: { lineStyle: { color: '#9ca3af' } }
        },
        series: [{
            name: 'NBFC Performance Profile',
            data: dataFY25,
            type: 'scatter',
            symbolSize: function (data) {
                return Math.max(Math.pow(data[2], 0.65) * 16, 12);
            },
            emphasis: {
                focus: 'self'
            },
            itemStyle: {
                opacity: 0.85,
                shadowBlur: 8,
                shadowColor: 'rgba(0, 0, 0, 0.12)',
                color: function(params) {
                    return params.data[5]; 
                }
            }
        }]
    };

    myChart.setOption(option);

    const button = document.getElementById('stateBtn');
    button.addEventListener('click', () => {
        if (currentState === 'FY25') {
            currentState = 'FY26';
            button.innerText = '← Reset to Flat Baseline View';
            button.style.backgroundColor = '#059669';
            myChart.setOption({ series: [{ data: dataFY26 }] });
        } else {
            currentState = 'FY25';
            button.innerText = 'View Growth Vector Shift (FY25 → FY26)';
            button.style.backgroundColor = '#2563eb';
            myChart.setOption({ series: [{ data: dataFY25 }] });
        }
    });

    window.addEventListener('resize', () => { myChart.resize(); });
</script>

</body>
</html>
