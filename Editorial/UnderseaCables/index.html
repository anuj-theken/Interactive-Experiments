<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Strategic Subsea Analysis - The Ken Style</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="all_cables.js"></script>
    <style>
        @font-face { font-family: 'Jazmin Alt'; src: local('JazminAlt-Bold.otf'); font-weight: bold; }
        @font-face { font-family: 'GT America Bold'; src: local('GT-America-Standard-Black.ttf'); font-weight: bold; }
        @font-face { font-family: 'GT America'; src: local('GT-America-Standard-Light.ttf'); font-weight: 300; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            background: #F7F2F2;
            font-family: 'GT America', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            padding: 20px 30px;
        }

        #header-section {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        #header-section h1 {
            font-family: 'Jazmin Alt', serif;
            font-size: clamp(24px, 5vw, 36px);
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        #header-section p {
            font-family: 'Jazmin Alt', serif;
            font-size: clamp(16px, 2vw, 18px);
            color: #666;
            margin-bottom: 15px;
        }

        #legend-custom {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 25px;
            font-family: 'GT America Bold', sans-serif;
            /* Ensures font doesn't go below 14px */
            font-size: clamp(14px, 1.2vw, 16px);
            color: #2c3e50;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 20px; height: 12px; border-radius: 2px; }
        .circle { width: 14px; height: 14px; border-radius: 50%; }

        #map {
            flex-grow: 1;
            width: 100%;
            min-height: 300px;
            margin: 20px 0;
            background: transparent;
        }

        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid #e0e0e0;
            font-family: 'GT America', sans-serif;
            /* Ensures footer font doesn't go below 14px */
            font-size: clamp(14px, 1.1vw, 15px);
            color: #888;
        }
        .footer-left { width: 250px; display: flex; align-items: center; }
        .footer-right { width: 250px; display: flex; justify-content: flex-end; }
        .footer-center { flex: 1; text-align: center; }

        .footer-logo {
            height: 22px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
        }

        @media (max-width: 800px) {

            #footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
                padding: 20px 0;
            }
            .footer-left, .footer-center, .footer-right {
                width: 100%;
                justify-content: center;
            }
            #legend-custom {
              display: grid;
              grid-template-columns: 1fr 1fr;
              text-align: left;
              gap: 12px;
              padding: 0 10px;
              font-size: clamp(20px, 1.1vw, 15px);
            }
            #container { padding: 15px; }
            #map { margin: 10px 0; }
        }

        /* Mobile specific adjustments for very narrow screens */
        @media (max-width: 480px) {
            #legend-custom {
                display: grid;
                grid-template-columns: 1fr 1fr;
                text-align: left;
                gap: 12px;
                padding: 0 10px;
                font-size: clamp(20px, 1.1vw, 15px);
            }
            .legend-item { font-size: 20px; }
            .footer-left .footer-right{font-size: 20px;}
        }
    </style>
</head>
<body>

<div id="container">
    <div id="header-section">
        <h1>Infrastructure Risk & Expansion</h1>
        <p>Strategic analysis of the Indo-Pacific corridor</p>

        <div id="legend-custom">
            <div class="legend-item"><div class="box" style="background:#bdc3c7"></div> Existing cables</div>
            <div class="legend-item"><div class="box" style="background:#fcafaf"></div> Cables at risk</div>
            <div class="legend-item"><div class="circle" style="border: 1.5px dashed #e74c3c; background: rgba(231, 76, 60, 0.15)"></div> Risk zone</div>
            <div class="legend-item"><div class="box" style="background:#c9924e"></div> New construction</div>
            <div class="legend-item"><div class="circle" style="background:#5b93bc"></div> Landing station</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="footer">
        <div class="footer-left">
            <img src="logo.png" class="footer-logo" alt="The Ken">
        </div>
        <div class="footer-center">
            Graphic by Anuj, 30 Mar '26
        </div>
        <div class="footer-right">
            Source: TeleGeography, Meta (2026)
        </div>
    </div>
</div>

<script>
const chart = echarts.init(document.getElementById('map'));
const riskBounds = { minLon: 53, maxLon: 61, minLat: 23, maxLat: 28 };

async function init() {
    const worldRes = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json');
    const worldJson = await worldRes.json();
    echarts.registerMap('world', worldJson);
    renderChart();
}

function renderChart() {
    const width = window.innerWidth;
    const isSmallMobile = width < 500;
    const isMobile = width < 800;

    const cableSeries = (cableData || []).map(f => {
        const props = f.properties;
        const geom = f.geometry;
        const lines = geom.type === 'MultiLineString' ? geom.coordinates : [geom.coordinates];

        let isAtRisk = false;
        lines.forEach(line => line.forEach(c => {
            if (c[0] >= riskBounds.minLon && c[0] <= riskBounds.maxLon && c[1] >= riskBounds.minLat && c[1] <= riskBounds.maxLat) isAtRisk = true;
        }));

        return {
            type: 'lines',
            coordinateSystem: 'geo',
            silent: false,
            selectedMode: 'single',
            data: lines.map(line => ({ coords: line, name: props.name, properties: props })),
            polyline: true,
            lineStyle: {
                color: isAtRisk ? '#fcafaf' : '#bdc3c7',
                width: isAtRisk ? 2.0 : 1.2,
                opacity: isAtRisk ? 0.9 : 0.4
            },
            emphasis: { lineStyle: { color: '#007AFF', width: 4, opacity: 1 } },
            select: { lineStyle: { color: '#007AFF', width: 4, opacity: 1 } }
        };
    });

    chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(255, 255, 255, 0.98)',
            borderWidth: 0,
            shadowBlur: 10,
            shadowColor: 'rgba(0,0,0,0.1)',
            padding: [12, 16],
            textStyle: {
                color: '#1a1a1a',
                fontFamily: 'GT America',
                fontSize: 14
            },
            formatter: (params) => {
                if (params.seriesType === 'scatter') {
                    return params.name ? `<b style="font-family: 'GT America Bold'; color: #2c3e50;">${params.name}</b>` : null;
                }
                const p = params.data.properties;
                if (!p) return `<b style="font-family: 'GT America Bold';">${params.name}</b>`;
                return `
                    <div style="max-width: 280px; white-space: normal; font-family: 'GT America';">
                        <div style="font-family: 'GT America Bold'; font-size: 16px; margin-bottom: 4px;">${p.name}</div>
                        <div style="margin-bottom: 8px; font-size: 12px; color: #c9924e; text-transform: uppercase; font-family: 'GT America Bold';">
                            RFS: ${p.rfs_year || 'N/A'} &bull; Length: ${p.length || 'Unknown'}
                        </div>
                        <div style="border-top: 1px solid #eee; padding-top: 8px; font-size: 12px; color: #555;">
                            <b style="font-family: 'GT America Bold'; color: #1a1a1a;">Owners:</b> ${p.owners || 'N/A'}
                        </div>
                    </div>
                `;
            }
        },
        geo: {
            map: 'world',
            center: [74, 18],
            zoom: isSmallMobile ? 4.8 : (isMobile ? 5.5 : 7.2),
            roam: false,
            silent: true,
            itemStyle: { areaColor: '#eee8e8', borderColor: '#dcdde1', borderWidth: 1 }
        },
        series: [
            ...cableSeries,
            {
                type: 'scatter',
                coordinateSystem: 'geo',
                silent: true,
                data: [{ value: [56.3, 26.6], label: {
                    show: true, position: 'top', distance: 20,
                    formatter: 'Strait of Hormuz: Critical infrastructure\nunder threat due to conflict in Iran',
                    color: '#b03a2e', fontFamily: 'GT America Bold', fontSize: 14,
                    backgroundColor: 'rgba(255,255,255,0.95)', padding: [6, 10], borderRadius: 4
                }}],
                symbolSize: isSmallMobile ? 60 : 120,
                itemStyle: {
                    color: 'rgba(231, 76, 60, 0.15)',
                    borderColor: '#e74c3c',
                    borderType: 'dashed',
                    borderWidth: 2.5
                }
            },
            {
                type: 'scatter',
                coordinateSystem: 'geo',
                silent: false,
                selectedMode: 'single',
                data: [
                    { name: 'Mumbai Landing Station', value: [72.84, 18.94] },
                    { name: 'Vizag Landing Station', value: [83.30, 17.69] },
                    { name: 'Chennai Landing Station', value: [80.27, 13.08] },
                    { name: 'Kochi Landing Station', value: [76.26, 9.93] }
                ],
                symbolSize: 10,
                itemStyle: { color: '#5b93bc' },
                emphasis: { itemStyle: { color: '#007AFF', borderColor: 'rgba(0, 122, 255, 0.3)', borderWidth: 12 } },
                select: { itemStyle: { color: '#007AFF', borderColor: '#fff', borderWidth: 2 } },
                label: {
                    show: true,
                    position: 'bottom',
                    formatter: (p) => p.name.split(' ')[0],
                    fontSize: 14,
                    fontFamily: 'GT America Bold',
                    color: '#2c3e50',
                    offset: [0, 8]
                }
            },
            {
                type: 'lines',
                coordinateSystem: 'geo',
                silent: false,
                selectedMode: 'single',
                data: [{
                    coords: [[83.30, 17.69], [105.0, 0.0]],
                    name: 'Proposed Meta/Vizag Expansion Line',
                    properties: { name: 'Meta/Vizag Expansion', rfs_year: 2027, length: 'Approx 4,200 km', owners: 'Meta, Indian Gov Partners' }
                }],
                lineStyle: { color: '#c9924e', width: 3.5, type: 'dashed', opacity: 0.9 },
                emphasis: { lineStyle: { color: '#007AFF', width: 5, opacity: 1 } },
                select: { lineStyle: { color: '#007AFF', width: 5, opacity: 1 } }
            },
            {
                type: 'scatter',
                coordinateSystem: 'geo',
                silent: true,
                data: [{
                    value: [83.30, 17.69],
                    label: {
                        show: true,
                        position: 'top',
                        distance: 12,
                        formatter: 'New Indian cable line construction\n(Meta/Vizag Expansion)',
                        color: '#9e6221',
                        fontFamily: 'GT America Bold',
                        fontSize: 14,
                        backgroundColor: 'rgba(255,255,255,0.8)',
                        padding: [6, 10],
                        borderRadius: 4
                    }
                }],
                symbolSize: 0
            }
        ]
    }, true);
}

window.addEventListener('resize', () => { chart.resize(); renderChart(); });
init();
</script>
</body>
</html>
