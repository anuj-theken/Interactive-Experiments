<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Acquisitions – Goodwill %</title>
<link rel="stylesheet" href="assets/ken-chart.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="assets/ken-echarts.js"></script>
<style>
  #chart { height: clamp(420px, 60vw, 560px); }
</style>
</head>
<body>
<div class="page page--wide">
  <div class="main-title">Paying for goodwill</div>
  <div class="subtitle">Hospital acquisitions: goodwill as % of consideration, FY21–FY25</div>

  <div class="legend-box">
    <div class="note">Bubble size = goodwill %. Hover for deal details.</div>
  </div>

  <div class="viz-area" id="chart"></div>

  <div class="footer">
    <img src="assets/logo.png" alt="The Ken" class="footer-logo">
    <div class="footer-center">Graphic by Anuj, 9 Oct '26</div>
    <div class="footer-right">Source: Company filings</div>
  </div>
</div>

<script>
const { C, F } = KEN;
const groups = ['HCG', 'Baby Memorial', 'QCIL (Care)', 'Max Healthcare'];
const years = ['FY21', 'FY22', 'FY23', 'FY24', 'FY25'];
const colors = C.palette.slice(0, 4);

// [group, short name, full name, year, deal, consideration, goodwill, goodwill %]
const deals = [
  ['HCG', 'Suchirayu', 'Suchirayu Health Care Solutions (Hubli)', 'FY22', '60.88% allotment (78.60% total)', 69, 28, 40],
  ['HCG', 'Triesta/Strand', 'Triesta / Strand Diagnostic Business', 'FY22', 'Business Transfer Agreement', 74, 56, 76],
  ['HCG', 'SRJ & Amrish', 'SRJ Health Care & Amrish Oncology (Indore)', 'FY24', 'Slump sale', 48, 42, 88],
  ['HCG', 'Vizag', 'Vizag Hospital (VHCRPL)', 'FY25', '51% controlling stake', 206, 207, 100],

  ['Baby Memorial', 'Genesis', 'Genesis Institute of Medical Science (Kannur)', 'FY23', '100% equity', 148, 144, 98],
  ['Baby Memorial', 'Thodupuzha', 'Thodupuzha Division (Chazhikattu Hospital)', 'FY25', 'Slump sale', 150, 25, 16],
  ['Baby Memorial', 'Payyanur', 'Payyanur Medical Service & Research Centre', 'FY25', '88.98% equity', 49, 31, 63],

  ['QCIL (Care)', 'Thumbay', 'Thumbay Hospital New Life (Hyderabad)', 'FY23', '100% slump sale', 20, 2, 9],
  ['QCIL (Care)', 'CHL Indore', 'Convenient Hospitals Ltd (Indore)', 'FY23', '95% equity', 379, 214, 57],
  ['QCIL (Care)', 'UCIMS', 'United Ciigma Institute of Medical Sciences (Aurangabad)', 'FY23', '76.06% equity', 359, 355, 99],
  ['QCIL (Care)', 'Condis/KIMS', 'Condis India Healthcare & KIMSHEALTH', 'FY24', '80.19% Condis / 69.71% KIMS', 2382, 1860, 78],

  ['Max Healthcare', 'Radiant merger', 'Radiant Life Care / Max Healthcare Composite Merger', 'FY21', 'Composite merger / reverse acquisition', 3987, 2037, 51],
  ['Max Healthcare', 'Alexis', 'Alexis Multi-Speciality Hospital', 'FY24', '100% equity', 372, 221, 59],
  ['Max Healthcare', 'Starlit/Sahara', 'Starlit Medical Centre / Sahara Hospital', 'FY24', 'Slump sale BTA / 100% equity', 198, 243, 123],
  ['Max Healthcare', 'Jaypee', 'Jaypee Healthcare Ltd', 'FY25', '100% equity via CIRP', 625, 570, 91]
];

// Deals sharing a group + year form one cluster, laid out in px once bubble sizes are known
const cells = {};
deals.forEach(d => (cells[d[0] + d[3]] ??= []).push(d));

// Grain: each colour becomes a tiling canvas of itself with per-pixel lightness noise,
// drawn at device resolution so the grain stays one screen pixel fine
const dpr = window.devicePixelRatio || 1;
function grain(hex) {
  const n = Math.round(128 * dpr), cv = document.createElement('canvas');
  cv.width = cv.height = n;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, n, n);
  const img = ctx.getImageData(0, 0, n, n), px = img.data;
  for (let i = 0; i < px.length; i += 4) {
    const j = (Math.random() - 0.5) * 14;
    px[i] += j; px[i + 1] += j; px[i + 2] += j;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}
const grains = colors.map(grain);
// ECharts draws a symbol as a 2-unit shape scaled up to symbolSize, which would stretch the
// pattern too, so counter-scale it per bubble
const grainFill = (gi, px) => ({ image: grains[gi], repeat: 'repeat', scaleX: 2 / (px * dpr), scaleY: 2 / (px * dpr) });

const el = document.getElementById('chart');

function option() {
  const w = el.clientWidth;
  const narrow = w < 560;
  const gridLeft = narrow ? 96 : 130, gridRight = 16;
  // Bubble sizes were tuned for a ~165px year column; scale down with the column
  const slot = (w - gridLeft - gridRight) / 6;
  const k = Math.min(1, slot / 165);
  const showLabels = k >= 0.6;
  const size = pct => (44 + pct * 0.62) * k;

  // Pack each cluster side by side with a slight overlap so same-year deals read as one group,
  // tighter than the gap to the neighbouring year; capped so a cluster can't run into the next year
  const pos = new Map();
  Object.values(cells).forEach(list => {
    const r = list.map(d => size(d[7]) / 2);
    const links = r.slice(1).reduce((t, ri, i) => t + r[i] + ri, 0);
    const f = links ? Math.min(0.92, (1.2 * slot - r[0] - r[r.length - 1]) / links) : 0;
    const xs = [0];
    for (let i = 1; i < r.length; i++) xs.push(xs[i - 1] + (r[i - 1] + r[i]) * f);
    const mid = (xs[0] - r[0] + xs[xs.length - 1] + r[r.length - 1]) / 2;
    list.forEach((d, i) => pos.set(d, years.indexOf(d[3]) + (xs[i] - mid) / slot));
  });
  // larger bubbles first so overlapping smaller ones are drawn in front
  const seriesData = groups.map((g, gi) => deals.filter(d => d[0] === g)
    .sort((a, b) => b[7] - a[7])
    .map(d => ({
      value: [pos.get(d), groups.indexOf(g), d[7]],
      itemStyle: { color: grainFill(gi, size(d[7])) },
      short: d[1], full: d[2], year: d[3], deal: d[4], cons: d[5], gw: d[6]
    })));

  const series = groups.map((g, gi) => ({
    name: g,
    type: 'scatter',
    // opaque (scatter defaults to 0.8) so the row lines don't show through
    itemStyle: { color: colors[gi], opacity: 1, borderColor: C.bg, borderWidth: 1.5 },
    symbolSize: v => size(v[2]),
    emphasis: { scale: 1.07, itemStyle: { opacity: 1, borderColor: 'rgba(255,255,255,0.45)', borderWidth: 1.5 } },
    label: {
      show: showLabels,
      position: 'inside',
      // goodwill % only; deal names are in the tooltip
      formatter: p => `${p.value[2]}%`,
      fontFamily: F.bold, fontWeight: 'bold', fontSize: 12, color: C.onFill
    },
    data: seriesData[gi],
    z: 10 // above the row-guide markLine (markLine defaults to z 5)
  }));

  // row guides through each company's row, labelled at the left like the Lightrock year rows;
  // kept in their own series at a lower z so the bubbles sit on top of the lines
  series.push({
    type: 'scatter', data: [], silent: true, z: 1,
    markLine: {
      silent: true, symbol: 'none',
      label: { show: true, position: 'start', distance: 12, formatter: p => groups[p.value], ...KEN.axisLabelBold, fontSize: narrow ? 12 : 14 },
      lineStyle: { color: C.grid, width: 0.8, type: 'solid' },
      data: groups.map((_, i) => ({ yAxis: i }))
    },
    // faint bands on alternate years so each bubble's year column is clear
    markArea: {
      silent: true,
      itemStyle: { color: 'rgba(92,74,74,0.05)' },
      data: [1, 3].map(i => [{ xAxis: i - 0.5 }, { xAxis: i + 0.5 }])
    }
  });

  return {
    textStyle: { fontFamily: F.body },
    grid: { left: gridLeft, right: gridRight, top: 10, bottom: 36 },
    tooltip: {
      ...KEN.tooltip,
      formatter: p => KEN.tt.name(p.data.full)
        + KEN.tt.meta(`${p.seriesName} · ${p.data.year}`)
        + KEN.tt.meta(p.data.deal)
        + KEN.tt.rule(
            KEN.tt.line('Consideration', `₹${p.data.cons} Cr`)
          + KEN.tt.line('Goodwill', `₹${p.data.gw} Cr`)
          + KEN.tt.line('Goodwill %', `${p.value[2]}%`))
    },
    xAxis: {
      type: 'value', min: -1, max: 5, interval: 1,
      axisLabel: { ...KEN.axisLabelBold, fontSize: narrow ? 12 : 14, formatter: v => years[v] ?? '' },
      axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }
    },
    yAxis: {
      type: 'value', min: -0.6, max: 3.6, interval: 1, inverse: true,
      axisLabel: { show: false },
      axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }
    },
    series
  };
}

KEN.whenFontsReady(() => {
  const chart = echarts.init(el);
  chart.setOption(option());
  window.addEventListener('resize', () => { chart.resize(); chart.setOption(option()); });
});
</script>
</body>
</html>
