<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightrock Timeline - Adaptive Professional</title>
    <style>
        @font-face { font-family: 'Jazmin Alt'; src: local('Georgia'); font-weight: bold; }
        @font-face { font-family: 'GT America Bold'; src: local('Arial'); font-weight: bold; }
        @font-face { font-family: 'GT America'; src: local('Arial'); font-weight: 300; }

        :root {
            --bg-color: #EDE8DC;
            --text-main: #1A1208;
            --text-muted: #6E6050;
            --accent-line: #C8BFAA;
            --node-color: #a02c2c;
            --line-y: 320px;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'GT America', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        h1 {
            margin-top: 30px;
            font-family: 'Jazmin Alt', serif;
            font-size: clamp(28px, 5vw, 42px);
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-align: center;
        }

        .title-line {
            width: 90%;
            max-width: 1200px;
            height: 1.5px;
            margin-bottom: 30px;
        }

        /* --- DESKTOP LAYOUT --- */
        .timeline-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 455px;
            display: flex;
            justify-content: center;
        }

        .horizontal-line {
            position: absolute;
            top: var(--line-y);
            width: 90%;
            height: 1.5px;
            background: var(--text-muted);
            z-index: 1;
        }

        .horizontal-line::before,
        .horizontal-line::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5px;
            height: 12px;
            background: var(--text-muted);
        }

        .horizontal-line::before { left: 0; }
        .horizontal-line::after  { right: 0; }

        .columns-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .column {
            width: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .column:nth-child(even) .top-content { transform: translateY(-20px); }

        .top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease;
        }

        .year {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            margin-top: 40px;
        }

        .img-wrapper {
            width: 70px;
            height: 160px;
            position: relative;
            /* Establish stacking context so z-index on mask works */
            isolation: isolate;
        }

        .img-mask {
            /* Use transform-based scaling instead of width change to prevent jitter */
            width: 200px;
            height: 130%;
            overflow: hidden;
            position: absolute;
            /* Center the mask; it's always 200px wide */
            left: 50%;
            transform: translateX(-50%) scaleX(0.35);
            transform-origin: center center;
            transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1),
                        box-shadow 0.5s ease;
            background-color: #ccc;
        }

        .img-mask img {
            /* Fill the mask completely — no positional jitter */
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%);
            /* Counter-scale the image so it doesn't stretch with the mask */
            transform: scaleX(calc(1 / 0.35));
            transform-origin: center center;
            transition: filter 0.5s ease,
                        transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .column:hover .img-mask {
            transform: translateX(-50%) scaleX(1);
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .column:hover .img-mask img {
            filter: grayscale(0%);
            transform: scaleX(1);
        }

        .connector {
            width: 1px;
            position: absolute;
            top: 280px;
            bottom: calc(450px - var(--line-y));
            border-left: 1.5px dashed var(--accent-line);
        }

        .column:nth-child(even) .connector { top: 260px; }

        .node-dot {
            position: absolute;
            top: var(--line-y);
            width: 14px;
            height: 14px;
            background: var(--node-color);
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }

        .text-area {
            position: absolute;
            top: calc(var(--line-y) + 26px);
            width: 140px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            margin-top: 15px;
        }

        .event-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .event-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        /* --- MOBILE ADAPTIVE OVERRIDES --- */
        @media (max-width: 768px) {
            .timeline-container { height: auto; padding: 20px 0; }
            .horizontal-line, .connector { display: none; }

            .columns-container {
                flex-direction: column;
                align-items: flex-start;
                padding-left: 50px;
                gap: 50px;
                width: 85%;
                position: relative;
            }

            .columns-container::before {
                content: '';
                position: absolute;
                left: 20px;
                top: 0;
                bottom: 0;
                width: 1.5px;
                background: var(--text-muted);
            }

            .column {
                flex-direction: column;
                width: 100%;
                align-items: flex-start;
                text-align: left;
                position: relative;
            }

            .column:nth-child(even) .top-content { transform: none; }

            .top-content {
                order: 1;
                flex-direction: column;
                align-items: flex-start;
                margin-left: 0;
                flex: 1;
                min-width: 0;
            }

            .year {
                margin-top: 0;
                font-size: 16px;
                margin-bottom: 4px;
                font-weight: bold;
            }

            .top-content .img-wrapper { display: none; }

            .text-area {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                order: 2;
                text-align: left;
                padding-left: 0;
                width: auto;
                flex: 1;
                min-width: 0;
            }

            .mobile-img {
                display: block;
                order: 3;
                width: 100%;
                height: 120px;
                flex-shrink: 0;
                overflow: hidden;
                border-radius: 4px;
                margin-top: 10px;
            }

            .mobile-img img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: grayscale(100%);
                transition: filter 0.5s ease;
                display: block;
            }

            .column:hover .mobile-img img { filter: grayscale(0%); }

            .mobile-left {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-width: 0;
                order: 1;
                margin-top: 8px;
            }

            .node-dot {
                left: -37px;
                top: 10px;
                transform: none;
                position: absolute;
            }
        }

        .mobile-img { display: none; }

        /* --- FOOTER --- */
        .footer {
            margin-top: 50px;
            border-top: 1.5px solid var(--accent-line);
            padding-top: 15px;
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-logo {
            height: 18px;
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Historic Timeline</h1>
    <div class="subtitle">Tracing the evolution of Lightrock's investment journey</div>
    <div class="title-line"></div>

    <div class="timeline-container" id="timeline-wrapper">
        <div class="horizontal-line"></div>
        <div id="timeline-content" class="columns-container"></div>
    </div>

    <div class="footer">
        <div><img src="logo.png" alt="The Ken" class="footer-logo"></div>
        <div>Created by Anuj, 2026</div>
        <div>Updated 2026</div>
    </div>

    <script>
        const data = [
            { year: '2013', title: 'Aspada set up', desc: 'Initial founding and mission strategy.', img: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=600' },
            { year: '2019', title: 'Acquisition by LGT', desc: '15 investments, $100 mln in assets.', img: 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=600' },
            { year: '2021', title: 'Rebranded Lightrock', desc: 'Spun out of LGT group.', img: 'https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&q=80&w=600' },
            { year: '2023', title: 'Rapid Scaling', desc: '27 companies, $400 mln in 18 months.', img: 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=600' },
            { year: '2025', title: 'Leadership Transition', desc: 'New partner Samir Abhyankar appointed.', img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&q=80&w=600' }
        ];

        const container = document.getElementById('timeline-content');

        container.innerHTML = data.map(item => `
            <div class="column">
                <div class="node-dot"></div>
                <div class="mobile-left">
                    <div class="top-content">
                        <div class="year">${item.year}</div>
                        <div class="img-wrapper">
                            <div class="img-mask">
                                <img src="${item.img}" alt="${item.title}">
                            </div>
                        </div>
                    </div>
                    <div class="text-area">
                        <div class="event-title">${item.title}</div>
                        <div class="event-desc">${item.desc}</div>
                    </div>
                </div>
                <div class="connector"></div>
                <div class="mobile-img">
                    <img src="${item.img}" alt="${item.title}">
                </div>
            </div>
        `).join('');

        function applyMobileCaps() {
            const wrapper = document.getElementById('timeline-wrapper');
            if (window.innerWidth <= 768) {
                wrapper.classList.add('mobile-caps');
            } else {
                wrapper.classList.remove('mobile-caps');
            }
        }
        applyMobileCaps();
        window.addEventListener('resize', applyMobileCaps);
    </script>
</body>
</html>
