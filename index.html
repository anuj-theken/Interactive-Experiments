<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Paints Data Viz</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --accent: #0066cc;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { font-weight: 600; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: var(--text-sub); }

        /* Toggle / Tab Bar */
        .tab-bar {
            display: flex;
            background: #e4e4e7;
            border-radius: 14px;
            padding: 5px;
            gap: 4px;
            margin-bottom: 40px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-sub);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Grid Layout */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* Card Styling */
        .card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.2s ease;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card.hidden {
            display: none;
        }

        .thumbnail {
            width: 100%;
            height: 160px;
            background-color: #eee;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0 0 8px 0;
        }

        .card-path {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-family: 'Courier New', Courier, monospace;
        }

        .empty-state {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-sub);
            padding: 60px 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Ken's interactive charts</h1>
        <p>Visualizations generated using data from different stories.</p>
    </header>

    <!-- Category Toggle -->
    <div class="tab-bar">
        <button class="tab-btn active" data-category="intermission-ep2">Intermission Ep. 2</button>
        <button class="tab-btn" data-category="intermission-ep1">Intermission Ep. 1</button>
        <button class="tab-btn" data-category="editorial">Editorial</button>
    </div>

    <div class="project-grid" id="projectGrid">
        <p class="empty-state" id="emptyState">No visualizations in this category yet.</p>
    </div>

    <script>
        // --- ADD YOUR PROJECTS HERE ---
        // category options: "editorial" | "intermission-ep1" | "intermission-ep2"
        const projects = [
          {
              name: "Loan Callout",
              path: "BF/growth_anim/index.html",
              thumb: "growth_anim.png",
              category: "intermission-ep2"
          },
          {
              name: "0% EMI / Alt",
              path: "BF/no_costEMI/index_alt.html",
              thumb: "emi0_alt.png",
              category: "intermission-ep2"
          },
          {
              name: "StockValue",
              path: "BF/stockValue/index.html",
              thumb: "stock_BF.png",
              category: "intermission-ep2"
          },
          {
              name: "Product Suite",
              path: "BF/Product_Suite/index_alt.html",
              thumb: "product_suite.png",
              category: "intermission-ep2"
          },
          {
              name: "marketCap_Treemap",
              path: "BF/Cap_Treemap/index.html",
              thumb: "treemap.png",
              category: "intermission-ep2"
          },
          {
              name: "Corporate_tree",
              path: "BF/Coporate_Tree/index_alt.html",
              thumb: "corporate_tree.png",
              category: "intermission-ep2"
          },
            {
                name: "Top 6 Families",
                path: "Editorial/Top_6_families/story.html",
                thumb: "top_6.png",
                category: "editorial"
            },
            {
              name: "UnderseaCables",
              path: "Editorial/UnderseaCables/index.html",
              thumb: "undersea.png",
              category: "editorial"
          },
          {
              name: "Family Tree",
              path: "BF/Family_Tree/index.html",
              thumb: "bf_family.png",
              category: "intermission-ep2"
          },
            {
                name: "Timeline",
                path: "Editorial/Lightrock_Investment_Potfolio/timeline.html",
                thumb: "timeline_icon.png",
                category: "editorial"
            },
            {
                name: "Investment Portfolio",
                path: "Editorial/Lightrock_Investment_Potfolio/Lightrock_Investment_Chart_Arundhati/index.html",
                thumb: "beads.png",
                category: "editorial"
            },
            {
                name: "Sides Crushing",
                path: "AP/Crushing/index.html",
                thumb: "crush.png",
                category: "intermission-ep1"
            },
            {
                name: "ColorNext",
                path: "AP/Wheel of Knowledge/index.html",
                thumb: "wheel.png",
                category: "intermission-ep1"
            },
            {
                name: "Timeline of Hires",
                path: "AP/Timeline of Hire/index.html",
                thumb: "timelinehuire.png",
                category: "intermission-ep1"
            },
            {
                name: "Final Timeline",
                path: "AP/Timeline/index.html",
                thumb: "timetime.png",
                category: "intermission-ep1"
            },
            {
                name: "Asian Paints IPO vs Nifty50",
                path: "AP/IPO/index.html",
                thumb: "ipo.png",
                category: "intermission-ep1"
            },
            {
                name: "Asian Paints CFOA",
                path: "AP/Asian_Paints_CFOA/index.html",
                thumb: "piechart.png",
                category: "intermission-ep1"
            },
            {
                name: "Asian Paints Revenue Growth",
                path: "AP/V9.2_Chart_AP rev/index.html",
                thumb: "asianpaintsrevenue.png",
                category: "intermission-ep1"
            },
        ];

        const grid = document.getElementById('projectGrid');
        const emptyState = document.getElementById('emptyState');
        let activeCategory = "intermission-ep2";

        // Build all cards once
        projects.forEach(project => {
            const card = document.createElement('a');
            card.href = project.path;
            card.className = 'card';
            card.dataset.category = project.category;

            card.innerHTML = `
                <div class="thumbnail" style="background-image: url('${project.thumb}')"></div>
                <div class="card-content">
                    <h3 class="card-title">${project.name}</h3>
                    <div class="card-path">${project.path}</div>
                </div>
            `;

            grid.appendChild(card);
        });

        function filterCards(category) {
            const cards = grid.querySelectorAll('.card');
            let visibleCount = 0;

            cards.forEach(card => {
                if (card.dataset.category === category) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // Tab click handlers
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.dataset.category;
                filterCards(activeCategory);
            });
        });

        // Init
        filterCards(activeCategory);
    </script>
</body>
</html>
