<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Comp 2026 — Poster surface</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f1e9;color:#111;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

.interactive{position:fixed;inset:0;display:block;background:#f4f1e9;overflow:hidden;touch-action:none;cursor:grab;z-index:5}
.interactive:active{cursor:grabbing}
.interactive.locked{cursor:default}
.surface{position:absolute;left:0;top:0;transform-origin:0 0;
  background:linear-gradient(90deg,#00000007 1px,transparent 1px),linear-gradient(#00000007 1px,transparent 1px);background-size:120px 120px}

/* -- clusters (opportunity spaces) — no colour, no box; every cluster's
   posters merge into one contiguous mass, and the only cue to where one
   opportunity space ends and the next begins is its centred label -- */
.clusterLabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;letter-spacing:-.01em;text-transform:none;text-align:center;
  background:#f7f4ecf2;border:1px solid #1112;padding:8px 12px;border-radius:8px;box-shadow:0 10px 28px #0002;pointer-events:none;z-index:3;transition:opacity .3s ease}
.clusterLabel.hidden,.clusterLabel.hoverHidden{opacity:0}
.clusterLabel .clHead{display:flex;align-items:center;gap:6px}
.clusterLabel .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.clusterLabel b{font-weight:800;min-width:0;overflow-wrap:break-word;word-break:break-word;line-height:1.18}
.clusterLabel .count{font-size:12px;font-weight:400;opacity:.5}

/* -- poster cards — absolutely positioned, edge-to-edge, no gap -- */
.card{position:absolute;overflow:hidden;background:#f4f1e9;cursor:pointer;transition:box-shadow .18s ease,opacity .25s ease,border-color .3s ease;z-index:2}
.card:hover{box-shadow:inset 0 0 0 2px #111,0 16px 34px #0004;z-index:6}
.card img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(var(--zoomCover,1));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
/* selecting/highlighting a poster reveals the full, un-cropped image —
   scaling its already-contained image back down to 1 instead of an
   instant, non-animatable object-fit swap */
.card.selected img,.card.emotionMatch img,.card.storyTarget img{transform:scale(1)}
.card.empty{background:repeating-linear-gradient(135deg,#dcd8cd,#dcd8cd 6px,#d3cfc3 6px,#d3cfc3 12px);display:flex;align-items:center;justify-content:center}
.card.empty .emptyNo{font-size:10px;letter-spacing:.06em;color:#8b8677;background:#f4f1e9cc;padding:3px 7px;border-radius:20px}
.catTint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:var(--cc);opacity:.34;transition:opacity .3s ease}
.surface.labelsHidden .catTint{opacity:0}
/* an emotion filter is active — the cluster colour scheme is switched
   off everywhere (not just on matched cards), at every zoom level, so
   it never competes with the emotion overlay */
.surface.emotionFilterActive .catTint{opacity:0!important}
/* fillers are pure layout padding (they keep each cluster's region solid
   and correctly shaped on the grid) — flat like a real card, not striped
   like .card.empty, so they never read as an unsourced poster */
.filler{position:absolute;overflow:hidden;pointer-events:none;background:#f4f1e9}
/* emotion match — a solid colour wash plus a slim inset ring, entirely
   inside the card's own box (no outward glow/spread), so a matched
   card never reads as bigger than its neighbours */
.card .halo{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:multiply;transition:opacity .3s ease;
  background-color:color-mix(in srgb,var(--hc) 62%,transparent)}
.card.emotionMatch .halo{opacity:1}
.card.emotionMatch{box-shadow:inset 0 0 0 5px var(--hc),inset 0 0 0 7px #fff,0 4px 16px #0004;z-index:7}
.card.emotionMatch:hover{box-shadow:inset 0 0 0 5px var(--hc),inset 0 0 0 7px #fff,0 16px 34px #0005;z-index:8}
.card.filteredOut{opacity:.07;pointer-events:none}
.interactive.panelOpen .card{opacity:.12}
.interactive.panelOpen .card.filteredOut{opacity:.03}
.interactive.panelOpen .card.selected{opacity:1;box-shadow:0 0 0 3px #f7f4ec,0 22px 50px #0006;z-index:9}
.card.selected .catTint{opacity:0!important}
/* the poster the story is currently talking about — unmistakable among
   its similarly-sized neighbours regardless of zoom or tint state */
.card.storyTarget{box-shadow:0 0 0 3px #f7f4ec,0 0 0 5px #1c140f,0 14px 34px #0006;z-index:9}
.card.storyTarget .catTint{opacity:0!important}

/* -- header / minimap -- */
.hud{position:absolute;left:22px;top:20px;z-index:15;pointer-events:none}
.captionBadge{display:inline-block;background:#f7f4ecf2;border:1px solid #1112;padding:11px 20px;box-shadow:0 8px 24px #0002;pointer-events:auto}
.captionBadge h2{margin:0;font-size:clamp(17px,2vw,24px);line-height:1;letter-spacing:.01em}
.captionBadge p{margin:6px 0 0;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
.minimap{margin-top:10px;width:210px;height:132px;background:#f7f4ecf2;border:1px solid #1112;box-shadow:0 8px 24px #0002;position:relative;overflow:hidden;pointer-events:auto;cursor:crosshair}
.minimap .mmShape{position:absolute;background:#111;opacity:.4}
.minimap .mmViewport{position:absolute;border:1.5px solid #111;background:#1111;pointer-events:none}

/* -- filters panel -- */
.filters{position:fixed;right:20px;top:20px;z-index:40;width:236px;background:#f7f4ecf2;border:1px solid #1112;box-shadow:0 8px 24px #0002;padding:16px 16px 14px;max-height:calc(100vh - 40px);overflow-y:auto}
.filters h3{margin:0 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.filtersTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.filtersTop button{appearance:none;border:1px solid #1113;background:transparent;color:#111;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;cursor:pointer}
.filtersTop button:hover{background:#111;color:#fff}
.filterGroup{margin-bottom:14px}
.filterGroup .label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #1113;background:#fff9;padding:5px 9px;border-radius:20px;font-size:11px;cursor:pointer;user-select:none;transition:background .15s,color .15s,border-color .15s}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.on{background:#111;color:#fff;border-color:#111}
.chip.on .dot{box-shadow:0 0 0 1.5px #fff}
.cityList{max-height:150px;overflow-y:auto;border:1px solid #1111;background:#fff8;padding:4px}
.cityRow{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 5px;cursor:pointer;border-radius:3px}
.cityRow:hover{background:#1111}
.cityRow input{margin:0}
.cityRow span.n{margin-left:auto;opacity:.45;font-size:10px}

/* -- hover preview (first response, quick peek) -- */
.hoverPreview{position:fixed;z-index:50;max-width:270px;background:#111;color:#f7f4ec;padding:11px 14px;font-size:12px;line-height:1.45;border-radius:7px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;box-shadow:0 12px 30px #0004}
.hoverPreview.show{opacity:1;transform:translateY(0)}
.hoverPreview .hp-meta{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.hoverPreview .hp-meta .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}

/* -- story dialogue bubble — one respondent, one quote, always over a
   zoomed-in poster (reused camera engine, never pulls back to overview) -- */
.storyPopup{position:fixed;left:50%;top:6%;transform:translateX(-50%) translateY(-6px);width:min(300px,80vw);background:#1c140f;color:#f3ece2;border-radius:12px;box-shadow:0 20px 50px #0005;padding:15px 17px 13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .4s ease,transform .4s ease,top .3s ease}
.storyPopup.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.storyPopup::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #1c140f}
.storyTitle{margin:0 0 10px;font-size:12.5px;font-weight:500;font-style:italic;line-height:1.42}
.storyTitle::before{content:'\201C'}
.storyTitle::after{content:'\201D'}
.storyText{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:9px;letter-spacing:.02em;opacity:.68}
.storyNav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.storyNav button{appearance:none;border:1px solid #f3ece255;background:transparent;color:#f3ece2;padding:8px 7px;font:inherit;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:4px}
.storyNav button:hover{background:#f3ece2;color:#1c140f}
.storyNav button:disabled{opacity:.25;cursor:default;pointer-events:none}
.storyNav button.primary{grid-column:1/-1;background:#f3ece2;color:#1c140f}
.storyNav button.primary:hover{background:#fff}
@media(max-width:640px){.storyPopup{width:78vw;top:6%}}

/* -- intro/narrator dialogue — a second bubble (a narrator/host voice,
   not a respondent) that appears TOGETHER with the story quote above,
   pinned to the bottom-left corner of the viewport regardless of where
   the quote bubble or poster sit; it alone carries the Next/Back nav
   for the whole sequence -- */
.introPopup{position:fixed;left:24px;bottom:24px;width:min(300px,80vw);background:#f7f4ec;color:#1c140f;border-radius:12px;box-shadow:0 20px 50px #0004;padding:15px 17px 13px;z-index:60;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .4s ease,transform .4s ease;border:1px solid #1112}
.introPopup.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.introTitle{margin:0 0 12px;font-size:14.5px;font-weight:700;letter-spacing:-.005em;line-height:1.35}
.introNav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.introNav button{appearance:none;border:1px solid #1c140f33;background:transparent;color:#1c140f;padding:9px 7px;font:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:4px}
.introNav button:hover{background:#1c140f;color:#f7f4ec}
.introNav button:disabled{opacity:.25;cursor:default;pointer-events:none}
.introNav button.primary{grid-column:1/-1;background:#1c140f;color:#f7f4ec}
.introNav button.primary:hover{background:#000}
@media(max-width:640px){.introPopup{width:82vw}}

/* -- side panel (responses) -- */
/* the canvas already dims itself when the panel is open (every card but
   the selected one drops to low opacity, above) — this backdrop is only
   a click target to close the panel, not a second dimming layer, so it
   stays fully transparent and never darkens the selected poster */
.modal{position:fixed;inset:0;display:block;visibility:hidden;pointer-events:none;background:transparent;z-index:100}
.modal.show{visibility:visible;pointer-events:auto}
.modal-backdrop{position:absolute;inset:0;background:transparent}
.side-panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,94vw);height:100vh;display:flex;flex-direction:column;background:#f7f4ec;transform:translate3d(105%,0,0);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px #0003;overflow:hidden}
.modal.show .side-panel{transform:translate3d(0,0,0)}
.panel-scroll{flex:1 1 auto;overflow-y:auto;padding:56px 26px 30px}
.panel-kicker{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.panel-kicker .dot{width:8px;height:8px;border-radius:50%}
.panel h3{margin:0 0 4px;font-size:21px;font-weight:600;line-height:1.15}
.panel .sub{margin:0 0 18px;font-size:11.5px;opacity:.5}
.respList{display:flex;flex-direction:column;gap:12px}
.resp{background:#fff;border-radius:11px;padding:15px 17px;box-shadow:0 3px 12px #0001}
.resp .meta{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.45;margin-bottom:4px}
.resp p{margin:0;line-height:1.5}
.resp.t0{background:#111;color:#f7f4ec;padding:19px 21px;border-radius:13px;box-shadow:0 14px 30px #0002;margin-bottom:2px}
.resp.t0 .meta{opacity:.55;color:#f7f4ec}
.resp.t0 p{font-size:16.5px;font-weight:600;line-height:1.46}
.resp.t1{background:#fdfcf8}
.resp.t1 p{font-size:13.5px;opacity:.82}
.resp.t2{background:#f2efe6;box-shadow:none}
.resp.t2 p{font-size:12px;opacity:.62}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;cursor:pointer;background:#fff;font-size:19px;z-index:4;box-shadow:0 4px 10px #0002}
@media(max-width:640px){.filters{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:40vh}.hud{top:12px;left:12px}.minimap{width:150px;height:96px}}
</style>
</head>
<body>

<div id="interactive" class="interactive locked">
  <div id="surface" class="surface"></div>
</div>

<div class="hud">
  <div class="captionBadge">
    <h2>Case Comp 2026</h2>
    <p id="hudHint">Scroll to move · ⌘/ctrl+scroll to zoom · click a poster</p>
  </div>
  <div id="minimap" class="minimap">
    <div id="mmClusters"></div>
    <div id="mmViewport" class="mmViewport"></div>
  </div>
</div>

<div id="hoverPreview" class="hoverPreview"></div>

<div class="filters">
  <div class="filtersTop"><h3>Filters</h3><button id="resetFilters" type="button">Reset</button></div>

  <div class="filterGroup">
    <div class="label">Emotion</div>
    <div class="chips" id="emotionChips"></div>
  </div>

  <div class="filterGroup">
    <div class="label">Age</div>
    <div class="chips" id="ageChips"></div>
  </div>

  <div class="filterGroup">
    <div class="label">Location</div>
    <div class="cityList" id="cityList"></div>
  </div>
</div>

<div id="introPopup" class="introPopup">
  <p class="introTitle" id="introTitle">Hi there!</p>
  <div class="introNav">
    <button id="introBackBtn" type="button">← Back</button>
    <button id="introNextBtn" type="button">Next →</button>
  </div>
</div>

<div id="storyPopup" class="storyPopup">
  <p class="storyTitle" id="storyTitle">Quote</p>
  <div class="storyText">
    <span id="storyRespondent"></span>
    <span id="storyDemo"></span>
  </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <aside class="side-panel" role="dialog" aria-modal="true" aria-label="Poster responses">
    <button id="close" class="close" aria-label="Close">×</button>
    <div class="panel-scroll">
      <div class="panel-kicker" id="panelKicker"></div>
      <h3 id="panelTitle"></h3>
      <p class="sub" id="panelSub"></p>
      <div class="respList" id="respList"></div>
    </div>
  </aside>
</div>

<script src="poster_data.js?v=20260915"></script>
<script>
(()=>{
const interactive=document.querySelector('#interactive'), surface=document.querySelector('#surface');
const {posters, meta}=window.POSTER_DATA;
const postersByNo=new Map(posters.map(p=>[p.no,p]));
function truncate(s,n){ s=s||''; return s.length>n ? s.slice(0,n).trimEnd()+'…' : s; }

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function posterImgSrc(file){return encodeURI('case comp ad posters/'+file)}

const FEELING_COLORS={
  'Frustration':'#b91c1c','Overwhelm':'#6d28d9','Procrastinate':'#1d4ed8',
  'Repetitive':'#047857','No feeling':'#9a9284'
};
function feelingColor(f){return FEELING_COLORS[f]||'#9a9284'}

const opportunitySpaces=meta.opportunitySpaces.map(o=>o.name);

/* ---------------------------------------------------------------------
   SEEDED REGION GROWTH — one solid diamond made of a single uniform
   grid. Every grid cell inside the diamond mask gets claimed by exactly
   one opportunity space via flood-fill growth from a seed cell, so the
   whole diamond fills edge to edge with no internal voids, and every
   cluster is a contiguous, organically-edged region rather than a rigid
   rectangle. Posters stay upright throughout — nothing here rotates the
   surface, and the camera/pan/zoom math below is untouched.
--------------------------------------------------------------------- */
const CARD_GAP=5, CELL_W=80, CELL_H=120;
const byCluster={};
opportunitySpaces.forEach(name=>byCluster[name]=[]);
posters.forEach(p=>byCluster[p.opportunitySpace].push(p));
const sortedNames=[...opportunitySpaces].sort((a,b)=>byCluster[b].length-byCluster[a].length);
const targetCount={};
sortedNames.forEach(name=>{ targetCount[name]=byCluster[name].length; });

function cellKey(c,r){ return c+','+r; }
const NEI4=[[1,0],[-1,0],[0,1],[0,-1]];

// -- 1. diamond mask: grow halfW/halfH (slightly taller than wide, like
//    the reference) until the inside-cell count covers every poster --
const DIAMOND_ASPECT=1.08;
let gcx=0, gcy=0, gridCols=0, gridRows=0;
const insideCells=[];
for(let hw=4; hw<80; hw++){
  const hh=hw*DIAMOND_ASPECT;
  const gc=Math.ceil(hw), gr=Math.ceil(hh);
  const cols=2*gc+1, rows=2*gr+1;
  const cells=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const d=Math.abs(c-gc)/hw+Math.abs(r-gr)/hh;
      if(d<=1) cells.push({col:c,row:r,d});
    }
  }
  if(cells.length>=posters.length){
    gcx=gc; gcy=gr; gridCols=cols; gridRows=rows;
    // the diamond mask overshoots posters.length by a handful of cells
    // (the next size down is always too small) — trim to exactly
    // posters.length by dropping the cells closest to the boundary
    // first, so every inside-cell gets a real poster and there's no
    // filler left to invent. d only grows moving outward from centre
    // within a row, so this always trims from each row's ends inward —
    // rows stay a single contiguous run of columns (relied on below by
    // the minimap silhouette).
    cells.sort((a,b)=>a.d-b.d);
    insideCells.push(...cells.slice(0,posters.length));
    break;
  }
}
const coordOf=new Map(insideCells.map(c=>[cellKey(c.col,c.row),c]));
const freeCells=new Set(coordOf.keys());
const cellOwner=new Map();

// -- 2. one seed per cluster: biggest cluster seeds at the centre; every
//    later seed is the free cell that maximises its distance from all
//    earlier seeds (farthest-point sampling), so seeds start spread out
//    and their regions grow into each other rather than one swallowing
//    the rest --
const seeds=[];
sortedNames.forEach((name,i)=>{
  let bestKey=null;
  if(i===0){
    bestKey=cellKey(gcx,gcy);
  } else {
    let bestScore=-Infinity;
    freeCells.forEach(key=>{
      const {col,row}=coordOf.get(key);
      let minD=Infinity;
      seeds.forEach(s=>{ const d=Math.abs(col-s.col)+Math.abs(row-s.row); if(d<minD) minD=d; });
      if(minD>bestScore){ bestScore=minD; bestKey=key; }
    });
  }
  const c=coordOf.get(bestKey);
  seeds.push({name,col:c.col,row:c.row});
  cellOwner.set(bestKey,name);
  freeCells.delete(bestKey);
});

// -- 3. round-robin BFS growth: each cluster claims its nearest free cell
//    one at a time (not all at once), so every region grows in lockstep
//    and they meet each other with an organic, interleaved edge instead
//    of one finishing its whole shape before the next starts --
const regionQueue={}, regionCells={};
sortedNames.forEach(name=>{ regionQueue[name]=[]; regionCells[name]=[]; });
function enqueueNeighbors(name,key){
  const {col,row}=coordOf.get(key);
  NEI4.forEach(([dx,dy])=>{
    const nk=cellKey(col+dx,row+dy);
    if(coordOf.has(nk) && freeCells.has(nk)) regionQueue[name].push(nk);
  });
}
seeds.forEach(s=>{ regionCells[s.name].push(cellKey(s.col,s.row)); enqueueNeighbors(s.name,cellKey(s.col,s.row)); });

function nearestFreeCellToRegion(name){
  const visited=new Set(regionCells[name]);
  let frontier=regionCells[name].slice();
  while(frontier.length){
    const next=[];
    for(const key of frontier){
      const {col,row}=coordOf.get(key);
      for(const [dx,dy] of NEI4){
        const nk=cellKey(col+dx,row+dy);
        if(!coordOf.has(nk) || visited.has(nk)) continue;
        visited.add(nk);
        if(freeCells.has(nk)) return nk;
        next.push(nk);
      }
    }
    frontier=next;
  }
  return null;
}

let remaining=sortedNames.filter(name=>regionCells[name].length<targetCount[name]);
let guard=insideCells.length*4;
while(remaining.length && freeCells.size>0 && guard-->0){
  for(const name of remaining){
    if(regionCells[name].length>=targetCount[name]) continue;
    let claimed=null;
    while(regionQueue[name].length){
      const cand=regionQueue[name].shift();
      if(freeCells.has(cand)){ claimed=cand; break; }
    }
    if(!claimed) claimed=nearestFreeCellToRegion(name);
    if(claimed){
      cellOwner.set(claimed,name);
      freeCells.delete(claimed);
      regionCells[name].push(claimed);
      enqueueNeighbors(name,claimed);
    }
  }
  remaining=sortedNames.filter(name=>regionCells[name].length<targetCount[name]);
}

// -- 4. a handful of inside-cells can be left over once every region hit
//    its target count (the diamond mask is sized >= total posters) —
//    hand each to whichever neighbouring region borders it most, so the
//    diamond stays solid with no unclaimed holes --
guard=200;
while(freeCells.size>0 && guard-->0){
  let progressed=false;
  [...freeCells].forEach(key=>{
    const {col,row}=coordOf.get(key);
    const votes={};
    NEI4.forEach(([dx,dy])=>{
      const owner=cellOwner.get(cellKey(col+dx,row+dy));
      if(owner) votes[owner]=(votes[owner]||0)+1;
    });
    const entries=Object.entries(votes);
    if(entries.length){
      entries.sort((a,b)=>b[1]-a[1]);
      const owner=entries[0][0];
      cellOwner.set(key,owner);
      regionCells[owner].push(key);
      freeCells.delete(key);
      progressed=true;
    }
  });
  if(!progressed) break;
}

// -- 4b. colour assignment — adjacency-aware, not list-order. With this
//    many opportunity spaces, evenly spacing hues by array order can hand
//    two hues that are close on the wheel to two regions that happen to
//    sit right next to each other on the diamond, so the seam between
//    them barely reads. Build the actual region-adjacency graph from the
//    grid, then greedily hand each region the remaining hue that is
//    farthest (in hue-circle degrees) from its already-coloured
//    neighbours — regions with the most neighbours go first, since they
//    have the least room to manoeuvre. Lightness/saturation is also
//    cycled across three bands so even a same-family hue pair (unavoidable
//    once neighbour count exceeds the wheel can comfortably split) still
//    differs on a second channel.
const clusterAdj={};
opportunitySpaces.forEach(n=>clusterAdj[n]=new Set());
coordOf.forEach((c,key)=>{
  const owner=cellOwner.get(key);
  if(!owner) return;
  NEI4.forEach(([dx,dy])=>{
    const nk=cellKey(c.col+dx,c.row+dy);
    if(!coordOf.has(nk)) return;
    const nOwner=cellOwner.get(nk);
    if(nOwner && nOwner!==owner) clusterAdj[owner].add(nOwner);
  });
});
const N_SPACES=opportunitySpaces.length, HUE_STEP=360/N_SPACES;
const BANDS=[{s:78,l:38},{s:64,l:50},{s:88,l:29}];
function hueDist(a,b){ const d=Math.abs(a-b)%360; return Math.min(d,360-d); }
const colorOrder=[...opportunitySpaces].sort((a,b)=>clusterAdj[b].size-clusterAdj[a].size);
const usedHueSlots=new Set(), CLUSTER_HUE={}, CLUSTER_COLORS={};
colorOrder.forEach((name,idx)=>{
  const neighborHues=[...clusterAdj[name]].map(nb=>CLUSTER_HUE[nb]).filter(h=>h!==undefined);
  const compareHues=neighborHues.length?neighborHues:Object.values(CLUSTER_HUE);
  let bestSlot=0,bestScore=-Infinity;
  for(let slot=0;slot<N_SPACES;slot++){
    if(usedHueSlots.has(slot)) continue;
    const hue=slot*HUE_STEP;
    const score=compareHues.length?Math.min(...compareHues.map(h=>hueDist(h,hue))):0;
    if(score>bestScore){ bestScore=score; bestSlot=slot; }
  }
  usedHueSlots.add(bestSlot);
  const hue=bestSlot*HUE_STEP;
  CLUSTER_HUE[name]=hue;
  const band=BANDS[idx%BANDS.length];
  CLUSTER_COLORS[name]=`hsl(${Math.round(hue)} ${band.s}% ${band.l}%)`;
});

// -- 5. render: each region's first targetCount cells (claim order, so
//    nearest the seed first) get an actual poster — sorted by feeling
//    for internal colour coherence; any cells past that (the leftover
//    hand-outs above) are undated filler so the diamond still reads as
//    fully solid without inventing posters that don't exist --

const clusterBox={}, cardsByCluster={}, cardEls=new Map(), cardRects=new Map(), labelByName=new Map();
const labelEls=[];

sortedNames.forEach(name=>{
  const list=[...byCluster[name]].sort((a,b)=>a.feeling.localeCompare(b.feeling));
  const cells=regionCells[name];
  const mainCells=cells.slice(0,targetCount[name]);
  const extraCells=cells.slice(targetCount[name]);
  cardsByCluster[name]=[];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,sx=0,sy=0,n=0;
  const color=CLUSTER_COLORS[name];

  function accumulate(wx,wy,w,h){
    minX=Math.min(minX,wx); minY=Math.min(minY,wy);
    maxX=Math.max(maxX,wx+w); maxY=Math.max(maxY,wy+h);
    sx+=wx+w/2; sy+=wy+h/2; n++;
  }

  mainCells.forEach((key,idx)=>{
    const p=list[idx];
    const {col,row}=coordOf.get(key);
    const g=CARD_GAP;
    const wx=col*CELL_W+g/2, wy=row*CELL_H+g/2, w=CELL_W-g, h=CELL_H-g;

    const card=document.createElement('div');
    card.className='card'+(p.file?'':' empty');
    card.dataset.no=p.no;
    card.dataset.feeling=p.feeling;
    card.style.left=wx+'px'; card.style.top=wy+'px'; card.style.width=w+'px'; card.style.height=h+'px';
    card.style.setProperty('--hc', feelingColor(p.feeling));
    if(p.file){
      card.innerHTML=`<img src="${posterImgSrc(p.file)}" alt="" loading="lazy">`;
      // the <img> itself is always object-fit:contain (the whole image,
      // never cropped) and scaled up by --zoomCover to LOOK exactly like
      // a cover-crop by default; selecting/highlighting the poster just
      // animates that scale back to 1, smoothly revealing the full
      // image, instead of an instant, non-animatable object-fit swap.
      const boxAR=w/h, imgAR=p.ratio||boxAR;
      const zoomCover=Math.max(imgAR,boxAR)/Math.min(imgAR,boxAR);
      card.querySelector('img').style.setProperty('--zoomCover', zoomCover.toFixed(4));
    } else {
      card.innerHTML=`<span class="emptyNo">#${p.no}</span>`;
    }
    card.insertAdjacentHTML('beforeend', `<span class="catTint" style="--cc:${color}"></span><span class="halo"></span>`);
    surface.appendChild(card);
    cardEls.set(p.no, card);
    cardsByCluster[name].push(card);
    cardRects.set(p.no, {x:wx,y:wy,w,h,cx:wx+w/2,cy:wy+h/2});
    accumulate(wx,wy,w,h);
  });

  extraCells.forEach(key=>{
    const {col,row}=coordOf.get(key);
    const g=CARD_GAP;
    const wx=col*CELL_W+g/2, wy=row*CELL_H+g/2, w=CELL_W-g, h=CELL_H-g;
    const filler=document.createElement('div');
    filler.className='filler';
    filler.style.left=wx+'px'; filler.style.top=wy+'px'; filler.style.width=w+'px'; filler.style.height=h+'px';
    filler.insertAdjacentHTML('beforeend', `<span class="catTint" style="--cc:${color}"></span>`);
    surface.appendChild(filler);
    accumulate(wx,wy,w,h);
  });

  clusterBox[name]={left:minX, top:minY, width:maxX-minX, height:maxY-minY};

  // anchor the label to the region's own widest CONTIGUOUS row, rather
  // than its pixel centroid — many of these regions are narrow, organic
  // strips, and the centroid row can land on a pinch point too thin for
  // any label. Using the widest row for *both* position and width
  // guarantees the label sits fully inside the region (it's the same row
  // its width came from) instead of spilling into a neighbour.
  const rowSpans=new Map();
  regionCells[name].forEach(key=>{
    const c=coordOf.get(key);
    const s=rowSpans.get(c.row);
    if(!s) rowSpans.set(c.row,{min:c.col,max:c.col,count:1});
    else { s.min=Math.min(s.min,c.col); s.max=Math.max(s.max,c.col); s.count++; }
  });
  let bestRow=null,bestSpan=null,bestWidth=-1;
  rowSpans.forEach((s,row)=>{
    if(s.count!==s.max-s.min+1) return; // skip rows with a hole (not truly contiguous)
    const width=s.max-s.min+1;
    if(width>bestWidth){ bestWidth=width; bestRow=row; bestSpan=s; }
  });
  let labelX=sx/n, labelY=sy/n, rowWidthPx=maxX-minX;
  if(bestSpan){
    labelX=((bestSpan.min+bestSpan.max+1)/2)*CELL_W;
    labelY=bestRow*CELL_H+CELL_H/2;
    rowWidthPx=(bestSpan.max-bestSpan.min+1)*CELL_W-CARD_GAP*2;
  }

  // narrow, single-card-wide regions can't fit a 24px label without
  // wrapping mid-word — shrink the font to whatever the longest word in
  // the name actually needs for this row's width, rather than force a
  // fixed size that breaks every couple of characters.
  const maxW=Math.max(90,rowWidthPx*.96);
  const longestWord=Math.max(...name.split(' ').map(w=>w.length));
  const availTextPx=Math.max(28, maxW-28);
  const fontSize=clamp(availTextPx/(longestWord*.6),11,24);

  const label=document.createElement('div');
  label.className='clusterLabel';
  label.style.left=labelX+'px'; label.style.top=labelY+'px';
  label.style.maxWidth=maxW+'px';
  label.style.fontSize=fontSize.toFixed(1)+'px';
  label.innerHTML=`<span class="clHead"><span class="dot" style="background:${color}"></span><span class="count">${targetCount[name]}</span></span><b>${esc(name)}</b>`;
  surface.appendChild(label);
  labelEls.push(label);
  labelByName.set(name,label);
});

const WORLD_W=gridCols*CELL_W;
const WORLD_H=gridRows*CELL_H;
// every child of #surface is position:absolute, so without an explicit
// size #surface has no content-derived width — and an auto-width
// descendant (the wrapping cluster labels) resolves its shrink-to-fit
// width against that near-zero containing block instead of its own
// max-width, wrapping one character per line. Give it its real size.
surface.style.width=WORLD_W+'px';
surface.style.height=WORLD_H+'px';

// pop-in entrance animation, staggered per card
requestAnimationFrame(()=>{
  cardEls.forEach(card=>{
    const anim=card.animate(
      [{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],
      {duration:520,delay:Math.random()*700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}
    );
    anim.onfinish=()=>{ card.style.opacity=''; card.style.transform=''; anim.cancel(); };
  });
});

/* ---------------------------------------------------------------------
   CAMERA — pan/zoom/inertia engine, plus the scripted scene-to-scene
   story mode from the previous iteration (locked while the story plays,
   free exploration once it ends).
--------------------------------------------------------------------- */
function fitScale(){return clamp(Math.min(innerWidth/WORLD_W,innerHeight/WORLD_H)*.94,.04,1.6)}
let MIN_SCALE=fitScale();
const MAX_SCALE=4.6;
const state={x:0,y:0,tx:0,ty:0,scale:MIN_SCALE,ts:MIN_SCALE,down:false,lastX:0,lastY:0,vx:0,vy:0,drag:0,pointerId:null};
const EASE=.13, OVERSCROLL=.06;
let locked=true;

// breathing room: once zoomed in past the fit-to-screen size, let the
// camera pan a bit further than the exact edge of the diamond so there's
// always some background visible around the cluster, instead of the
// content's edge landing flush against the viewport edge.
const PAN_MARGIN=280;
function bounds(scale){
  const scaledW=WORLD_W*scale, scaledH=WORLD_H*scale, m=PAN_MARGIN*scale;
  const minX=scaledW<=innerWidth?(innerWidth-scaledW)/2:innerWidth-scaledW-m;
  const maxX=scaledW<=innerWidth?minX:m;
  const minY=scaledH<=innerHeight?(innerHeight-scaledH)/2:innerHeight-scaledH-m;
  const maxY=scaledH<=innerHeight?minY:m;
  return {minX,maxX,minY,maxY};
}
function clampCamera(){
  const b=bounds(state.ts), ex=innerWidth*OVERSCROLL, ey=innerHeight*OVERSCROLL;
  state.tx=clamp(state.tx,b.minX-ex,b.maxX+ex);
  state.ty=clamp(state.ty,b.minY-ey,b.maxY+ey);
}
function hardClampCamera(){
  const b=bounds(state.scale);
  state.x=clamp(state.x,b.minX,b.maxX); state.y=clamp(state.y,b.minY,b.maxY);
}
function apply(){surface.style.transform=`translate3d(${state.x}px,${state.y}px,0) scale(${state.scale})`}

function setCamera(worldX,worldY,zoom,focusXRatio=.5,focusYRatio=.5){
  state.ts=zoom;
  state.tx=innerWidth*focusXRatio-worldX*zoom;
  state.ty=innerHeight*focusYRatio-worldY*zoom;
  clampCamera();
}
setCamera(WORLD_W/2,WORLD_H/2,MIN_SCALE);
state.scale=state.ts; state.x=state.tx; state.y=state.ty; // instant first frame, no ease-in
apply();

const LABEL_HIDE_ZOOM=.85;
let labelsVisible=true;
function animate(){
  state.x+=(state.tx-state.x)*EASE;
  state.y+=(state.ty-state.y)*EASE;
  state.scale+=(state.ts-state.scale)*EASE;
  if(!state.down && !locked && (Math.abs(state.vx)>.02||Math.abs(state.vy)>.02)){
    state.tx+=state.vx; state.ty+=state.vy; state.vx*=.90; state.vy*=.90; clampCamera();
  }
  if(!state.down && !locked && Math.abs(state.vx)<.08 && Math.abs(state.vy)<.08){
    const b=bounds(state.ts);
    state.tx=clamp(state.tx,b.minX,b.maxX); state.ty=clamp(state.ty,b.minY,b.maxY);
  }
  if(!locked) hardClampCamera();
  apply();
  updateMinimapViewport();
  const showLabels=state.scale<LABEL_HIDE_ZOOM;
  if(showLabels!==labelsVisible){
    labelsVisible=showLabels;
    labelEls.forEach(el=>el.classList.toggle('hidden',!showLabels));
    surface.classList.toggle('labelsHidden',!showLabels);
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function zoomAt(clientX,clientY,nextScale){
  const old=state.ts, next=clamp(nextScale,MIN_SCALE,MAX_SCALE), ratio=next/old;
  state.tx=clientX-(clientX-state.tx)*ratio;
  state.ty=clientY-(clientY-state.ty)*ratio;
  state.ts=next; clampCamera();
}

/* ---------------------------------------------------------------------
   STORY SCENES — one respondent, one real response per beat, always
   framed on a zoomed-in poster (never the overview) using the camera
   engine above. Content is real (pulled from the actual response data);
   only the respondent number is a synthesised stand-in.
--------------------------------------------------------------------- */
const byCount=[...opportunitySpaces].sort((a,b)=>byCluster[b].length-byCluster[a].length);
// contain-fit: pick the zoom that keeps the poster within a target W×H
// box (never exceeding either dimension), rather than a single target
// width — with posters now aspect-fit to their own ratio (cardRects
// stores the real, possibly narrow, rendered size), sizing off width
// alone could blow a tall/narrow poster's on-screen height way up.
function posterDetailTarget(no,targetW,targetH){
  const r=cardRects.get(no);
  const zoom=clamp(Math.min(targetW/r.w, targetH/r.h), 1, MAX_SCALE);
  return {x:r.cx, y:r.cy, zoom};
}
function pickFiled(name){ return byCluster[name].find(p=>p.file) || posters.find(p=>p.file); }
const storyPosters=[byCount[0],byCount[1],byCount[2],byCount[3]].map(pickFiled);

// a gentle, grid-scale framing like the reference — the poster reads as
// one tile among its neighbours, not a giant blown-up cutout — with a
// little size variety scene to scene rather than every one identical
const STORY_FRAME_SIZES=[[135,180],[150,200],[165,220],[145,195]];
const scenes=storyPosters.map((p,i)=>{
  const [tw,th]=STORY_FRAME_SIZES[i%STORY_FRAME_SIZES.length];
  const t=posterDetailTarget(p.no, tw, th);
  const top=p.responses[0];
  return {
    no:p.no,
    camera:{x:t.x, y:t.y, zoom:t.zoom},
    quote:top.text,
    respondent:'Respondent #'+p.no,
    demo:[top.ageBin, top.city].filter(Boolean).join(', '),
    end:i===storyPosters.length-1
  };
});

let sceneIndex=0;
const storyPopup=document.querySelector('#storyPopup');
const storyTitleEl=document.querySelector('#storyTitle');
const storyRespondentEl=document.querySelector('#storyRespondent');
const storyDemoEl=document.querySelector('#storyDemo');
const hudHint=document.querySelector('#hudHint');

// the narrator/host bubble — shown TOGETHER with the quote bubble above
// on every scene, pinned to the bottom-left corner of the viewport, and
// the only one of the two carrying the Next/Back nav. Placeholder copy
// for now, cycled one line per scene; swap in real lines later without
// touching the mechanics.
const INTRO_SCENES=['Hi there!','This is a story about AI','Agents of AI'];
const introPopup=document.querySelector('#introPopup');
const introTitleEl=document.querySelector('#introTitle');
const introBackBtn=document.querySelector('#introBackBtn');
const introNextBtn=document.querySelector('#introNextBtn');

function goToScene(i,instant=false){
  sceneIndex=clamp(i,0,scenes.length-1);
  const s=scenes[sceneIndex];
  storyPopup.classList.remove('show');
  introPopup.classList.remove('show');
  const drive=()=>{
    storyPopup.style.top=''; // reset to the CSS default before measuring
    storyTitleEl.textContent=s.quote;
    storyRespondentEl.textContent=s.respondent;
    storyDemoEl.textContent=s.demo;

    introTitleEl.textContent=INTRO_SCENES[sceneIndex%INTRO_SCENES.length];
    introBackBtn.disabled=sceneIndex===0;
    introNextBtn.textContent=s.end?'Start exploring →':'Next →';
    introNextBtn.classList.toggle('primary',!!s.end);

    // the narrator box is pinned to the bottom-left corner independent
    // of the poster, so only the quote bubble (pinned near the top)
    // needs to stay clear of the poster it's describing — push the
    // poster down until it sits below the quote bubble's actual,
    // content-dependent height, rather than centring it behind the text.
    storyPopup.classList.add('show');
    fitStoryPopupPosition();
    introPopup.classList.add('show');

    const popupBottom=storyPopup.getBoundingClientRect().bottom;
    const r=cardRects.get(s.no);
    const onScreenH=r ? r.h*s.camera.zoom : 0;
    const margin=28;
    const focusY=clamp((popupBottom+margin+onScreenH/2)/innerHeight, .5, .82);
    setCamera(s.camera.x,s.camera.y,s.camera.zoom,.5,focusY);
    if(instant){ state.scale=state.ts; state.x=state.tx; state.y=state.ty; apply(); }

    // make the poster the quote is about unmistakable among its
    // similarly-sized neighbours, regardless of zoom or tint state
    cardEls.forEach(c=>c.classList.remove('storyTarget'));
    const targetCard=cardEls.get(s.no);
    if(targetCard) targetCard.classList.add('storyTarget');
  };
  if(instant) drive(); else setTimeout(drive,180);
}
// the popup grows to fit its quote (no inner scrollbar) — if a quote is
// ever tall enough that the default top offset would push it past the
// bottom of the viewport, nudge it up (never clip, never scroll).
function fitStoryPopupPosition(){
  storyPopup.style.top='';
  const margin=16;
  const rect=storyPopup.getBoundingClientRect();
  if(rect.bottom>innerHeight-margin){
    const newTop=Math.max(margin, rect.top-(rect.bottom-(innerHeight-margin)));
    storyPopup.style.top=newTop+'px';
  }
}
function unlockExploration(){
  locked=false;
  interactive.classList.remove('locked');
  storyPopup.classList.remove('show');
  introPopup.classList.remove('show');
  cardEls.forEach(c=>c.classList.remove('storyTarget'));
  hudHint.textContent='Scroll to move · ⌘/ctrl+scroll to zoom · click a poster';
  state.vx=state.vy=0;
  setCamera(WORLD_W/2,WORLD_H/2,fitScale(),.5);
}
introBackBtn.addEventListener('click',()=>{ if(sceneIndex>0) goToScene(sceneIndex-1); });
introNextBtn.addEventListener('click',()=>{
  const s=scenes[sceneIndex];
  if(s.end){ unlockExploration(); return; }
  goToScene(sceneIndex+1);
});
document.addEventListener('keydown',e=>{
  if(locked){
    if(e.key==='ArrowRight') introNextBtn.click();
    if(e.key==='ArrowLeft' && !introBackBtn.disabled) introBackBtn.click();
    return;
  }
  if(e.key==='Escape') closeDetails();
});
goToScene(0,true); // instant: open already zoomed in, no pull-in on first paint

/* ---------------------------------------------------------------------
   MINIMAP
--------------------------------------------------------------------- */
const minimap=document.querySelector('#minimap'), mmClusters=document.querySelector('#mmClusters'), mmViewport=document.querySelector('#mmViewport');
const MM_W=210, MM_H=132;
const mmScale=Math.min(MM_W/WORLD_W, MM_H/WORLD_H);
const mmOffX=(MM_W-WORLD_W*mmScale)/2, mmOffY=(MM_H-WORLD_H*mmScale)/2;

// one flat-colour silhouette of the whole diamond — not per-cluster —
// built as one thin strip per grid row spanning that row's filled
// columns (rows of a diamond mask are always a single contiguous run of
// columns), so the stack of strips reproduces the exact diamond outline
// without needing per-cluster colour or a separate shape/clip-path.
const mmRowSpans=new Map();
insideCells.forEach(c=>{
  const s=mmRowSpans.get(c.row);
  if(!s) mmRowSpans.set(c.row,{minCol:c.col,maxCol:c.col});
  else { s.minCol=Math.min(s.minCol,c.col); s.maxCol=Math.max(s.maxCol,c.col); }
});
mmRowSpans.forEach((s,row)=>{
  const el=document.createElement('div');
  el.className='mmShape';
  el.style.left=(mmOffX+s.minCol*CELL_W*mmScale)+'px';
  el.style.top=(mmOffY+row*CELL_H*mmScale)+'px';
  el.style.width=Math.max(1,(s.maxCol-s.minCol+1)*CELL_W*mmScale)+'px';
  el.style.height=Math.max(1,CELL_H*mmScale)+'px';
  mmClusters.appendChild(el);
});

function updateMinimapViewport(){
  const wLeft=(-state.x)/state.scale, wTop=(-state.y)/state.scale;
  const wW=innerWidth/state.scale, wH=innerHeight/state.scale;
  mmViewport.style.left=(mmOffX+wLeft*mmScale)+'px';
  mmViewport.style.top=(mmOffY+wTop*mmScale)+'px';
  mmViewport.style.width=(wW*mmScale)+'px';
  mmViewport.style.height=(wH*mmScale)+'px';
}
minimap.addEventListener('click',e=>{
  if(locked) return;
  const r=minimap.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const worldX=(mx-mmOffX)/mmScale, worldY=(my-mmOffY)/mmScale;
  state.tx=innerWidth/2-worldX*state.ts;
  state.ty=innerHeight/2-worldY*state.ts;
  clampCamera();
});

/* ---------------------------------------------------------------------
   FILTERS — emotion (halftone overlay, no hiding), age + location
   (visibility). A poster with no demographic match on a response is
   never hidden by age/location — only posters that positively fail to
   match a chosen bucket disappear. "No feeling" has no filter chip.
--------------------------------------------------------------------- */
const state_f={emotions:new Set(), ages:new Set(), cities:new Set()};

const emotionChips=document.querySelector('#emotionChips');
meta.feelings.filter(f=>f!=='No feeling').forEach(f=>{
  const c=document.createElement('div');
  c.className='chip'; c.dataset.f=f;
  c.innerHTML=`<span class="dot" style="background:${feelingColor(f)}"></span>${esc(f)}`;
  c.addEventListener('click',()=>{
    state_f.emotions.has(f)?state_f.emotions.delete(f):state_f.emotions.add(f);
    renderChipStates(); applyFilters();
  });
  emotionChips.appendChild(c);
});

const ageChips=document.querySelector('#ageChips');
meta.ageBins.forEach(b=>{
  const c=document.createElement('div');
  c.className='chip'; c.dataset.age=b; c.textContent=b;
  c.addEventListener('click',()=>{
    state_f.ages.has(b)?state_f.ages.delete(b):state_f.ages.add(b);
    renderChipStates(); applyFilters();
  });
  ageChips.appendChild(c);
});

const cityList=document.querySelector('#cityList');
meta.cities.forEach(([name,count])=>{
  const row=document.createElement('label');
  row.className='cityRow';
  row.innerHTML=`<input type="checkbox" data-city="${esc(name)}"><span>${esc(name)}</span><span class="n">${count}</span>`;
  row.querySelector('input').addEventListener('change',e=>{
    e.target.checked?state_f.cities.add(name):state_f.cities.delete(name);
    applyFilters();
  });
  cityList.appendChild(row);
});

function renderChipStates(){
  emotionChips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', state_f.emotions.has(c.dataset.f)));
  ageChips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', state_f.ages.has(c.dataset.age)));
}

document.querySelector('#resetFilters').addEventListener('click',()=>{
  state_f.emotions.clear(); state_f.ages.clear(); state_f.cities.clear();
  cityList.querySelectorAll('input').forEach(i=>i.checked=false);
  renderChipStates(); applyFilters();
});

function applyFilters(){
  surface.classList.toggle('emotionFilterActive', state_f.emotions.size>0);
  posters.forEach(p=>{
    const card=cardEls.get(p.no);
    card.classList.toggle('emotionMatch', state_f.emotions.has(p.feeling));

    const ageOK=state_f.ages.size===0 || p.ageBins.length===0 || p.ageBins.some(b=>state_f.ages.has(b));
    const cityOK=state_f.cities.size===0 || p.cities.length===0 || p.cities.some(c=>state_f.cities.has(c));
    card.classList.toggle('filteredOut', !(ageOK && cityOK));
  });
}

/* ---------------------------------------------------------------------
   RESPONSE SIDE PANEL
--------------------------------------------------------------------- */
const modal=document.querySelector('#modal');
const panelKicker=document.querySelector('#panelKicker');
const panelTitle=document.querySelector('#panelTitle');
const panelSub=document.querySelector('#panelSub');
const respList=document.querySelector('#respList');

function tierFor(i){return i===0?'t0':(i<=2?'t1':'t2')}

const sidePanelEl=document.querySelector('.side-panel');
function zoomToPoster(no){
  const r=cardRects.get(no);
  if(!r) return;
  const panelW=sidePanelEl.getBoundingClientRect().width||460;
  const visibleW=Math.max(200, innerWidth-panelW);
  // contain-fit within a target box, not a target width alone — a narrow
  // aspect-fit poster (small r.w) would otherwise blow its on-screen
  // height way up if sized off width only.
  const targetScale=clamp(Math.min(480/r.w, 560/r.h), MIN_SCALE, MAX_SCALE);
  setCamera(r.cx, r.cy, targetScale, (visibleW/2)/innerWidth);
}

function openPoster(p){
  zoomToPoster(p.no);

  const fc=feelingColor(p.feeling);
  panelKicker.innerHTML=`<span class="dot" style="background:${fc}"></span><span>${esc(p.feeling)}</span><span>·</span><span>Poster #${esc(p.no)}</span>`;
  panelTitle.textContent=p.opportunitySpace;
  panelSub.textContent=`${p.responses.length} response${p.responses.length===1?'':'s'}`;

  respList.innerHTML='';
  p.responses.forEach((r,i)=>{
    const el=document.createElement('div');
    el.className='resp '+tierFor(i);
    const metaBits=[i===0?'Top response':null, r.ageBin, r.city].filter(Boolean).join(' · ');
    el.innerHTML=`${metaBits?`<div class="meta">${esc(metaBits)}</div>`:''}<p>${esc(r.text)}</p>`;
    respList.appendChild(el);
  });

  cardEls.forEach(c=>c.classList.remove('selected'));
  const selCard=cardEls.get(p.no);
  if(selCard) selCard.classList.add('selected');
  interactive.classList.add('panelOpen');

  modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
}
function closeDetails(){
  modal.classList.remove('show'); modal.setAttribute('aria-hidden','true');
  interactive.classList.remove('panelOpen');
  cardEls.forEach(c=>c.classList.remove('selected'));
}
document.querySelector('#close').onclick=closeDetails;
document.querySelector('#modalBackdrop').onclick=closeDetails;

/* ---------------------------------------------------------------------
   HOVER PREVIEW — quick peek at the top response without opening the
   full side panel.
--------------------------------------------------------------------- */
const hoverPreview=document.querySelector('#hoverPreview');
let hoverNo=null, hoverHiddenLabel=null;
function setHoverHiddenLabel(label){
  if(label===hoverHiddenLabel) return;
  if(hoverHiddenLabel) hoverHiddenLabel.classList.remove('hoverHidden');
  hoverHiddenLabel=label;
  if(label) label.classList.add('hoverHidden');
}
interactive.addEventListener('pointermove',e=>{
  if(locked || state.down || modal.classList.contains('show')){ hoverPreview.classList.remove('show'); hoverNo=null; setHoverHiddenLabel(null); return; }
  const card=e.target.closest('.card');
  if(!card || card.classList.contains('filteredOut')){
    if(hoverNo!==null){ hoverPreview.classList.remove('show'); hoverNo=null; }
    setHoverHiddenLabel(null);
    return;
  }
  if(card.dataset.no!==hoverNo){
    hoverNo=card.dataset.no;
    const p=postersByNo.get(hoverNo);
    const first=p.responses[0];
    const fc=feelingColor(p.feeling);
    const metaBits=[first.ageBin, first.city].filter(Boolean).join(' · ');
    hoverPreview.innerHTML=`<div class="hp-meta"><span class="dot" style="background:${fc}"></span><span>${esc(p.feeling)} · ${esc(p.opportunitySpace)}</span>${metaBits?`<span>· ${esc(metaBits)}</span>`:''}</div><div>${esc(truncate(first.text,190))}</div>`;
    setHoverHiddenLabel(labelByName.get(p.opportunitySpace)||null);
  }
  hoverPreview.style.left=Math.min(e.clientX+18, innerWidth-286)+'px';
  hoverPreview.style.top=Math.min(e.clientY+18, innerHeight-90)+'px';
  hoverPreview.classList.add('show');
});
interactive.addEventListener('pointerleave',()=>{ hoverPreview.classList.remove('show'); hoverNo=null; setHoverHiddenLabel(null); });

/* ---------------------------------------------------------------------
   POINTER / WHEEL — pan, pinch/scroll zoom, click-to-open (drag != click)
--------------------------------------------------------------------- */
let gestureCard=null, gestureStartX=0, gestureStartY=0;
const CLICK_THRESHOLD=10;

interactive.addEventListener('pointerdown',e=>{
  if(locked) return;
  gestureCard=e.target.closest('.card');
  gestureStartX=e.clientX; gestureStartY=e.clientY;
  state.down=true; state.pointerId=e.pointerId;
  state.lastX=e.clientX; state.lastY=e.clientY;
  state.vx=state.vy=0; state.drag=0;
  interactive.setPointerCapture(e.pointerId);
});
interactive.addEventListener('pointermove',e=>{
  if(locked || !state.down || e.pointerId!==state.pointerId) return;
  const dx=e.clientX-state.lastX, dy=e.clientY-state.lastY;
  const total=Math.hypot(e.clientX-gestureStartX,e.clientY-gestureStartY);
  state.drag=total;
  if(total>CLICK_THRESHOLD){state.tx+=dx;state.ty+=dy;clampCamera();state.vx=dx;state.vy=dy}
  state.lastX=e.clientX; state.lastY=e.clientY;
});
interactive.addEventListener('pointerup',e=>{
  if(locked || e.pointerId!==state.pointerId) return;
  const card=gestureCard;
  const distance=Math.hypot(e.clientX-gestureStartX,e.clientY-gestureStartY);
  state.down=false; state.pointerId=null; gestureCard=null;
  if(card && distance<=CLICK_THRESHOLD && card.isConnected && !card.classList.contains('filteredOut')){
    const p=postersByNo.get(card.dataset.no);
    if(p) openPoster(p);
  }
});
interactive.addEventListener('pointercancel',()=>{state.down=false;state.pointerId=null;gestureCard=null});
interactive.addEventListener('wheel',e=>{
  if(locked) return;
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    // pinch-to-zoom on trackpads (and ctrl/cmd+scroll) — everything else pans
    zoomAt(e.clientX,e.clientY,state.ts*Math.exp(-e.deltaY*.006));
  } else {
    state.tx-=e.deltaX*1.1; state.ty-=e.deltaY*1.1;
    state.vx=state.vy=0;
    clampCamera();
  }
},{passive:false});

window.addEventListener('resize',()=>{
  MIN_SCALE=fitScale();
  if(locked) goToScene(sceneIndex);
  else { clampCamera(); hardClampCamera(); }
});
})();
</script>
</body></html>
