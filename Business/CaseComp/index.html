<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera storytelling</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f1e9;color:#111;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

.interactive{position:fixed;inset:0;display:block;background:#f4f1e9;overflow:hidden;touch-action:none;cursor:grab;z-index:5}
.interactive:active{cursor:grabbing}
.interactive.locked{cursor:default}
.surface{position:absolute;left:0;top:0;transform-origin:0 0}

/* -- mosaic / treemap grid -- */
.card{overflow:hidden;background:#fff;border-radius:5px;box-shadow:0 10px 26px #0002;cursor:pointer;transition:transform .25s ease,opacity .25s ease,box-shadow .25s ease}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.interactive.locked .card{cursor:default}

/* Hovering one card highlights it and recedes every other card, so the
   hovered image reads as the single focal point of the mosaic. */
.interactive:not(.locked) .surface:hover .card{transform:scale(.9);opacity:.4}
.interactive:not(.locked) .surface:hover .card:hover{transform:scale(1.12);opacity:1;box-shadow:0 26px 60px #0004;z-index:5}

/* -- cluster overlays: painted ON TOP of the images -- */
.overlaysLayer{position:absolute;inset:0;pointer-events:none;z-index:6;transition:opacity .35s ease,visibility .35s}
.overlaysLayer.hidden{opacity:0;visibility:hidden}
.clusterOverlay{position:absolute;border-radius:26px;border:2px solid transparent;opacity:.85;transition:opacity .4s ease}
.clusterOverlay.dim{opacity:.22}
.clusterOverlay.active{opacity:1}
.clusterChip{position:absolute;left:20px;top:20px;display:inline-flex;align-items:center;gap:8px;background:#f7f4ecf2;border:1px solid #1111;padding:7px 14px 7px 9px;border-radius:999px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#111;white-space:nowrap;box-shadow:0 6px 16px #0001}
.clusterChip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.clusterChip b{font-weight:700}
.clusterChip span{opacity:.55;margin-left:2px}

/* -- overlay toggle -- */
.overlayToggle{position:fixed;right:24px;top:22px;z-index:40;border:1px solid #111;background:#f7f4ecf2;color:#111;padding:11px 16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px #0001}
.overlayToggle:hover{background:#111;color:#fff}
.overlayToggle.off{opacity:.55}

/* -- page header (always visible) + free-exploration hint -- */
.caption{position:absolute;left:24px;top:22px;z-index:15;pointer-events:none}
.captionBadge{display:inline-block;background:#f7f4ecf2;border:1px solid #1112;padding:11px 20px;box-shadow:0 8px 24px #0002}
.captionBadge h2{margin:0;font-size:clamp(18px,2.2vw,26px);line-height:1;letter-spacing:.01em}
.captionHint{display:inline-block;margin:8px 0 0;background:#f7f4ecf2;border:1px solid #1112;padding:7px 14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#111;opacity:0;transition:opacity .5s ease}
.captionHint.show{opacity:.7}

/* -- story popup / camera HUD -- */
.storyPopup{position:fixed;right:5%;top:50%;transform:translateY(calc(-50% + 10px));width:min(380px,88vw);max-height:80vh;overflow:auto;background:#f7f4ec;border:1px solid #1112;box-shadow:0 25px 70px #0003;padding:26px 28px 22px;z-index:30;opacity:0;pointer-events:none;transition:opacity .4s ease,transform .4s ease}
.storyPopup.show{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.storyKicker{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.storyKicker .dot{width:8px;height:8px;border-radius:50%;background:#111}
.storyTitle{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.15}
.storyText{margin:0 0 20px;font-size:13px;line-height:1.6;opacity:.68}
.storyDots{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.storyDots i{width:14px;height:3px;background:#1112;display:block}
.storyDots i.done{background:#111a}
.storyDots i.on{background:#111}
.storyNav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.storyNav button{appearance:none;border:1px solid #111;background:transparent;color:#111;padding:12px 10px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.storyNav button:hover{background:#111;color:#fff}
.storyNav button:disabled{opacity:.25;cursor:default;pointer-events:none}
.storyNav button.primary{grid-column:1/-1;background:#111;color:#fff}
.storyNav button.primary:hover{background:#000}
@media(max-width:640px){.storyPopup{right:50%;left:50%;transform:translate(50%,calc(100% - 190px));top:auto;bottom:14px;width:92vw;max-height:44vh}
.storyPopup.show{transform:translate(50%,0)}}

/* -- detail modal (free exploration) -- */
.modal{position:fixed;inset:0;display:block;visibility:hidden;pointer-events:none;background:transparent;z-index:100}
.modal.show{visibility:visible;pointer-events:auto}
.modal-backdrop{position:absolute;inset:0;background:#1113;opacity:0;transition:opacity .35s ease}
.modal.show .modal-backdrop{opacity:1}
.side-panel{position:absolute!important;top:0!important;right:0!important;left:auto!important;bottom:0!important;width:min(520px,94vw)!important;height:100vh!important;max-height:none!important;min-height:0!important;margin:0!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto auto!important;background:#f7f4ec!important;transform:translate3d(105%,0,0)!important;transition:transform .45s cubic-bezier(.2,.8,.2,1)!important;box-shadow:-20px 0 60px #0003!important;overflow:hidden!important}
.modal.show .side-panel{transform:translate3d(0,0,0)!important}
.side-panel .detail-image{position:relative!important;inset:auto!important;min-height:0;background:#ede9df}
.side-panel .detail-image img{width:100%;height:100%;object-fit:contain}
.side-panel .detail-copy{position:relative!important;inset:auto!important;min-height:0!important;padding:22px 28px!important;background:#f7f4ec!important;border-top:1px solid #1111}
.detail-kicker{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:8px}
.detail-copy h3{margin:0 0 7px;font-size:24px;font-weight:500}
.detail-copy p{margin:0;max-width:700px;font-size:13px;line-height:1.5;opacity:.65}
.detail-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 20px 20px;border-top:1px solid #1111;background:#f7f4ec}
.detail-nav button{appearance:none;border:1px solid #111;background:transparent;color:#111;padding:10px 12px;font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.detail-nav button:hover{background:#111;color:#fff}
#imageCount{font-size:10px;letter-spacing:.1em;white-space:nowrap;opacity:.55}
.close{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;background:#fff;font-size:20px;z-index:4}
</style>
</head>
<body>

<div id="interactive" class="interactive locked">
  <div class="caption" id="caption">
    <div class="captionBadge"><h2>Case Comp 2026</h2></div>
    <p class="captionHint" id="captionHint">Drag · scroll/pinch to zoom · click images</p>
  </div>
  <div id="surface" class="surface"></div>
</div>

<button id="overlayToggle" class="overlayToggle" type="button">Hide cluster overlays</button>

<div id="storyPopup" class="storyPopup">
  <div class="storyKicker"><span class="dot" id="storyDot"></span><span id="storyKickerText">Scene 01 / 10</span></div>
  <h3 class="storyTitle" id="storyTitle">[Placeholder title]</h3>
  <p class="storyText" id="storyText">[Placeholder copy about this image or cluster]</p>
  <div class="storyDots" id="storyDots"></div>
  <div class="storyNav">
    <button id="backBtn" type="button">← Back</button>
    <button id="nextBtn" type="button">Next →</button>
  </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <aside class="panel side-panel" role="dialog" aria-modal="true" aria-label="Image details">
    <button id="close" class="close" aria-label="Close details">×</button>
    <div class="detail-image"><img id="modalImg" alt=""></div>
    <div class="detail-copy">
      <div id="modalInfo" class="detail-kicker">Fragment 01</div>
      <h3 id="modalTitle">A fragment of the journey</h3>
      <p id="modalText">This image is one of the fragments collected along the journey.</p>
    </div>
    <div class="detail-nav">
      <button id="prevImage" type="button">← Previous</button>
      <span id="imageCount">1 / 100</span>
      <button id="nextImage" type="button">Next →</button>
    </div>
  </aside>
</div>

<script>
(()=>{
const interactive=document.querySelector('#interactive'),surface=document.querySelector('#surface');

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hexToRgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ---------------------------------------------------------------------
   MOSAIC / TREEMAP GRID
   Each cluster is its own CSS grid using grid-auto-flow:dense, mixing
   1x1 (square), 2x1 (landscape) and 1x2 (portrait) tiles — plus an
   occasional 2x2 feature tile — so the packing looks like a treemap
   rather than a uniform grid. The four clusters sit in a 2x2 layout so
   they stay spatially distinct groups of images.
--------------------------------------------------------------------- */
const PER_QUADRANT=50, TOTAL=PER_QUADRANT*4;   // <- more images than before
const UNIT=108, GAP=8;                          // <- tight gap for a treemap feel
const QCOLS=12;
const QUADRANT_GAP=20;                          // <- clusters sit tight around the centre

// Top-row clusters (A, B) are flipped so their packing starts at the seam
// where all four quadrants meet and grows outward — any incomplete trailing
// row from the dense-packing algorithm ends up at the outer top edge
// instead of next to the other quadrants, so the mosaic reads as one block
// clustered around the centre with no gap in the middle.
const clusters=[
  {id:'A',name:'[Placeholder] Cluster 01 — Origins',     color:'#2a78d6', blurb:'[Placeholder] The earliest fragments in the set — where the story begins.', flip:true},
  {id:'B',name:'[Placeholder] Cluster 02 — Momentum',     color:'#eb6834', blurb:'[Placeholder] Images gathered as the pace of the journey picks up.', flip:true},
  {id:'C',name:'[Placeholder] Cluster 03 — Undercurrent', color:'#1baf7a', blurb:'[Placeholder] A quieter group, running beneath the main thread.'},
  {id:'D',name:'[Placeholder] Cluster 04 — Resolution',   color:'#4a3aa7', blurb:'[Placeholder] Where the separate threads start to come together.'}
];

function pickShape(){
  const r=Math.random();
  if(r<.10) return {w:2,h:2};   // big feature tile
  if(r<.35) return {w:2,h:1};   // landscape
  if(r<.55) return {w:1,h:2};   // portrait
  return {w:1,h:1};             // square
}
function imgSrc(i,w,h){
  if(w===h) return `https://picsum.photos/seed/mosaic-${i}/820/820`;
  if(w>h)   return `https://picsum.photos/seed/mosaic-${i}/1000/620`;
  return `https://picsum.photos/seed/mosaic-${i}/620/1000`;
}

const quadrantsGrid=document.createElement('div');
quadrantsGrid.style.display='grid';
quadrantsGrid.style.gridTemplateColumns='max-content max-content';
quadrantsGrid.style.gridTemplateRows='max-content max-content';
quadrantsGrid.style.gap=QUADRANT_GAP+'px';
quadrantsGrid.style.alignItems='start';
quadrantsGrid.style.justifyItems='start';
surface.appendChild(quadrantsGrid);

// Every cluster reuses the *same* sequence of tile shapes. Dense packing is
// deterministic for a given (column count, shape sequence), so all four
// quadrants come out exactly the same height — no mismatched-row gaps
// between them, and the whole mosaic reads as one tight, centred block.
const shapeSequence=Array.from({length:PER_QUADRANT},()=>pickShape());

const quadrantEls={}, quadrantCards={};
let globalIndex=0;
clusters.forEach(c=>{
  const q=document.createElement('div');
  q.className='quadrant';
  q.dataset.cluster=c.id;
  q.style.display='grid';
  q.style.alignContent='start';
  q.style.gridAutoFlow='dense';
  q.style.gridTemplateColumns=`repeat(${QCOLS},${UNIT}px)`;
  q.style.gridAutoRows=UNIT+'px';
  q.style.gap=GAP+'px';
  if(c.flip) q.style.transform='scaleY(-1)';
  quadrantsGrid.appendChild(q);
  quadrantEls[c.id]=q;

  const cards=[];
  for(let k=0;k<PER_QUADRANT;k++){
    const idx=globalIndex++;
    const shape=shapeSequence[k];
    const card=document.createElement('div');
    card.className='card';
    card.dataset.index=idx;
    card.style.gridColumn=`span ${shape.w}`;
    card.style.gridRow=`span ${shape.h}`;
    card.style.opacity='0'; card.style.transform='scale(.6)';
    // Counter-flip only the photo, not the card box, so the parent
    // quadrant's positional flip doesn't leave the image upside down.
    const img=`<img src="${imgSrc(idx,shape.w,shape.h)}" alt=""${c.flip?' style="transform:scaleY(-1)"':''}>`;
    card.innerHTML=img;
    q.appendChild(card);
    cards.push(card);
  }
  quadrantCards[c.id]=cards;
});

const imgs=Array.from({length:globalIndex},(_,i)=>`https://picsum.photos/seed/mosaic-${i}/900/650`);

const allCards=[...surface.querySelectorAll('.card')];
allCards.forEach(card=>{
  const anim=card.animate(
    [{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],
    {duration:600,delay:Math.random()*700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}
  );
  // Hand control back to plain CSS once the intro pop finishes, so the
  // hover highlight rules below aren't blocked by the finished animation
  // (or a leftover inline style) still holding transform/opacity.
  anim.onfinish=()=>{ card.style.opacity=''; card.style.transform=''; anim.cancel(); };
});

/* ---------------------------------------------------------------------
   OVERLAYS — painted on top of the images (higher stacking layer),
   sized from the actual rendered quadrant boxes, with a show/hide toggle.
--------------------------------------------------------------------- */
const overlaysLayer=document.createElement('div');
overlaysLayer.className='overlaysLayer';
surface.appendChild(overlaysLayer);

const clusterBox={}, clusterEls={};
clusters.forEach(c=>{
  const q=quadrantEls[c.id];
  const box={left:q.offsetLeft,top:q.offsetTop,width:q.offsetWidth,height:q.offsetHeight};
  box.cx=box.left+box.width/2; box.cy=box.top+box.height/2;
  clusterBox[c.id]=box;

  const el=document.createElement('div');
  el.className='clusterOverlay';
  el.dataset.cluster=c.id;
  el.style.left=box.left+'px'; el.style.top=box.top+'px';
  el.style.width=box.width+'px'; el.style.height=box.height+'px';
  el.style.background=hexToRgba(c.color,.14);
  el.style.borderColor=hexToRgba(c.color,.6);
  el.innerHTML=`<div class="clusterChip"><span class="dot" style="background:${c.color}"></span><b>${c.name}</b><span>${PER_QUADRANT} fragments</span></div>`;
  overlaysLayer.appendChild(el);
  clusterEls[c.id]=el;
});

function highlightCluster(activeId){
  clusters.forEach(c=>{
    const el=clusterEls[c.id];
    el.classList.remove('active','dim');
    if(activeId==null) return;
    el.classList.add(c.id===activeId?'active':'dim');
  });
}

let overlaysOn=true;
const overlayToggleBtn=document.querySelector('#overlayToggle');
overlayToggleBtn.addEventListener('click',()=>{
  overlaysOn=!overlaysOn;
  overlaysLayer.classList.toggle('hidden',!overlaysOn);
  overlayToggleBtn.textContent=overlaysOn?'Hide cluster overlays':'Show cluster overlays';
  overlayToggleBtn.classList.toggle('off',!overlaysOn);
});

/* ---------------------------------------------------------------------
   CAMERA ENGINE
   - state.ts / state.tx / state.ty are the target camera values;
     state.scale / state.x / state.y ease toward them every frame.
   - setCamera() is the only thing scenes need to call: a world point +
     a defined zoom level. MIN_SCALE is computed so the whole mosaic
     fills the landscape frame of the browser at the overview / free-
     exploration zoom level.
--------------------------------------------------------------------- */
const WORLD_W=surface.offsetWidth, WORLD_H=surface.offsetHeight;
function fitScale(){return clamp(Math.min(innerWidth/WORLD_W,innerHeight/WORLD_H)*.96,.05,1.4)}
let MIN_SCALE=fitScale();
const MAX_SCALE=2.4;

const state={x:0,y:0,tx:0,ty:0,scale:MIN_SCALE,ts:MIN_SCALE,down:false,lastX:0,lastY:0,vx:0,vy:0,drag:0,pointerId:null};
const EASE=.11, OVERSCROLL=.08;
let locked=true;      // true while the scripted camera story is driving
let focusActive=false; // true while a detail image is focused — world-bounds clamp is lifted

function bounds(scale){
  const scaledW=WORLD_W*scale, scaledH=WORLD_H*scale;
  const minX=scaledW<=innerWidth ? (innerWidth-scaledW)/2 : innerWidth-scaledW;
  const maxX=scaledW<=innerWidth ? minX : 0;
  const minY=scaledH<=innerHeight ? (innerHeight-scaledH)/2 : innerHeight-scaledH;
  const maxY=scaledH<=innerHeight ? minY : 0;
  return {minX,maxX,minY,maxY};
}
function clampCamera(){
  const b=bounds(state.ts);
  const extraX=innerWidth*OVERSCROLL, extraY=innerHeight*OVERSCROLL;
  state.tx=clamp(state.tx,b.minX-extraX,b.maxX+extraX);
  state.ty=clamp(state.ty,b.minY-extraY,b.maxY+extraY);
}
function hardClampCamera(){
  const b=bounds(state.scale);
  state.x=clamp(state.x,b.minX,b.maxX);
  state.y=clamp(state.y,b.minY,b.maxY);
}
function apply(){surface.style.transform=`translate3d(${state.x}px,${state.y}px,0) scale(${state.scale})`}
apply(); // sync the transform once up front so rect-based measurements below are accurate

// True world-space box of a card, found by reversing the camera's current
// transform on its live rendered rect. This is robust to any nesting —
// including the flipped top-row quadrants — instead of trusting
// offsetLeft/offsetTop, which only reports a position relative to the
// nearest positioned/transformed ancestor (the quadrant, not the surface).
function cardWorldRect(card){
  const r=card.getBoundingClientRect();
  const w=r.width/state.scale, h=r.height/state.scale;
  const x=(r.left-state.x)/state.scale, y=(r.top-state.y)/state.scale;
  return {x,y,w,h,cx:x+w/2,cy:y+h/2};
}

function animate(){
  state.x+=(state.tx-state.x)*EASE;
  state.y+=(state.ty-state.y)*EASE;
  state.scale+=(state.ts-state.scale)*EASE;
  if(!state.down && !locked && !focusActive && (Math.abs(state.vx)>.02||Math.abs(state.vy)>.02)){
    state.tx+=state.vx; state.ty+=state.vy; state.vx*=.90; state.vy*=.90; clampCamera();
  }
  if(!state.down && !locked && !focusActive && Math.abs(state.vx)<.08 && Math.abs(state.vy)<.08){
    const b=bounds(state.ts);
    state.tx=clamp(state.tx,b.minX,b.maxX); state.ty=clamp(state.ty,b.minY,b.maxY);
  }
  if(!focusActive) hardClampCamera();
  apply();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function zoomAt(clientX,clientY,nextScale){
  const old=state.ts, next=clamp(nextScale,MIN_SCALE,MAX_SCALE), ratio=next/old;
  state.tx=clientX-(clientX-state.tx)*ratio;
  state.ty=clientY-(clientY-state.ty)*ratio;
  state.ts=next; clampCamera();
}

// Frame a world point at a defined zoom level, offset left so the story
// popup on the right never covers the subject.
function setCamera(worldX,worldY,zoom,focusXRatio=.36){
  state.ts=zoom;
  state.tx=innerWidth*focusXRatio-worldX*zoom;
  state.ty=innerHeight*.5-worldY*zoom;
  clampCamera();
}

/* ---------------------------------------------------------------------
   STORY SCENES  (placeholders — swap camera targets & copy for real ones)
   Exactly 5 scenes: an overview, then one stop per cluster — the last
   cluster's "Next" becomes the "Start exploring" hand-off.
--------------------------------------------------------------------- */
function clusterZoomFor(c){ return clamp(innerWidth*.6/clusterBox[c.id].width, MIN_SCALE, MAX_SCALE) }

// For a "detail" scene, zoom in tight enough that a single representative
// card fills a large share of the screen — the image is highlighted purely
// by how close the camera sits, no dimming or overlay involved.
function detailTarget(c){
  const card=quadrantCards[c.id][Math.floor(PER_QUADRANT/2)];
  const r=cardWorldRect(card);
  return {x:r.cx,y:r.cy,zoom:clamp(innerWidth*.42/r.w,1,MAX_SCALE),index:Number(card.dataset.index)};
}

// Only the first 3 clusters get an individual story beat, so the 5-scene
// budget can still bookend with an opening AND a closing overview — the
// closing one pulls all the way back out (including the 4th cluster,
// never visited up close) right before free exploration opens up.
const storyClusters=clusters.slice(0,3);

const scenes=[
  {
    kicker:'Overview', clusterId:null,
    camera:{zoom:'fit', focus:.5, get x(){return WORLD_W/2}, get y(){return WORLD_H/2}},
    title:'[Placeholder] The full picture',
    text:'[Placeholder] Every fragment collected during the project sits somewhere on this surface — four clusters, one story. The camera will walk through each of them.'
  },
  // The middle cluster zooms all the way into one image instead of framing
  // the whole group — swap which cluster gets this treatment, or the
  // picked card, once real images/copy are in.
  ...storyClusters.map((c,i)=>{
    const useDetail=i===1;
    if(useDetail){
      const d=detailTarget(c);
      return {
        kicker:c.name.replace('[Placeholder] ','')+' — detail', clusterId:c.id,
        camera:{x:d.x,y:d.y,zoom:d.zoom},
        title:'[Placeholder] Fragment '+String(d.index+1).padStart(3,'0'),
        text:'[Placeholder] One image from this cluster, held close by the camera instead of framing the whole group — swap in the real subject and caption.'
      };
    }
    return {
      kicker:c.name.replace('[Placeholder] ',''), clusterId:c.id,
      camera:{x:clusterBox[c.id].cx,y:clusterBox[c.id].cy,zoom:clusterZoomFor(c)},
      title:c.name,
      text:c.blurb
    };
  }),
  // The story's last beat holds close on one final image (the 4th cluster,
  // never visited up close) — clicking through then zooms all the way back
  // out as free exploration opens up, instead of the story just ending flat.
  (()=>{
    const d=detailTarget(clusters[3]);
    return {
      kicker:'Free exploration', clusterId:clusters[3].id, end:true,
      camera:{x:d.x,y:d.y,zoom:d.zoom},
      title:'[Placeholder] Fragment '+String(d.index+1).padStart(3,'0'),
      text:'[Placeholder] One last image, held close. Step through and the camera pulls all the way back out — then you can drag, zoom, and click through everything yourself.'
    };
  })()
];

let sceneIndex=0;

const storyPopup=document.querySelector('#storyPopup');
const storyKickerText=document.querySelector('#storyKickerText');
const storyTitle=document.querySelector('#storyTitle');
const storyText=document.querySelector('#storyText');
const storyDots=document.querySelector('#storyDots');
const backBtn=document.querySelector('#backBtn');
const nextBtn=document.querySelector('#nextBtn');
const captionHint=document.querySelector('#captionHint');

scenes.forEach((_,i)=>{
  const dot=document.createElement('i');
  dot.dataset.i=i;
  storyDots.appendChild(dot);
});

function renderDots(){
  [...storyDots.children].forEach((d,i)=>{
    d.classList.toggle('on',i===sceneIndex);
    d.classList.toggle('done',i<sceneIndex);
  });
}

function goToScene(i){
  sceneIndex=clamp(i,0,scenes.length-1);
  const s=scenes[sceneIndex];
  const zoom=s.camera.zoom==='fit'?fitScale():s.camera.zoom;
  setCamera(s.camera.x,s.camera.y,zoom,s.camera.focus??.36);
  highlightCluster(s.clusterId);

  storyPopup.classList.remove('show');
  setTimeout(()=>{
    storyKickerText.textContent=`Scene ${String(sceneIndex+1).padStart(2,'0')} / ${scenes.length} — ${s.kicker}`;
    storyTitle.textContent=s.title;
    storyText.textContent=s.text;
    renderDots();
    backBtn.disabled=sceneIndex===0;
    nextBtn.textContent=s.end?'Start exploring →':'Next →';
    nextBtn.classList.toggle('primary',!!s.end);
    storyPopup.classList.add('show');
  },s.end?0:180);
}

function unlockExploration(){
  locked=false;
  interactive.classList.remove('locked');
  storyPopup.classList.remove('show');
  highlightCluster(null);
  captionHint.classList.add('show');
  state.vx=state.vy=0;
  // The story ends zoomed in — pull back out to the full overview as
  // exploration opens up, rather than dropping the user in wherever the
  // last scene happened to be framed.
  setCamera(WORLD_W/2,WORLD_H/2,fitScale(),.5);
}

backBtn.addEventListener('click',()=>{ if(sceneIndex>0) goToScene(sceneIndex-1) });
nextBtn.addEventListener('click',()=>{
  const s=scenes[sceneIndex];
  if(s.end){ unlockExploration(); return }
  goToScene(sceneIndex+1);
});

document.addEventListener('keydown',e=>{
  if(locked){
    if(e.key==='ArrowRight') nextBtn.click();
    if(e.key==='ArrowLeft' && sceneIndex>0) goToScene(sceneIndex-1);
    return;
  }
  const modal=document.querySelector('#modal');
  if(!modal.classList.contains('show')) return;
  if(e.key==='Escape') closeDetails();
  if(e.key==='ArrowRight') showDetail(activeImageIndex+1);
  if(e.key==='ArrowLeft') showDetail(activeImageIndex-1);
});

goToScene(0);

/* ---------------------------------------------------------------------
   FREE EXPLORATION  (unlocked after the last story scene)
--------------------------------------------------------------------- */
let activeImageIndex=0;
const detailTitles=['A place between moments','Something left behind','Light across the surface','A fragment worth keeping','Where the journey changes direction','A quiet detail','Seen while passing through','The shape of a memory'];
const detailTexts=[
  'This fragment was encountered while moving through the larger field of images. Its meaning is deliberately open — a small detail that becomes clearer when you stop and look closer.',
  'Part of the visual trail gathered during the journey, this image sits somewhere between documentation and memory.',
  'Pulled from the larger collection, this fragment changes when it is isolated from the surrounding images. Look closely at the details, texture, and light.',
  'The surface is made from many small moments like this one. Click through the collection to find the connections between them.',
  'This image marks one of the places where the visual journey begins to reorganize itself — from scattered fragments into a larger picture.'
];

function focusImageInWorld(index,instant=false){
  const card=surface.querySelector(`.card[data-index="${index}"]`);
  if(!card) return;
  const r=cardWorldRect(card);
  const panelW=Math.min(520,innerWidth*.94);
  const visibleW=Math.max(120,innerWidth-panelW);

  // Pick a comfortable close-up zoom, but never one that would make the
  // card wider/taller than the strip actually left visible beside the
  // detail panel — so the focused image can never end up hidden behind it.
  const MARGIN=.72, DESIRED=1.15;
  const fitW=(visibleW*MARGIN)/r.w, fitH=(innerHeight*MARGIN)/r.h;
  const targetScale=clamp(Math.min(DESIRED,fitW,fitH),MIN_SCALE,MAX_SCALE);

  const targetCenterX=visibleW/2, targetCenterY=innerHeight/2;
  state.ts=targetScale;
  state.tx=targetCenterX-r.cx*targetScale;
  state.ty=targetCenterY-r.cy*targetScale;
  // No clampCamera() here on purpose — while an image is focused the normal
  // world-bounds restriction is lifted (see `focusActive` in animate()) so
  // this exact framing is never fought/overridden by the generic clamp.
  if(instant){state.scale=state.ts;state.x=state.tx;state.y=state.ty}
}

function showDetail(index){
  activeImageIndex=(index+imgs.length)%imgs.length;
  const i=activeImageIndex;
  const modal=document.querySelector('#modal'), img=document.querySelector('#modalImg');
  focusActive=true; // lift the world-bounds clamp for as long as an image is focused
  focusImageInWorld(i);
  img.src=imgs[i]; img.alt='Fragment '+String(i+1).padStart(3,'0');
  document.querySelector('#modalInfo').textContent='Fragment '+String(i+1).padStart(3,'0');
  document.querySelector('#modalTitle').textContent=detailTitles[i%detailTitles.length];
  document.querySelector('#modalText').textContent=detailTexts[i%detailTexts.length];
  document.querySelector('#imageCount').textContent=(i+1)+' / '+imgs.length;
  modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
}
function openDetails(card){showDetail(Number(card.dataset.index))}
function closeDetails(){
  const modal=document.querySelector('#modal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');
  focusActive=false; // restore the normal world-bounds constraint
  clampCamera();
}

document.querySelector('#nextImage').onclick=()=>showDetail(activeImageIndex+1);
document.querySelector('#prevImage').onclick=()=>showDetail(activeImageIndex-1);
document.querySelector('#close').onclick=closeDetails;
document.querySelector('#modalBackdrop').onclick=closeDetails;

let gestureCard=null, gestureStartX=0, gestureStartY=0;
const CLICK_THRESHOLD=12;

interactive.addEventListener('pointerdown',e=>{
  if(locked || e.target.closest('button')) return;
  gestureCard=e.target.closest('.card');
  gestureStartX=e.clientX; gestureStartY=e.clientY;
  state.down=true; state.pointerId=e.pointerId;
  state.lastX=e.clientX; state.lastY=e.clientY;
  state.vx=state.vy=0; state.drag=0;
  interactive.setPointerCapture(e.pointerId);
});
interactive.addEventListener('pointermove',e=>{
  if(locked || !state.down || e.pointerId!==state.pointerId) return;
  const dx=e.clientX-state.lastX, dy=e.clientY-state.lastY;
  const total=Math.hypot(e.clientX-gestureStartX,e.clientY-gestureStartY);
  state.drag=total;
  if(total>CLICK_THRESHOLD){state.tx+=dx;state.ty+=dy;clampCamera();state.vx=dx;state.vy=dy}
  state.lastX=e.clientX; state.lastY=e.clientY;
});
interactive.addEventListener('pointerup',e=>{
  if(locked || e.pointerId!==state.pointerId) return;
  const card=gestureCard;
  const distance=Math.hypot(e.clientX-gestureStartX,e.clientY-gestureStartY);
  state.down=false; state.pointerId=null; gestureCard=null;
  if(card && distance<=CLICK_THRESHOLD && card.isConnected) openDetails(card);
});
interactive.addEventListener('pointercancel',()=>{state.down=false;state.pointerId=null;gestureCard=null});
interactive.addEventListener('wheel',e=>{
  if(locked) return;
  e.preventDefault();
  if(Math.abs(e.deltaY)>0) zoomAt(e.clientX,e.clientY,state.ts*Math.exp(-e.deltaY*.007));
  if(Math.abs(e.deltaX)>0){state.tx-=e.deltaX*1.15;clampCamera()}
},{passive:false});

window.addEventListener('resize',()=>{
  MIN_SCALE=fitScale();
  if(locked) goToScene(sceneIndex);
  else { clampCamera(); hardClampCamera() }
});
document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};
})();
</script>
</body></html>
