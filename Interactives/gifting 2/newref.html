<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gifting · prototype v2</title>
<style>
:root{--ink:#121212;--mute:#6b6b6b;--line:#cfcfcf;--red:#b3261e;--paper:#f7f7f4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 "Bitstream Charter",Charter,Georgia,serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
a{color:inherit}
.m{font-family:"Courier 10 Pitch",Courier,monospace}
/* chrome */
.chrome{position:sticky;top:0;z-index:60;background:#e9e9e9;border-bottom:1px solid #bbb;display:flex;align-items:center;gap:10px;padding:7px 14px}
.chrome i{width:10px;height:10px;border-radius:50%;background:#c4c4c4;display:inline-block}
.url{flex:1;background:#fff;border:1px solid #bbb;padding:3px 10px;font:12.5px "Courier 10 Pitch",Courier,monospace;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url b{color:var(--red);font-weight:normal}
.lofi{font:11px "Courier 10 Pitch",Courier,monospace;color:var(--red);letter-spacing:.06em;white-space:nowrap}
/* site header */
.site{display:flex;align-items:center;gap:16px;padding:12px 7vw;background:#fff;border-bottom:1px solid var(--ink)}
.site b{font-size:18px;cursor:pointer}
.site .gift{font:12px "Courier 10 Pitch",Courier,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.seg{margin-left:auto;display:flex;border:1.5px solid var(--ink)}
.seg a{padding:5px 12px;font:12.5px "Courier 10 Pitch",Courier,monospace;text-decoration:none;cursor:pointer}
.seg a.on{background:var(--ink);color:#fff}
/* landing */
.stark{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 38px)}
.stark a{display:flex;flex-direction:column;justify-content:flex-end;padding:48px;text-decoration:none;border-right:2px solid var(--ink);cursor:pointer;background:#fff;position:relative}
.stark a:last-child{border:0;background:var(--ink);color:#fff}
.stark .k{font:12px "Courier 10 Pitch",Courier,monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.stark h1{font-size:clamp(44px,6vw,80px);line-height:.95;letter-spacing:-.02em}
.stark p{font-size:19px;margin-top:14px;max-width:440px;opacity:.85}
.stark .brand{position:absolute;top:30px;left:48px;font-weight:bold;font-size:20px}
.stark a:last-child .brand{display:none}
/* hero + intro */
.hero{min-height:50vh;position:relative;overflow:hidden;border-bottom:2px solid var(--ink);background:#fff;display:flex;flex-direction:column;justify-content:center;padding:40px 7vw 70px}
.hero h1{font-size:clamp(34px,5.2vw,74px);line-height:1;letter-spacing:-.02em;max-width:960px}
.ans{display:flex;gap:10px;margin-top:24px;max-width:820px;align-items:stretch;flex-wrap:wrap}
.ans input{flex:1;min-width:200px;border:0;border-bottom:2px solid var(--ink);background:transparent;font:20px "Bitstream Charter",Georgia,serif;padding:8px 2px;outline:none}
.go{border:2px solid var(--ink);background:var(--ink);color:#fff;padding:6px 18px;font:bold 13px "Courier 10 Pitch",Courier,monospace}
.skip{font:13px "Courier 10 Pitch",Courier,monospace;text-decoration:underline;padding:0 8px}
.thanks{margin-top:12px;font:13px "Courier 10 Pitch",Courier,monospace;color:var(--red);min-height:18px}
.peek{position:absolute;bottom:-58px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
.peek span{width:110px;height:110px;border:1.5px solid var(--ink);background:#fff;border-radius:4px;box-shadow:3px 3px 0 var(--ink)}
.intro{padding:60px 7vw 26px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:end}
.intro h2{font-size:clamp(32px,3.6vw,48px);line-height:1.02;letter-spacing:-.015em}
.intro p{font-size:19px;line-height:1.45;margin-top:14px;max-width:560px}
.ph-copy{display:inline-block;font:10.5px "Courier 10 Pitch",Courier,monospace;color:var(--red);border:1px dashed var(--red);padding:1px 6px;margin-bottom:10px;letter-spacing:.06em}
/* jump */
.jump{position:sticky;top:38px;z-index:40;background:rgba(247,247,244,.97);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;align-items:center;padding:0 7vw;gap:16px}
.jump .idx{display:flex;overflow-x:auto;scrollbar-width:none;flex:1}
.jump .idx::-webkit-scrollbar{display:none}
.jump .idx a{white-space:nowrap;padding:11px 12px 11px 0;margin-right:12px;border-right:1px solid var(--line);text-decoration:none;font-size:14.5px;cursor:pointer}
.jump .idx a small{font:10.5px "Courier 10 Pitch",Courier,monospace;color:var(--mute);margin-right:5px}
.jump .tools{white-space:nowrap;display:flex;gap:14px;align-items:center;font:12.5px "Courier 10 Pitch",Courier,monospace}
.jump .tools button{text-decoration:underline}
.mine3{display:flex;gap:4px}.mine3 i{width:12px;height:16px;border:1.3px solid var(--ink);border-radius:2px}.mine3 i.f{background:var(--red);border-color:var(--red)}
.keptb{border:1.5px solid var(--ink);padding:3px 9px;background:#fff;text-decoration:none!important}.keptb.n{background:var(--red);border-color:var(--red);color:#fff}
/* sections */
.sec{padding:52px 5vw 24px;scroll-margin-top:96px}
.sh{display:flex;align-items:baseline;gap:16px;margin:0 2vw 22px;flex-wrap:wrap}
.sh .n{font:bold 13px "Courier 10 Pitch",Courier,monospace}
.sh h3{font-size:clamp(28px,3vw,40px);letter-spacing:-.015em;line-height:1}
.sh .sub{font:12.5px "Courier 10 Pitch",Courier,monospace;color:var(--mute)}
.sh .enemy{font-size:17px;font-style:italic;color:#333}
.sh .more{margin-left:auto;font:12.5px "Courier 10 Pitch",Courier,monospace;text-decoration:underline;cursor:pointer}
.sask{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 2vw 24px;padding:10px 14px;border:1.5px dashed var(--ink);background:rgba(255,255,255,.8);max-width:980px}
.sask .q{font-size:17px;font-weight:bold}
.sask .q small{display:block;font:normal 10.5px "Courier 10 Pitch",Courier,monospace;letter-spacing:.1em;color:#777;text-transform:uppercase}
.sask input{flex:1;min-width:180px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;font:16px Georgia,serif;padding:4px 2px;outline:none}
.sask input.num{flex:0 0 110px;min-width:0}
.chip{border:1.5px solid var(--ink);padding:4px 10px;font:12px "Courier 10 Pitch",Courier,monospace;cursor:pointer;background:#fff}
.chip.on{background:var(--ink);color:#fff}
.res{font:12.5px "Courier 10 Pitch",Courier,monospace;color:var(--red)}
/* cards */
.wall{display:flex;flex-wrap:wrap;gap:26px 4px;align-items:flex-start;justify-content:center}
.card{position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:5px;box-shadow:4px 4px 0 var(--ink);padding:14px 15px 12px;margin:0 2px;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.card:hover{transform:rotate(0) translateY(-6px)!important;box-shadow:7px 9px 0 var(--ink)}
.card.S{width:178px;min-height:200px}.card.M{width:222px;min-height:240px}.card.L{width:280px;min-height:300px}
.card .lab{font:10.5px "Courier 10 Pitch",Courier,monospace;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.card .band{height:16px;margin:8px -15px 12px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.s2 .band{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,#fff 1px 6px)}
.s3 .band{background:radial-gradient(var(--ink) 1.1px,#fff 1.3px) 0 0/7px 7px}
.s4 .band{background:repeating-linear-gradient(0deg,var(--ink) 0 1px,#fff 1px 4px)}
.s5 .band{background:linear-gradient(var(--ink) 1px,transparent 1px) 0 0/8px 8px,linear-gradient(90deg,var(--ink) 1px,#fff 1px) 0 0/8px 8px}
.card h4{font-weight:bold;flex:1}
.card.S h4{font-size:16.5px;line-height:1.18}.card.M h4{font-size:19.5px;line-height:1.15}.card.L h4{font-size:24px;line-height:1.1}
.who{font:10.5px "Courier 10 Pitch",Courier,monospace;color:var(--mute);margin-top:6px}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:12px}.dots i{width:5px;height:5px;background:var(--ink)}
.foot{display:flex;justify-content:space-between;margin-top:7px;font:11px "Courier 10 Pitch",Courier,monospace}.foot b{font-size:13px}
.one{position:absolute;top:-12px;right:-10px;background:#fff;border:1.5px solid var(--ink);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font:bold 10.5px "Courier 10 Pitch",Courier,monospace;transform:rotate(12deg);text-align:center;line-height:1}
.vs h4{display:grid}.vs .or{font:bold 11px "Courier 10 Pitch",Courier,monospace;margin:6px 0;border-top:1px solid var(--ink);padding-top:6px}
.card.picked{outline:3px solid var(--red);outline-offset:3px}
.card.picked:after{content:"+1";position:absolute;bottom:-14px;right:14px;background:var(--red);color:#fff;font:bold 12px "Courier 10 Pitch",Courier,monospace;padding:3px 8px}
.card.match{box-shadow:4px 4px 0 var(--red);border-color:var(--red)}
.card.match:before{content:"sounds like you";position:absolute;top:-11px;left:12px;background:var(--red);color:#fff;font:10.5px "Courier 10 Pitch",Courier,monospace;padding:2px 7px}
/* tags */
.line{position:relative;display:flex;justify-content:center;gap:16px;padding:34px 1vw 10px;min-height:360px}
.line:before{content:"";position:absolute;left:0;right:0;top:20px;height:40px;border-top:1.6px solid var(--ink);border-radius:50% 50% 0 0/24px 24px 0 0;transform:scaleY(-1);transform-origin:50% 0}
.tag{position:relative;flex:0 0 212px;width:212px;transform-origin:50% -14px;cursor:pointer;transition:transform .25s;filter:drop-shadow(4px 4px 0 var(--ink))}
.tag:hover{transform:rotate(0) translateY(-4px)!important}
.tag .str{position:absolute;left:50%;top:-16px;height:30px;border-left:1.3px solid var(--ink)}
.tag .body{position:relative;background:#fff;border:1.6px solid var(--ink);padding:34px 15px 13px;min-height:300px;display:flex;flex-direction:column;clip-path:polygon(24% 0,76% 0,100% 11%,100% 100%,0 100%,0 11%)}
.tag .hole{position:absolute;left:50%;top:12px;width:14px;height:14px;margin-left:-7px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.tag h4{font-size:18.5px;line-height:1.18;font-weight:bold;flex:1}
.tag .it{margin-top:12px;border-top:1px dashed var(--ink);padding-top:8px;font-size:14px;line-height:1.25}
.tag .it span{display:block;font:10px "Courier 10 Pitch",Courier,monospace;letter-spacing:.1em;color:var(--mute);margin-bottom:2px}
.tag .ft{display:flex;justify-content:space-between;margin-top:8px;font:11px "Courier 10 Pitch",Courier,monospace}
.tag.kept:after{content:"KEPT";position:absolute;bottom:-12px;right:12px;background:var(--red);color:#fff;font:bold 11px "Courier 10 Pitch",Courier,monospace;padding:3px 8px}
.tag.for{filter:drop-shadow(4px 4px 0 var(--red))}.tag.for .body{border-color:var(--red);border-width:2.4px}
.tag.for:before{content:"for them";position:absolute;top:22px;right:-6px;z-index:3;background:var(--red);color:#fff;font:10.5px "Courier 10 Pitch",Courier,monospace;padding:2px 7px;transform:rotate(6deg)}
.tag.ed .body{background:repeating-linear-gradient(135deg,#fff 0 8px,#f1f1f1 8px 9px)}
.apartwrap{background:var(--ink);color:#fff;margin-top:50px;padding:16px 0 46px}
.apartwrap .ah{padding:26px 7vw 0;font:12px "Courier 10 Pitch",Courier,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.apartwrap .enemy{color:#ccc!important}.apartwrap .line:before{border-color:#fff}.apartwrap .tag .str{border-color:#fff}
.apartwrap .tag{filter:drop-shadow(4px 4px 0 var(--red))}.apartwrap .tag .hole{background:var(--ink)}.apartwrap .tag .body{color:var(--ink)}
/* overlay */
.ov{position:fixed;inset:0;z-index:80;background:rgba(247,247,244,.86);backdrop-filter:blur(1.5px);display:none;align-items:center;justify-content:center}
.ov.on{display:flex}
.big{width:min(640px,92vw);max-height:88vh;overflow:auto;background:#fff;border:2px solid var(--ink);box-shadow:9px 9px 0 var(--ink);padding:22px 26px 20px;position:relative;animation:flip .35s ease}
@keyframes flip{from{transform:perspective(900px) rotateY(80deg) scale(.85)}to{transform:none}}
.big .lab{font:11px "Courier 10 Pitch",Courier,monospace;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big .lab .pn button{font:16px Courier,monospace;padding:0 6px}
.big h2{font-size:28px;line-height:1.1;margin:12px 0 4px}
.big .thing{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin:12px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.big .thing h2{margin:0}
.big .thing .bandr{font:12px "Courier 10 Pitch",Courier,monospace;text-align:right}.big .thing .bandr b{font-size:20px;display:block}
.big blockquote{font-size:16.5px;line-height:1.42;margin-top:14px;padding-left:14px;border-left:2px solid var(--ink)}
.big blockquote.first{font-size:20px;font-weight:bold}
.big cite,.cite{display:block;font:normal 11px "Courier 10 Pitch",Courier,monospace;color:var(--mute);margin-top:4px}
.data{margin-top:16px;border-top:1px solid var(--ink);padding-top:10px;font:12px "Courier 10 Pitch",Courier,monospace;display:flex;gap:20px;align-items:end;flex-wrap:wrap}
.yrs{display:flex;gap:6px;align-items:flex-end;height:44px}.yrs div{width:26px;background:repeating-linear-gradient(135deg,var(--ink) 0 2px,#fff 2px 5px);border:1px solid var(--ink);position:relative}.yrs div span{position:absolute;bottom:-15px;left:-2px;font-size:9.5px}
.bars{display:grid;grid-template-columns:auto 120px auto;gap:2px 8px;align-items:center;font-size:11px}.bars i{height:8px;background:var(--ink)}
.xlink{margin-top:14px;border:1.5px dashed var(--ink);padding:10px 12px;font-size:15px;cursor:pointer;display:block;text-decoration:none}
.xlink span{display:block;font:10.5px "Courier 10 Pitch",Courier,monospace;letter-spacing:.1em;color:var(--mute);margin-bottom:3px}
.xlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);padding:8px 13px;font:bold 13px "Courier 10 Pitch",Courier,monospace}
.btn.red{border-color:var(--red);color:var(--red)}.btn.red.on{background:var(--red);color:#fff}
.btn.dark{background:var(--ink);color:#fff}.btn.on{background:#eee}
.left{font:11.5px "Courier 10 Pitch",Courier,monospace;color:var(--mute)}
.x{position:absolute;top:8px;right:12px;font:22px "Courier 10 Pitch",Courier,monospace}
.warn{font:12px "Courier 10 Pitch",Courier,monospace;color:var(--red);margin-top:8px;min-height:14px}
/* picks tray */
.tray{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;background:#fff;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:none;align-items:center;gap:12px;padding:9px 12px;max-width:94vw}
.tray.on{display:flex}
.tray .slot{width:140px;height:56px;border:1.5px dashed var(--ink);border-radius:3px;font-size:12px;line-height:1.2;padding:5px 7px;overflow:hidden;position:relative}
.tray .slot.f{border-style:solid;border-color:var(--red)}
.tray .t{font:11.5px "Courier 10 Pitch",Courier,monospace}
/* pages */
.page{max-width:1120px;margin:0 auto;padding:28px 40px 110px;background:#fff;min-height:100vh}
.crumb{font:12px "Courier 10 Pitch",Courier,monospace;color:var(--mute)}.crumb a{color:var(--ink);cursor:pointer}
.phead{display:grid;grid-template-columns:1.4fr 1fr;gap:46px;margin-top:24px;border-bottom:2px solid var(--ink);padding-bottom:26px}
.phead h1{font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.02em}
.phead .side{font:12.5px "Courier 10 Pitch",Courier,monospace;align-self:end;line-height:1.6}
.phead .big2{font:bold 64px "Bitstream Charter",Georgia,serif;line-height:1}
.pgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:46px;margin-top:28px}
.alist blockquote{font-size:17px;line-height:1.42;padding:13px 0;border-bottom:1px solid var(--line)}
.h5{font:bold 12px "Courier 10 Pitch",Courier,monospace;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.mini{display:inline-block;vertical-align:top;width:180px;margin:0 10px 12px 0;border:1.5px solid var(--ink);padding:10px;font-size:14px;line-height:1.2;background:#fff;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.mini small{display:block;font:10.5px "Courier 10 Pitch",Courier,monospace;color:var(--mute);margin-top:6px}
.mini.tg{clip-path:polygon(18% 0,82% 0,100% 9%,100% 100%,0 100%,0 9%);padding-top:18px;box-shadow:none;border-width:1.5px}
table.g{width:100%;border-collapse:collapse;margin-top:24px;font-size:15.5px}
.g th{font:bold 11px "Courier 10 Pitch",Courier,monospace;letter-spacing:.08em;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ink);padding:6px}
.g td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}.g td.mm{font:12px "Courier 10 Pitch",Courier,monospace;white-space:nowrap}
.g tr.hi td{background:#fff3f2}.g td i{display:block;font-size:13px;color:#555;margin-top:3px;font-style:normal;font-family:Courier,monospace}
.mecard{max-width:560px;margin:30px auto 0;background:var(--ink);color:#fff;border-radius:6px;padding:26px;box-shadow:9px 9px 0 var(--red)}
.mecard .k{font:11px "Courier 10 Pitch",Courier,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.mecard ol{list-style:none;margin:16px 0}.mecard li{font-size:21px;line-height:1.2;padding:10px 0;border-bottom:1px solid #444}
.mecard li small{display:block;font:11px "Courier 10 Pitch",Courier,monospace;opacity:.7;margin-top:4px}
.view{display:none}.view.on{display:block}
footer.f{padding:44px 7vw 120px;font:12px "Courier 10 Pitch",Courier,monospace;color:var(--mute)}

.tr{font-style:italic;font-size:14px;margin:6px 0 2px;opacity:.75}
/* charts */
:root{--v-give:#2a68a8;--v-get:#c2741f;--v-s1:#8fb2dc;--v-s2:#5d8fcb;--v-s3:#2f69ab;--v-s4:#173f70}
.vizwrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:6px 0 26px}
.viz{margin:0;background:#fff;border:1.5px solid var(--ink);padding:18px 20px 14px;position:relative}
.viz h4{font-size:20px;line-height:1.2;margin:2px 0 6px}
.vsub,.vsrc,.vlegend,.vx,.vk,.vsplit,.vt{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
.vsub{color:#555;margin:0 0 10px}.vsrc{color:#6b6b6b;margin:10px 0 4px;font-size:12px}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;color:#333}.vlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}.vnote{color:#6b6b6b}
.vbars{display:flex;gap:10px;height:170px;align-items:stretch;border-bottom:1px solid #bbb;padding-top:16px}
.vgrp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.vpair{display:flex;gap:2px;align-items:flex-end;height:100%}
.vb{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.vb em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 12px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-style:normal;color:var(--ink)}
.vx{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:#555;font-size:12px;white-space:nowrap}
.vsplit{display:flex;gap:2px;margin-top:32px;height:10px}.vsplit span{background:#bdbbb3}.vsplit span:nth-child(2){background:var(--v-give)}.vsplit span:nth-child(3){background:var(--v-get)}
.vsplitk{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#333;margin:6px 0 0}.vsplit span:first-child{border-radius:4px 0 0 4px}.vsplit span:last-child{border-radius:0 4px 4px 0}.vsplit b{color:var(--ink)}
.vstack{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px}.vk{color:#333}.vrow.me .vk{font-weight:700;color:var(--ink)}
.vseg{display:flex;gap:2px;height:24px}.vseg span{display:flex;align-items:center;justify-content:center;font:600 11px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-width:2px}
.vseg span:first-child{border-radius:4px 0 0 4px}.vseg span:last-child{border-radius:0 4px 4px 0}
.vrow.me .vseg{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* ================= v2 SKIN: the stationer's drawer ================= */
:root{--desk:#e6e4dd;--ink:#1d1c1a;--red:#b3261e;--kraft:#c4a273;--kraft-d:#9c7a4b;

/* ---------- gift tag: kraft with a tear-off stub ---------- */
.tag{filter:drop-shadow(0 10px 10px rgba(50,35,10,.28)) drop-shadow(0 1px 1px rgba(50,35,10,.3));transform:rotate(var(--r))}

<script>const DATA={"SECS": [{"id": "s1", "n": "01", "name": "What should a gift mean?", "slug": "for"}, {"id": "s2", "n": "02", "name": "What feelings should it evoke?", "slug": "moment"}, {"id": "s3", "n": "03", "name": "Who is hardest to buy for?", "slug": "people"}, {"id": "s4", "n": "04", "name": "What won't we buy ourselves?", "slug": "secret"}, {"id": "s5", "n": "05", "name": "How much should a gift cost?", "slug": "cost"}], "B": [{"s": "s1", "id": "useful", "h": "Gift which can survive atleast 15 months.", "w": "Reader, 40–50", "n": 249, "kw": ["use", "useful", "practical", "functional", "utility"], "q": [["I like to gift things that have a function, not merely decorative objects. The receiver should be able to eat it, read it or put it to some use.", "Reader, over 60"], ["improve any aspect of their life even by 1%", "S.C.S., Gurugram, 25–30"], ["It should be something the other person would use, not always sentimental bullshit", "Reader, 25–30"]], "data": "Share of philosophies saying \"useful\", by year", "gifts": ["Buy it once", "The honest upgrade"]}, {"s": "s1", "id": "about-them", "h": "Personal but not “personalised”.", "w": "T., Kolkata, 30–40", "n": 148, "kw": ["personal", "them", "their", "interest", "personality", "person"], "q": [["A book on a topic someone loves - personal. A coffee mug with you name on it - personalised technically, but just shows that you don’t know the person", "T., Kolkata, 30–40"], ["The expression to aim for is \"oh wow! I didn't know I needed it\"", "J., Mumbai, 40–50"], ["Do not gift something that the receiver is deeply invested in the domain, but you have only superficial knowledge of.", "A., Bengaluru, 30–40"]], "data": "Share saying \"about them\", by year", "gifts": ["The reader", "Made by someone with a name"]}, {"s": "s1", "id": "wouldnt", "h": "Buy what they wouldn’t, wrap it like they would.", "w": "S., Hyderabad, 30–40", "n": 71, "kw": ["wouldn't buy", "won't buy", "themselves", "splurge", "indulge", "never buy"], "q": [["It’s like splurging on behalf of a friend who would find the object too impractical.", "Reader, 30–40"], ["gets people what they were 70% sure that they want it, but would have never made efforts to search and purchase", "Reader, 40–50"]], "data": "Share by year", "gifts": ["Buy it once", "The honest upgrade"]}, {"s": "s1", "id": "listening", "h": "Proves you were listening in March when you had to gift in December.", "w": "M., Gurgaon, 20–25", "n": 82, "kw": ["listen", "attention", "effort", "thought", "mention", "notice"], "q": [["I try to gift items that people mention in passing because it ... represents not only something they liked, but also the fact that i am always interested in what they are saying", "Reader, 20–25"], ["the “it’s the thought that counts” line gets used backwards. People say it to excuse a bad gift, but really it should raise the bar.", "S.S., Nainital, 25–30"]]}, {"s": "s1", "id": "lasts", "h": "Gets the receiver to call immediately, and to remember it for a long time", "w": "Reader, 50–60", "n": 69, "kw": ["remember", "memory", "memories", "last", "forever", "cherish"], "q": [["a for life companion which the receiver shall use often and maybe a few times think about me while using it", "D., Karnataka, 20–25"], ["I try not to gift perishables (food, alcohol etc.) coz I want people to remember me by the gift I give them.", "Reader, 30–40"]], "gifts": ["The archive", "Patina"]}, {"s": "s1", "id": "me", "h": "Gift something that you would really love to keep if the other person is out of station :)", "w": "Reader, 40–50", "n": 42, "kw": ["i like", "i love", "my taste", "myself would"], "q": [["i want to gift them something that also tells about my own taste, as well as elevate's theirs", "M., Gurgaon, 20–25"], ["I dont go with budget or will not gift something I don't love. Many times I go without a present", "V.A., Gurgaon, 50–60"]]}, {"s": "s1", "id": "useless", "h": "Should be completely useless for the recipient.", "w": "Reader, 30–40", "n": 28, "kw": ["joy", "fun", "useless", "delight"], "q": [["It must smell nice, or must feel good (e.g., a fluffy house slipper)", "Reader, 25–30"]], "gifts": ["Permission to play", "The senses"]}, {"s": "s1", "id": "cash", "h": "cash and gift cards are dope", "w": "M., Gurgaon, 20–25", "n": 29, "kw": ["cash", "money", "voucher", "gift card", "lifafa"], "q": [["Materialistic - Lifafa (money cover) rules", "Reader, 30–40"], ["Cash and gift cards feel like a shortcut, even if someone says they would prefer it, a real gift shows you thought about them", "A.F., Bengaluru, 30–40"], ["Cash essentially means either 'I am lazy' or 'I forgot to get you a gift'.", "Reader, 20–25"]], "gifts": ["The answer is less"], "split": [29, 14]}, {"s": "s1", "id": "occasion", "h": "A great gift is an occasion in itself", "w": "Reader, 25–30", "n": 21, "kw": ["occasion", "birthday", "random", "no reason"], "q": [["I often buy books in March for people with October birthdays, because it was the right book, and gift it immediately, because who's seen tomorrow", "Reader, 40–50"], ["Don't do it on a birthday / anniversary / occasion, it'll get lost in the crowd", "T.F., Kerala, 30–40"]]}, {"s": "s4", "id": "treat", "h": "Treating is when you spend on something that you might never or rarely spend again.", "w": "S., Mumbai, 40–50", "n": 34, "kw": ["treat", "rare", "once"], "q": [["If I have to plan /make sacrifices to get it the delayed gratification hit is amazing", "Reader, 25–30"], ["it should be in my wishlist for a few months at least", "Reader, 25–30"]]}, {"s": "s1", "id": "obligation", "h": "Gifting creates unnecesary obligations. For a poor country, its a waste of resources. That money should go in better drainage.", "w": "V.S., Delhi-NCR, 50–60", "n": 13, "kw": ["obligation", "pressure", "reciprocate", "expect"], "q": [["I dont accept gifts that are too expensive( meaning for which i can never return the favour) stupid middleclass conditioning that i am unable to let go.", "Reader, 30–40"], ["I don't gift friends because it sets unrealistic expectations - gifting small items like books are fine. Buying a beer is where I stop.", "Reader, 30–40"]]}, {"s": "s2", "id": "cared-for", "h": "she still sends me photographs, saying that she remembers me every time she sees it", "w": "K., Gurugram, 40–50", "n": 49, "feel": true, "kw": ["care", "loved", "feel"], "q": [["I gifted a glass painted bottle to my mentor, and she loved it, and she still sends me photographs, saying that she remembers me every time she sees it", "K., Gurugram, 40–50"]], "data": "The feeling readers most want a gift to create (154 answers)"}, {"s": "s2", "id": "time", "h": "Time (or a representation of it) as a gift always wins.", "w": "T.F., Kerala, 30–40", "n": 31, "kw": ["handmade", "made", "craft", "diy", "time"], "q": [["I made a colleague a pen stand from air dry clay ... she really enjoyed it and even showed it off to the entire office - which I was not expecting.", "Reader, 30–40"], ["Painted a mural for a friend and their daughter - they watched me do the whole thing but loved it at the end", "Reader, 30–40"]], "gifts": ["Made by someone with a name"]}, {"s": "s2", "id": "qr", "h": "A card with a QR code that took my mother to a song that my Nana sang for her.", "w": "E.C., Mumbai, 25–30", "n": 56, "kw": ["photo", "album", "letter", "video", "memories"], "q": [["For my husband’s 30th birthday, I got everyone in his life to send photos, write him a note ... and made an album.", "Reader, 40–50"], ["A video with personal anecdotes from over 40 people ... when he did ask for a copy of the video so that he could save it - I’d take that as a win", "Reader, 30–40"]], "gifts": ["The archive"]}, {"s": "s2", "id": "vinyls", "h": "Gramophone to father, reacted by straight away going to market to buy vinyls.", "w": "V., Bengaluru, 25–30", "n": 42, "kw": ["reaction", "face", "surprise", "delight"], "q": [["Got my mom [a new phone] (on a modest salary of 15000/month in Mumbai). She was very emotional, cried a bit. But also incredibly proud", "P., Hyderabad, 30–40"], ["An acquaintance liked the chain I was wearing and I gave it to him. The pendant on it was something he always wanted. He was in tears.", "M., Bangalore, 50–60"]]}, {"s": "s2", "id": "cringe", "h": "Heartfelt. Even if its a little cringe, I'd rather go for more feeling than less.", "w": "Reader, 30–40", "n": 27, "kw": ["note", "handwritten", "letter", "card"], "q": [["Always handwritten, on a postcard that I pick up from travels.", "T.F., Kerala, 30–40"], ["I love writing something. it's a compulsion else you have just purchased something", "Reader, 40–50"]]}, {"s": "s3", "id": "paise", "h": "Parents - paise kyun kharch karne hai", "w": "S.C.S., Gurugram, 25–30", "n": 10, "kw": ["parents", "spend", "money"], "q": [["Giving them the things they need doesn't feel like presents that's just life. And whenever I gift them the things they want I get scolded because they know the price", "Reader, 25–30"], ["she gets angry when I buy her a gift as I could have used that money to buy something for me", "K.M., Ahmedabad, 25–30"], ["Dad, gets angry if I spend money.", "S., Jalna, 20–25"]], "gifts": ["The person who refuses"]}, {"s": "s3", "id": "spouse", "h": "I know her too well for “safe” to feel thoughtful", "w": "A.F., Bengaluru, 30–40", "n": 27, "kw": ["wife", "husband", "spouse", "partner"], "q": [["husband - cuz nothing is a surprise anymore.", "Reader, 25–30"], ["Wife. She won't give any kind of clue before or feedback after", "Reader, 50–60"]]}, {"s": "s3", "id": "surgeon", "h": "A specific friend, for he can dissect the gift and its reasoning like a surgeon.", "w": "A., Kolkata, 25–30", "n": 18, "kw": ["picky", "particular", "choosy"], "q": [["Bade Papa, he has very strong filters for what enters his life", "Reader, 25–30"], ["People who do not accept graciously. They’ll find something wrong with every gift", "Reader, 30–40"]]}, {"s": "s3", "id": "men", "h": "male friends, at 35-40 years they get snappy about birthdays amd celebrations", "w": "Reader, 30–40", "n": 6, "kw": ["men", "male"], "q": [["beyond the usual ideas of wallets, shirts and ties, very few things can be gifted", "Reader, 20–25"], ["Male friends because they already have the best of everything they use and cars are expensive to buy as gifts!", "Reader, 50–60"]]}, {"s": "s1", "id": "nudges", "h": "Occasions are nudges.", "w": "T.F., Kerala, 30–40", "n": 7, "occ": true, "kw": ["birthday", "wedding", "diwali", "occasion"], "q": [["No gifts at weddings.", "N., Hyderabad, 40–50"], ["It's okay for gifts to arrive slightly ... late (shipping takes time, people)", "Reader, 20–25"]], "data": "Occasions that drive readers' gifting (top 5 each)"}, {"s": "s3", "id": "self", "h": "Myself. Every spend feels like it needs to be justified.", "w": "S.V., Mumbai, 30–40", "n": 4, "kw": ["myself", "self"], "q": [["Myself as I am conflicted between gifting myself vs others.", "Reader, 40–50"], ["I am really bad at \"treating myself\". Never do it.", "Reader, 30–40"]]}, {"s": "s3", "id": "crush", "h": "the person I have a crush on and who is also a friend", "w": "S., 20–25", "n": 1, "kw": ["crush"], "q": [["I don't want to overdo it ... my gift also should give him a hint without ruining what we have", "S., 20–25"]]}, {"s": "s4", "id": "mom-guilt", "h": "A spa day. Reason: Mom guilt.", "w": "Reader, 30–40", "n": 7, "kw": ["guilt", "spa"], "q": [["A gold bracelet. I do not feel comfortable spending that much on myself", "Reader, 20–25"], ["A meditation retreat, long pending item on my self love list. somehow i'm scared of the time away from work and family.", "D., Bangalore, 30–40"]], "gifts": ["The body"]}, {"s": "s4", "id": "bicycle", "h": "A bicycle. I want to just wander the city. But can never justify it to myself", "w": "S.V., Mumbai, 30–40", "n": 13, "kw": ["justify", "indulgence"], "q": [["RC car .. it's absolutely childish 😅. But it's something I will never be able to justify to myself for buying", "Reader, 25–30"], ["[A flip phone with no apps]. I know that I will love it, but it feels like a bit of consumerist excess", "T.F., Kerala, 30–40"]], "gifts": ["Life is outside", "Permission to play"]}, {"s": "s4", "id": "better-use", "h": "I always think there is better use for money", "w": "A., Gurgaon, 30–40", "n": 11, "kw": ["better use", "value"], "q": [["A designer handbag. I won’t buy one because I don’t see the point in spending 1 lakh on a purse, when I can get a very good one in 10 k", "P., Hyderabad, 30–40"], ["expensive pen from [a luxury pen maker], coz cheaper are functional", "R.B., Bangalore, 40–50"]], "gifts": ["Buy it once"]}, {"s": "s4", "id": "wallet", "h": "Wallet - superstition; never buy your own wallet.", "w": "D., Mumbai, 50–60", "n": 2, "kw": ["wallet", "superstition", "luck"], "q": [["A good luck bamboo plant because of the stupid belief that it should be gifted not bought", "Reader, 40–50"]]}, {"s": "s4", "id": "too-dear", "h": "Weekly flowers -  wouldn’t buy for self coz they are too expensive", "w": "T., Kolkata, 30–40", "n": 27, "kw": ["expensive", "costly"], "q": [["Calvin And Hobbes box set - too expensive", "Reader, 50–60"], ["Expensive chocolate like [Japanese craft chocolate]. I feel it’s too expensive to buy without an occasion", "T., Kolkata, 30–40"]], "gifts": ["The senses"]}, {"s": "s4", "id": "kitten", "h": "A kitten. (Adopted not purchased).", "w": "P.J., Bangalore, 30–40", "n": 1, "kw": ["pet", "cat", "dog"], "q": [["If my family adopts one for me, it will be them accepting the decision as well instead of a liability I have imposed on them", "P.J., Bangalore, 30–40"]], "gifts": ["Pets"]}, {"s": "s5", "id": "utne", "h": "Utne ka hi do, jitne ka tumhe saamne wala de, toh use pressured feel na ho.", "w": "Reader, 30–40", "n": 7, "budget": true, "kw": ["reciproc", "pressure", "return"], "q": [["buy a gift worth a price that someone else gifting you never feels pressured that its too expensive ... ideal range is 2k to 8k", "Reader, 30–40"]], "data": "Median ideal budget, give vs. receive", "tr": "Give only as much as the other person could give you, so they don’t feel pressured."}, {"s": "s5", "id": "chocolate", "h": "If your budget is Rs.1,000, gift the best chocolate bar you can find, rather than the cheapest headphones.", "w": "Reader, 40–50", "n": 15, "kw": ["budget", "best", "quality"], "q": [["Dont be stingy in cost and send a thoughful one than generalising with a bottle of wine.", "P.G., Gurgaon, 50–60"], ["Spend the extra $$$ if it’ll make the gift memorable", "Reader, 30–40"]]}, {"s": "s5", "id": "ramen", "h": "A pack of ramen with meaning loaded behind it is a better gift than a costly set of gourmet cookies.", "w": "Reader, 30–40", "n": 23, "kw": ["price", "cost", "money doesn"], "q": [["Don't look at the money. Gift what the other person wants or has been dreaming to buy since long but haven't yet.", "Reader, 30–40"]]}, {"s": "s5", "id": "tiers", "h": "rank relationships based on Tiers (Example - D-tier right up to S-tier)", "w": "Reader, 30–40", "n": 9, "kw": ["close", "relationship", "tier"], "q": [["For me, if it’s a family member, I will find a way to gift them what they want", "Reader, 25–30"]], "tier": true, "data": "Share of yearly gifting each group gets (most common answer)"}, {"s": "s5", "id": "thirtieth", "h": "30th birthday Will have more budget than 31st. 50th even more.", "w": "Reader, 30–40", "n": 14, "kw": ["milestone", "30th", "occasion"], "q": [["Occasion of gifting. Higher for birthdays, personal occasions vs. Diwali gifting", "Reader, 25–30"]]}], "FEEL": [["Cared-for", 49], ["Delighted / surprised", 43], ["Seen & understood", 35], ["Useful every day", 23], ["Nostalgic", 2], ["Spoiled", 2]], "OCC": [["Birthdays", 139], ["Weddings", 88], ["Housewarming", 82], ["Anniversaries", 77], ["Dinner parties", 68], ["Diwali", 62], ["New baby", 59]], "TIER": [["Immediate family", "10–25%"], ["Closest friends", "5–10%"], ["Friends", "1–5%"], ["Colleagues   return `<section class="sec" id="${c.id}" style="--ink:${INK[c.id]}"><div class="sh"><span class="mark">${c.n}</span><h3>${c.name}</h3><span class="enemy">${c.enemy}</span><span class="more" onclick="go('/gifting/recommendations/${c.id}')">all ${c.total} →</span></div><div class="swipe">swipe →</div><div class="line">${gs.map(tagHTML).join('')}</div></section>`}
function recommendations(){const ap=ORDER.filter(id=>C.find(c=>c.id===id).apart),main=ORDER.filter(id=>!ap.includes(id));return lede('recommendations')+`
  <header class="hero"><h1>Who's hard to buy for this year?</h1>
   <form class="ans" onsubmit="answerR(event)"><input id="who" placeholder="My dad, who wants nothing…" autocomplete="off"><button class="go">Show me</button><button class="skip" type="button" onclick="document.getElementById('intro').scrollIntoView({behavior:'smooth'})">Just browsing ↓</button></form><div class="thanks" id="thanks"></div></header>
  <div class="intro" id="intro"><div><span class="ph-copy">PLACEHOLDER COPY</span><h2>Every gift here came with a person attached.</h2><p>We asked readers what to give and kept only the gifts that arrived with a reason. So the reason is the headline. The thing itself is in the small print.</p></div>
   <div><p>Three years of answers, sorted into sixteen kinds of gift. No brands on the front, no product photos, nothing above about ₹50,000.</p><p style="margin-top:10px">Keep the ones you like. We'll hold them for this visit.</p></div></div>
  <nav class="jump"><div class="idx">${ORDER.map(id=>{const c=C.find(x=>x.id===id);return `<a onclick="jumpTo('${id}')"><small>${c.n}</small>${c.name}</a>`}).join('')}</div>
   <div class="tools"><button class="hide-m" onclick="route()">Shuffle</button><button onclick="drawG()">Draw one</button><button class="keptb ${kept.length?'n':''}" onclick="go('/gifting/recommendations/kept')">Kept · ${kept.length}</button></div></nav>
  ${main.map(id=>lineHTML(C.find(c=>c.id===id))).join('')}
  <div class="apartwrap"><div class="ah">Two more, set apart: one is a person, the other is not buying</div>${ap.map(id=>lineHTML(C.find(c=>c.id===id))).join('')}</div>
  <footer class="f">₹ under ~3k · ₹₹ 3–12k · ₹₹₹ 12–35k · ₹₹₹₹ up to the ceiling. Credit is initials and city. Prototype, 28 Oct 2026.</footer>`}
function answerR(e){e.preventDefault();const raw=document.getElementById('who').value,t=raw.toLowerCase();if(raw.trim())gkAdd('q09','Your hardest person to buy for',raw.trim(),'text');
  const words=t.split(/[^a-z-]+/).filter(w=>w.length>2);forIds=G.filter(g=>g.for.some(f=>words.some(w=>f===w||f.startsWith(w)||w.startsWith(f)))).map(g=>g.id);
  document.getElementById('app').innerHTML=recommendations();document.getElementById('who').value=raw;
  document.getElementById('thanks').textContent=forIds.length?`Marked ${forIds.length} tags readers gave to someone like that ↓`:'Nobody has written about them yet. Have a look anyway ↓';
  setTimeout(()=>document.getElementById('intro').scrollIntoView({behavior:'smooth'}),700)}
function drawG(){const gs=G.filter(g=>!g.pageonly);openTag(gs[Math.floor(Math.random()*gs.length)].id)}
function openTag(id){const g=G.find(x=>x.id===id),c=C.find(x=>x.id===g.c),sib=G.filter(x=>x.c===g.c&&!x.pageonly),i=Math.max(0,sib.indexOf(g));
  setURL('/gifting/recommendations/'+g.c+'<b>#'+id+'</b>');const bl=g.bel&&B.find(b=>b.id===g.bel[0]);
  ov(`<div class="big"><button class="x" onclick="closeOv()">×</button>
   <div class="lab"><span>${c.n} · ${c.name}</span><span class="pn"><button onclick="openTag('${sib[(i-1+sib.length)%sib.length].id}')">‹</button>${i+1} / ${sib.length}<button onclick="openTag('${sib[(i+1)%sib.length].id}')">›</button></span></div>
   <div class="thing"><h2>${E(g.it)}</h2><div class="bandr"><b>${band(g.b)}</b>came up ${g.n}×</div></div>
   <blockquote class="first">${g.ed?E(g.h):'“'+E(g.h)+'”'}<cite>${E(g.w)}</cite></blockquote>${g.q.map(q=>`<blockquote>“${E(q[0])}”<cite>${E(q[1])}</cite></blockquote>`).join('')}
   <div class="data" style="justify-content:space-between"><span>WHERE TO GET A GOOD ONE<br>[makers: with you in review-gift-tags.md]</span><span>READERS GAVE IT TO<br>${E(g.for.slice(0,3).join(', '))}</span></div>
   ${bl?`<a class="xlink" onclick="go('/gifting/philosophies/${bl.id}')"><span>THE BELIEF BEHIND IT · PHILOSOPHIES →</span>“${E(bl.h)}”</a>`:''}
   <div class="acts"><button class="btn red ${kept.includes(id)?'on':''}" onclick="keep('${id}')">${kept.includes(id)?'Kept':'Keep'}</button>
    <button class="btn ${landed.includes(id)?'on':''}" onclick="land('${id}')">I gave this, it landed</button><button class="btn dark" onclick="go('/gifting/recommendations/${g.c}?hi=${id}')">All of ${c.name} →</button></div>
   ${landed.includes(id)?`<div class="ans" style="margin-top:12px"><input id="howin" placeholder="Who was it for, and how did it go? One line."><button class="go" onclick="how('${id}')">Send</button></div>${gkUser()?'':'<div class="warn">Your “it landed” counts once you confirm your email.</div>'}`:''}</div>`)}
function keep(id){kept=kept.includes(id)?kept.filter(k=>k!==id):[...kept,id];sset('kept',kept);document.querySelectorAll('.tag').forEach(t=>t.classList.toggle('kept',kept.includes(t.dataset.id)));
  const kb=document.querySelector('.keptb');if(kb){kb.textContent='Kept · '+kept.length;kb.classList.toggle('n',kept.length>0)}openTag(id)}
function land(id){if(!landed.includes(id)){landed.push(id);sset('landed',landed);gkAdd('landed:'+id,'It landed · '+G.find(x=>x.id===id).it,1,'tap')}openTag(id)}
function how(id){const v=document.getElementById('howin').value.trim();if(v){gkAdd('how:'+id,'How it went · '+G.find(x=>x.id===id).it,v,'text');document.getElementById('howin').value=''}}
function sectionPage(cid,hi){const c=C.find(x=>x.id===cid);if(!c)return '<div class="page">Not found</div>';const gs=G.filter(g=>g.c===cid);
  const bels=[...new Set(gs.filter(g=>g.bel).map(g=>g.bel[0]))].map(id=>B.find(b=>b.id===id)).filter(Boolean);
  const fromB=B.filter(b=>(b.gifts||[]).includes(c.name)&&!bels.includes(b));
  return `<div class="page"><div class="crumb"><a onclick="go('/gifting')">Gifting</a> / <a onclick="go('/gifting/recommendations')">Recommendations</a> / ${c.name}</div>
   <div class="phead"><div><div class="m" style="font-weight:bold">${c.n}</div><h1>${c.name}</h1><p style="font-size:20px;font-style:italic;margin-top:8px">${c.enemy}</p></div>
    <div class="side">${c.total} kinds of gift in this section<br>${gs.length} with a reader's story so far<br>no brands on the front; makers on the back<br>ceiling ≈ ₹50,000</div></div>
   <table class="g"><thead><tr><th>The gift</th><th>Why, in a reader's words</th><th>Band</th><th>Came up</th><th></th></tr></thead><tbody>
   ${gs.map(g=>`<tr class="${g.id===hi?'hi':''}"><td><b>${E(g.it)}</b></td><td>${g.ed?E(g.h):'“'+E(g.h)+'”'}<i>${E(g.w)}</i></td><td class="mm">${band(g.b)}</td><td class="mm">${g.n}×</td><td class="mm"><a style="cursor:pointer;text-decoration:underline" onclick="keep('${g.id}');closeOv();route()">${kept.includes(g.id)?'kept':'keep'}</a></td></tr>`).join('')}</tbody></table>
   <div class="pgrid"><div><div class="h5">Beliefs behind these gifts · Philosophies</div>${[...bels,...fromB].map(b=>`<div class="mini" onclick="go('/gifting/philosophies/${b.id}')">“${E(b.h.slice(0,70))}${b.h.length>70?'…':''}”<small>${b.vs?b.n+' vs '+b.n2:b.n} readers</small></div>`).join('')||'<p class="cite">None mapped yet.</p>'}</div>
    <div><div class="h5">Tell us one we've missed</div><div class="ans" style="margin-top:0"><input id="missin" placeholder="The gift, who it was for, and why it worked…"><button class="go" onclick="const v=document.getElementById('missin').value.trim();if(v){gkAdd('missed:${cid}:'+Date.now(),'A gift for ${E(c.name)}',v,'text');document.getElementById('missin').value=''}">Send</button></div></div></div></div>`}
function keptPage(){const gs=kept.map(id=>G.find(x=>x.id===id)).filter(Boolean);
  return `<div class="page"><div class="crumb"><a onclick="go('/gifting/recommendations')">Recommendations</a> / kept</div><div class="phead"><div><h1>Your shortlist</h1></div><div class="side">${gs.length} kept in this browser</div></div>
   <table class="g"><tbody>${gs.map(g=>`<tr><td><b>${E(g.it)}</b></td><td>“${E(g.h)}”<i>${E(g.w)}</i></td><td class="mm">${band(g.b)}</td><td class="mm">${C.find(c=>c.id===g.c).name}</td></tr>`).join('')||'<tr><td>Nothing kept yet.</td></tr>'}</tbody></table>
   <div class="acts" style="margin-top:20px"><button class="btn red on" onclick="gkUser()?gkToast('Shortlist emailed'):gkOpen('Email yourself this shortlist')">Email me my shortlist</button><button class="btn" onclick="gkToast('Link copied')">Copy link</button></div></div>`}

/* ---------- shared ---------- */
function ov(html){const o=document.getElementById('ov');o.innerHTML=html;o.classList.add('on')}
function closeOv(silent){document.getElementById('ov').classList.remove('on');if(!silent){const p=location.hash.slice(1)||'/gifting';setURL(p)}}
function tray(){const t=document.getElementById('tray');const onP=(location.hash||'').startsWith('#/gifting/philosophies')&&!(location.hash||'').includes('/mine');
  if(!picks.length||!onP){t.classList.remove('on');return}
  t.innerHTML=`<span class="t">Your three</span>`+[0,1,2].map(k=>{const b=B.find(x=>x.id===picks[k]);return b?`<div class="slot f">“${E(b.h.slice(0,56))}${b.h.length>56?'…':''}”</div>`:'<div class="slot"></div>'}).join('')+
   `<button class="btn ${picks.length===3?'red on':''}" style="${picks.length<3?'opacity:.4':''}" onclick="${picks.length===3?`go('/gifting/philosophies/mine?b=${picks.join(',')}')`:''}">${picks.length===3?'See mine →':(3-picks.length)+' to go'}</button>`;t.classList.add('on')}
</script>

<script>
/* Drafts live in this browser until the email is confirmed. One row per question key, so answering on two pages overwrites, never duplicates. */
const GK_K='gk_drafts',GK_U='gk_user';
function gkLoad(){try{return JSON.parse(localStorage.getItem(GK_K)||'{}')}catch(e){return {}}}
function gkSave(d){try{localStorage.setItem(GK_K,JSON.stringify(d))}catch(e){}}
function gkUser(){try{return localStorage.getItem(GK_U)}catch(e){return null}}
function gkE(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function gkToast(m){const t=document.getElementById('gktoast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function gkAdd(key,label,value,kind){
  if(gkUser()){gkToast(kind==='text'?'Saved · it’s with the editor now':'Counted');return 'saved'}
  const d=gkLoad();d[key]={label,value,kind,page:(document.title.split('·')[0]||'').trim(),ts:Date.now()};gkSave(d);gkPill();
  gkToast(kind==='text'?'Kept as a draft in this browser · confirm your email to send it':'Noted · it counts once you confirm your email');return 'draft'}
function gkDel(key){const d=gkLoad();delete d[key];gkSave(d);gkPill()}
function gkPill(){const p=document.getElementById('gkpill');if(!p)return;const u=gkUser(),n=Object.keys(gkLoad()).length;
  p.classList.toggle('ver',!!u);
  if(u){p.innerHTML='<i></i>'+gkE(u.replace(/^(.).*(@.*)$/,'$1•••$2'))+' · answers save as you go';p.classList.add('on')}
  else if(n){p.innerHTML='<i></i>Your answers · '+n+' waiting →';p.classList.add('on')}
  else p.classList.remove('on')}
function gkClose(){document.getElementById('gkov').classList.remove('on')}
let gkEmail='',gkWhy='';
function gkOpen(why){gkWhy=why||'';const u=gkUser();const box=document.getElementById('gkbox');
  if(u){box.innerHTML=`<button class="gkx" onclick="gkClose()">×</button><div class="k"><span>Signed in</span><span>${gkE(u)}</span></div><h3>Your answers save as you go.</h3><p>Words go to the editor; taps count straight away. You'll get an email if anything you wrote is published.</p><div class="gkrow"><button class="gklink" onclick="gkSignOut()">Sign out of this browser</button></div>`;
    document.getElementById('gkov').classList.add('on');return}
  const d=gkLoad(),ks=Object.keys(d).sort((a,b)=>d[a].ts-d[b].ts);
  const words=ks.filter(k=>d[k].kind==='text').length,taps=ks.length-words;
  box.innerHTML=`<button class="gkx" onclick="gkClose()">×</button>
   <div class="k"><span>Waiting in this browser</span><span>${ks.length}</span></div>
   <h3>${gkWhy||(ks.length?'Send these to The Ken?':'Nothing waiting yet')}</h3>
   <p>${ks.length?`Nothing leaves your browser until you confirm your email. One free Ken account, no password: we send a 6-digit code.`:'Answer anything on the page and it will wait here.'}</p>
   ${ks.length?`<ul>${ks.map(k=>`<li><span class="t ${d[k].kind==='text'?'w':''}">${d[k].kind==='text'?'words':d[k].kind==='number'?'number':'tap'}</span><span>${gkE(d[k].label)}${(d[k].kind!=='tap'||d[k].value!==1)?`<small>“${gkE(String(d[k].value).slice(0,90))}${String(d[k].value).length>90?'…':''}”</small>`:''}</span><button onclick="gkDel('${k}');gkOpen()">×</button></li>`).join('')}</ul>`:''}
   <div class="gkrow"><input type="email" id="gkem" placeholder="you@example.com" value="${gkE(gkEmail)}"><button class="gkbtn red" onclick="gkSend()">Send me a code</button></div>
   <div class="gkfine">${words} with words go to the editor; ${taps} taps or numbers count once confirmed. Already a Ken subscriber? Use that email and it links to your account.<br>Invisible bot check runs here · throwaway email domains refused · max 5 codes an hour.</div>`;
  document.getElementById('gkov').classList.add('on')}
function gkSend(){const v=(document.getElementById('gkem').value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){gkToast('That email doesn’t look right');return}gkEmail=v;
  const box=document.getElementById('gkbox');const n=Object.keys(gkLoad()).length;
  box.innerHTML=`<button class="gkx" onclick="gkClose()">×</button><div class="k"><span>Step 2 of 2</span><span>${n} waiting</span></div>
   <h3>Enter the code we sent to ${gkE(v)}</h3><p>Keep this tab open: your drafts are here, not on our server.</p>
   <div class="gkcode">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()">`).join('')}</div>
   <div class="gkopts"><b style="font:bold 11px Courier,monospace;letter-spacing:.1em">IF WE PUBLISH ANYTHING YOU WROTE, CREDIT IT AS</b>
     <label><input type="radio" name="cr" checked> Initials and city</label><label><input type="radio" name="cr"> “A reader, 30–40”</label><label><input type="radio" name="cr"> Don’t publish my words, just count them</label>
     <label style="margin-top:6px"><input type="checkbox" checked> The Ken may publish my words, lightly edited</label>
     <label><input type="checkbox"> Also send me First Principles (free newsletter)</label></div>
   <div class="gkrow"><button class="gkbtn red" onclick="gkConfirm()">Confirm and send ${n}</button><button class="gklink" onclick="gkToast('New code sent')">Resend</button><button class="gklink" onclick="gkToast('Link sent. Drafts wait unseen on our server for 24 hours, then are deleted.')">Use a link instead</button></div>
   <div class="gkfine">We use your email to confirm it’s you and to tell you if your answer is published. You can see, edit or delete your answers any time. <b>[Consent notice: DPDP Act wording to be reviewed by legal]</b></div>`;
  document.getElementById('gkov').classList.add('on');setTimeout(()=>{const f=box.querySelector('.gkcode input');f&&f.focus()},50)}
function gkConfirm(){const d=gkLoad(),ks=Object.keys(d);const words=ks.filter(k=>d[k].kind==='text').length,rest=ks.length-words;
  try{localStorage.setItem(GK_U,gkEmail);localStorage.setItem('gk_sent',JSON.stringify(d))}catch(e){}gkSave({});gkPill();
  document.getElementById('gkbox').innerHTML=`<button class="gkx" onclick="gkClose()">×</button><div class="k"><span>Done</span><span>${gkE(gkEmail)}</span></div>
