<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bajaj Dynasty: Fixed Lineage</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #fcfaf7; margin: 0; font-family: 'Segoe UI', sans-serif; }
        #main { width: 100vw; height: 100vh; }
        .info { position: absolute; top: 20px; left: 20px; border-left: 4px solid #b08d57; padding-left: 15px; }
        h1 { margin: 0; color: #2c3e50; font-size: 1.5rem; }
        p { color: #666; margin: 5px 0; }
    </style>
</head>
<body>

<div class="info">
    <h1>The Bajaj Dynasty</h1>
    <p>Blue = Male Lineage | Pink = Spouses</p>
</div>

<div id="main"></div>

<script type="text/javascript">
    var chartDom = document.getElementById('main');
    var myChart = echarts.init(chartDom);

    // Data structured for a clean Tree View
    const data = {
        name: "Jamnalal & Janaki Devi",
        children: [
            {
                name: "Kamalnayan & Savitri",
                itemStyle: { color: '#d85a30' },
                children: [
                    {
                        name: "Rahul & Rupa",
                        itemStyle: { color: '#f28e2b' },
                        children: [
                            { name: "Rajiv & Sanjivani" },
                            { name: "Sanjiv & Shefali" },
                            { name: "Sunaina" }
                        ]
                    },
                    { name: "Shishir & Minakshi" },
                    { name: "Suman" }
                ]
            },
            {
                name: "Ramkrishna & Vimla",
                itemStyle: { color: '#1d9e75' },
                children: [
                    { name: "Shekhar & Kiran" },
                    { name: "Madhur & Kumud" },
                    { name: "Niraj & Minal" }
                ]
            }
        ]
    };

    myChart.setOption({
        tooltip: { trigger: 'item', triggerOn: 'mousemove' },
        series: [{
            type: 'tree',
            data: [data],
            top: '10%',
            left: '15%',
            bottom: '10%',
            right: '20%',
            symbolSize: 10,
            initialTreeDepth: 3,
            label: {
                position: 'left',
                verticalAlign: 'middle',
                align: 'right',
                fontSize: 12,
                backgroundColor: '#fff',
                padding: [5, 10],
                borderRadius: 4,
                shadowColor: 'rgba(0,0,0,0.1)',
                shadowBlur: 5,
                // Custom formatting to show the "Half-tab" effect visually
                formatter: function(params) {
                    let parts = params.name.split(' & ');
                    if (parts.length > 1) {
                        return '{man|' + parts[0] + '}  {woman|' + parts[1] + '}';
                    }
                    return '{man|' + params.name + '}';
                },
                rich: {
                    man: { color: '#2980b9', fontWeight: 'bold' },
                    woman: { color: '#e67e22', fontSize: 11 }
                }
            },
            leaves: {
                label: { position: 'right', align: 'left' }
            },
            emphasis: { focus: 'descendant' },
            expandAndCollapse: true,
            animationDuration: 550,
            animationDurationUpdate: 750
        }]
    });

    window.onresize = myChart.resize;
</script>

</body>
</html>
