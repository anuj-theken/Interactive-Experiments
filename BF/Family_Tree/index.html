<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bajaj Dynasty - Final Version</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #fcfaf7; margin: 0; font-family: sans-serif; overflow: hidden; }
        #main { width: 100vw; height: 100vh; }
        .header { position: absolute; top: 20px; left: 20px; z-index: 10; border-left: 4px solid #e6a817; padding-left: 15px; }
        h1 { margin: 0; color: #2c3e50; font-size: 1.4rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>The Bajaj Dynasty</h1>
    <p>Curved Text & Image Placeholders</p>
</div>
<div id="main"></div>

<script type="text/javascript">
    var chartDom = document.getElementById('main');
    var myChart = echarts.init(chartDom);

    // Using a reliable external URL for the placeholder icon
    const imgPlaceholder = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

    const data = [{
        name: 'Jamnalal &\nJanaki Devi',
        itemStyle: { color: '#b08d57' },
        children: [
            {
                name: 'Ramkrishna',
                itemStyle: { color: '#1d9e75' },
                children: [
                    { name: 'Shekhar', value: 1, itemStyle: { color: '#378add' } },
                    { name: 'Madhur', value: 1, itemStyle: { color: '#378add' } },
                    { name: 'Niraj', value: 1, itemStyle: { color: '#378add' } }
                ]
            },
            {
                name: 'Kamalnayan',
                itemStyle: { color: '#d85a30' },
                children: [
                    {
                        name: 'Rahul',
                        itemStyle: { color: '#f39c12' },
                        children: [
                            { name: 'Rajiv', value: 1, itemStyle: { color: '#e57373' } },
                            { name: 'Sanjiv', value: 1, itemStyle: { color: '#e57373' } },
                            { name: 'Sunaina', value: 1, itemStyle: { color: '#e57373' } }
                        ]
                    },
                    {
                        name: 'Shishir',
                        itemStyle: { color: '#f39c12' },
                        children: [
                            { name: 'Kushagra', value: 1, itemStyle: { color: '#ffbe76' } },
                            { name: 'Apoorva', value: 1, itemStyle: { color: '#ffbe76' } }
                        ]
                    }
                ]
            }
        ]
    }];

    var option = {
        series: {
            type: 'sunburst',
            data: data,
            radius: [0, '95%'],
            sort: undefined,
            levels: [
                {},
                { r0: '0%', r: '18%', label: { rotate: 0, fontSize: 12, color: '#333' } }, // Founders
                { r0: '18%', r: '45%' }, // 2nd Gen
                { r0: '45%', r: '72%' }, // 3rd Gen
                { r0: '72%', r: '95%' }  // 4th Gen
            ],
            label: {
                show: true,
                // 'tangential' makes the text follow the curve of the circle
                rotate: 'tangential',
                formatter: '{img|}\n{name|{b}}',
                rich: {
                    img: {
                        backgroundColor: { image: imgPlaceholder },
                        height: 30,
                        width: 30,
                        borderRadius: 15,
                        align: 'center'
                    },
                    name: {
                        color: '#fff',
                        fontSize: 11,
                        align: 'center',
                        padding: [5, 0, 0, 0]
                    }
                }
            },
            itemStyle: {
                borderWidth: 2,
                borderColor: '#fff'
            }
        }
    };

    myChart.setOption(option);
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
