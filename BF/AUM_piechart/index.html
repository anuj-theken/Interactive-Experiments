<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #0d1117;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* The Main Container with Dotted Border */
        .dashboard-container {
            background-color: var(--card-bg);
            border: 2px dotted #444c56;
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* Legend Styling */
        .legend-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .leg-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .leg-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        /* Responsive Grid: 1 column on mobile, 2 on web */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile default */
            gap: 40px;
        }

        @media (min-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr 1fr; /* Web version */
            }
        }

        .chart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div id="legend-shared" class="legend-wrap"></div>

        <div class="chart-grid">
            <div class="chart-wrapper">
                <div class="chart-title">2018 MARKET SHARE</div>
                <canvas id="canvas2018" width="350" height="350"></canvas>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title">2025 PROJECTED</div>
                <canvas id="canvas2025" width="350" height="350"></canvas>
            </div>
        </div>
    </div>

    <script>
        const LABELS = [
            'Mortgages', 'Consumer lending', 'MSME lending',
            'Commercial lending', 'Loan against securities', 'Rural lending',
            'Captive 2W/3W finance', 'Open market 2W/3W finance', 'Others'
        ];

        const COLORS = [
            '#7C6FF7', '#4DC8C4', '#F7A44D', '#F06B6B', '#5BB8F5',
            '#A8D96C', '#F76FAD', '#FFD166', '#9B8EBB'
        ];

        const DATA_2018 = [29, 19, 14, 11, 5, 8, 3, 2, 9];
        const DATA_2025 = [31, 21, 12, 7, 7, 6, 3, 2, 11];

        // 1. Generate Legend
        const legendContainer = document.getElementById('legend-shared');
        legendContainer.innerHTML = LABELS.map((label, i) => `
            <div class="leg-item">
                <div class="leg-swatch" style="background: ${COLORS[i]}"></div>
                ${label}
            </div>
        `).join('');

        // 2. Chart Drawing Function
        function drawPie(canvasId, data) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            let startAngle = -Math.PI / 2;
            const total = data.reduce((a, b) => a + b, 0);

            data.forEach((value, i) => {
                const sliceAngle = (value / total) * 2 * Math.PI;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = COLORS[i];
                ctx.fill();

                // Slice Border
                ctx.strokeStyle = '#0d1117';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Add Percentage Text
                if (value > 3) {
                    const middleAngle = startAngle + sliceAngle / 2;
                    const textX = centerX + Math.cos(middleAngle) * (radius * 0.7);
                    const textY = centerY + Math.sin(middleAngle) * (radius * 0.7);

                    ctx.fillStyle = "white";
                    ctx.font = "bold 14px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(value + "%", textX, textY);
                    ctx.shadowBlur = 0; // Reset shadow
                }

                startAngle += sliceAngle;
            });
        }

        // Initialize
        drawPie('canvas2018', DATA_2018);
        drawPie('canvas2025', DATA_2025);
    </script>
</body>
</html>
