<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Two-Wheeler Scrollytelling</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #1a1c2c;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        #main-stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .text-wrap {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 40%;
            z-index: 100; /* Ensure text is always on top */
        }

        .step-text {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 2.5rem;
            opacity: 0;
            line-height: 1.2;
            transition: opacity 0.3s ease;
        }

        /* Default visible state for first text */
        #text1 { opacity: 1; }

        .visual-stage {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .asset {
            position: absolute;
            opacity: 0;
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Default visible state for first assets */
        #road, #circle, #bike1 { opacity: 1; }

        /* Positioning - Adjust these based on your PNG crops */
        #circle { z-index: 1; width: 350px; height: 350px; background: #c5d6c4; border-radius: 50%; top: 20%; left: 45%; }
        #road { z-index: 2; bottom: 15%; left: 35%; width: 600px; }
        #signal { z-index: 5; right: 10%; top: 10%; width: 120px; }

        .bike { z-index: 10; bottom: 20%; left: 45%; width: 450px; }

        .scroll-spacer {
            height: 700vh; /* Length of the scroll experience */
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="main-stage">
        <div class="text-wrap">
            <div class="step-text" id="text1">Yamaha worked with Escorts.</div>
            <div class="step-text" id="text2">Honda with Firodia for scooters...</div>
            <div class="step-text" id="text3">...and with Hero MotoCorp for motorcycles.</div>
            <div class="step-text" id="text4">Suzuki with TVS and Maruti.</div>
            <div class="step-text" id="text5">Kawasaki with Bajaj in a technical partnership.</div>
            <div class="step-text" id="text6">Indians who wanted personal transportation now had more options, but two-wheelers were still a luxury.</div>
        </div>

        <div class="visual-stage">
            <div class="asset" id="circle"></div>
            <img src="1_road.png" id="road" class="asset">
            <img src="traffic_signal.png" id="signal" class="asset">

            <img src="1_yamaha.png" id="bike1" class="asset bike">
            <img src="2_honda_scooter.png" id="bike2" class="asset bike">
            <img src="3_hero_honda.png" id="bike3" class="asset bike">
            <img src="4_suzuki.png" id="bike4" class="asset bike">
            <img src="5_kawasaki.png" id="bike5" class="asset bike">
            <img src="6_helmets.png" id="bike6" class="asset bike">
        </div>
    </div>

    <div class="scroll-spacer"></div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const mainTl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-spacer",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        // FRAME 1 is already visible via CSS.
        // Our first action is to fade out Text1 and Bike1 while bringing in Frame 2.

        mainTl
            // Exit Frame 1, Enter Frame 2
            .to(["#text1", "#bike1"], { opacity: 0, duration: 1 })
            .to(["#text2", "#signal", "#bike2"], { opacity: 1, duration: 1 }, "<")
            .to({}, {duration: 0.5}) // Pause

            // Exit Frame 2, Enter Frame 3
            .to(["#text2", "#bike2"], { opacity: 0, duration: 1 })
            .to(["#text3", "#bike3"], { opacity: 1, duration: 1 }, "<")
            .to({}, {duration: 0.5}) // Pause

            // Exit Frame 3, Enter Frame 4
            .to(["#text3", "#bike3"], { opacity: 0, duration: 1 })
            .to(["#text4", "#bike4"], { opacity: 1, duration: 1 }, "<")
            .to({}, {duration: 0.5}) // Pause

            // Exit Frame 4, Enter Frame 5
            .to(["#text4", "#bike4"], { opacity: 0, duration: 1 })
            .to(["#text5", "#bike5"], { opacity: 1, duration: 1 }, "<")
            .to({}, {duration: 0.5}) // Pause

            // Exit Frame 5, Enter Final Frame
            .to(["#text5", "#bike5"], { opacity: 0, duration: 1 })
            .to(["#text6", "#bike6"], { opacity: 1, duration: 1 }, "<")
            .to({}, {duration: 1}); // Hold final state

    </script>
</body>
</html>
