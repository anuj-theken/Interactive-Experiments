<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Bird Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #05070a; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100%; background: #05070a; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
                    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .menu-card { background: #1b5e20; padding: 40px; border-radius: 20px; text-align: center; width: 350px; border: 1px solid #2e7d32; }

        select { padding: 15px; width: 100%; border-radius: 8px; border: none; font-size: 1.1rem; margin-top: 20px; cursor: pointer; font-weight: bold; }

        .hud { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.85);
                padding: 20px; border-radius: 12px; border: 1px solid #444; display: none; }
        .date-val { font-size: 2.5rem; font-weight: 900; color: #00ffff; }
        .bird-val { color: #4caf50; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; font-weight: bold; }
        .loader-bar { height: 4px; width: 100%; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .progress { height: 100%; width: 0%; background: #ffd54f; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="overlay">
    <div class="menu-card">
        <h2 style="margin:0">Select Species</h2>
        <p style="color: #a5d6a7; font-size: 0.9rem;">Tracking top 10 Subcontinent birds</p>

        <select id="bird-selector">
            <option value="">-- Choose a Bird --</option>
            <option value="houspa">House Sparrow</option>
            <option value="houcro1">House Crow</option>
            <option value="commyn1">Common Myna</option>
            <option value="rossta2">Rosy Starling (Migrant)</option>
            <option value="barswa">Barn Swallow (Migrant)</option>
            <option value="piecuc1">Pied Cuckoo (Migrant)</option>
            <option value="purhef1">Purple Sunbird</option>
            <option value="blakit1">Black Kite</option>
            <option value="indrob1">Indian Robin</option>
            <option value="coobul2">Red-vented Bulbul</option>
        </select>
        <div id="setup-status" style="margin-top:15px; font-size:0.8rem; display:none;">
            Downloading migration data...
            <div class="loader-bar"><div id="progress-fill" class="progress"></div></div>
        </div>
    </div>
</div>

<div id="map"></div>
<div class="hud" id="hud">
    <div class="bird-val" id="hud-name">---</div>
    <div id="hud-date" class="date-val">---</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

<script>
    const EBIRD_API_KEY = 'oke2vcf2flhc';
    const REGIONS = ['IN', 'PK', 'BD', 'NP', 'LK', 'BT'];
    const TIME_STEPS = [120, 90, 60, 30, 1];

    const map = L.map('map', { zoomControl: false }).setView([22.0, 78.0], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }).addTo(map);

    let snapshots = [];
    let currentHeatLayer = null;

    document.getElementById('bird-selector').onchange = async (e) => {
        const code = e.target.value;
        const name = e.target.options[e.target.selectedIndex].text;
        if (!code) return;

        document.getElementById('setup-status').style.display = 'block';
        await startTracking(code, name);
    };

    async function startTracking(sppCode, comName) {
        if (!EBIRD_API_KEY || EBIRD_API_KEY.includes('YOUR')) {
            alert("Please set your API Key!"); return;
        }

        const totalSteps = TIME_STEPS.length;

        for (let i = 0; i < totalSteps; i++) {
            const days = TIME_STEPS[i];
            const date = getEbirdDate(days);

            // Update Progress Bar
            document.getElementById('progress-fill').style.width = `${((i+1)/totalSteps)*100}%`;

            // PARALLEL FETCHING: Request all regions at once for this date
            const regionRequests = REGIONS.map(reg =>
                fetch(`https://api.ebird.org/v2/data/obs/${reg}/historic/${date.path}?spp=${sppCode}`, {
                    headers: { 'x-ebirdapitoken': EBIRD_API_KEY }
                }).then(res => res.ok ? res.json() : [])
            );

            const regionResults = await Promise.all(regionRequests);
            const points = regionResults.flat().map(o => [o.lat, o.lng, 1.0]);
            snapshots.push({ label: date.label, points: points });
        }

        // UI Clean up
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('hud-name').innerText = comName;
        animateHeat();
    }

    function animateHeat() {
        let step = 0;
        setInterval(() => {
            if (currentHeatLayer) map.removeLayer(currentHeatLayer);
            const snap = snapshots[step];

            currentHeatLayer = L.heatLayer(snap.points, {
    radius: 40,         // Reduced from 60 to make the "centers" tighter
    blur: 15,           // Sharper edges make the data look more defined
    max: 0.05,          // LOWER max = HIGHER brightness for single points
    minOpacity: 0.8,    // Higher base visibility so it's not "faint"
    gradient: {
        0.2: '#00ffff', // Cyan (outer edge)
        0.5: '#ffff00', // Yellow (middle)
        1.0: '#ff0000'  // Red (core/highest density)
    }
}).addTo(map);

            document.getElementById('hud-date').innerText = snap.label;
            step = (step + 1) % snapshots.length;
        }, 1500);
    }

    function getEbirdDate(daysAgo) {
        const d = new Date();
        d.setDate(d.getDate() - daysAgo);
        return {
            path: `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`,
            label: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
        };
    }
</script>
</body>
</html>
