<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Migration Flow</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; }
        #header { background: #1b5e20; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: calc(100vh - 70px); width: 100%; background: #0b0e14; }

        /* Smooth Fading for Heat Layers */
        .leaflet-heatmap-layer {
            transition: opacity 1.2s ease-in-out;
        }

        .hud { position: absolute; top: 85px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #444; min-width: 200px; }
        .time-label { font-size: 1.4rem; font-weight: bold; color: #ffd54f; }
        .bird-label { color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; margin-bottom: 5px; }
        .status-msg { color: #ffd54f; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <h2 style="margin:0">🌊 Avian Flow: 4-Month Animation</h2>
    <span id="status" class="status-msg">Loading Multi-Month Data...</span>
</div>

<div id="map"></div>

<div class="hud" id="hud" style="display:none;">
    <div class="bird-label" id="active-bird">Select a Species</div>
    <div id="active-date" class="time-label">Waiting...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

<script>
    const EBIRD_API_KEY = 'oke2vcf2flhc'; 
    const REGIONS = ['IN', 'PK', 'BD', 'NP', 'LK', 'BT'];

    // We'll fetch 4 snapshots (roughly 30 days apart)
    const TIME_STEPS = [120, 90, 60, 30, 1];
    let birdDataStore = {}; // { BirdName: [Layer0, Layer1, Layer2, Layer3, Layer4] }
    let dateLabels = [];

    const map = L.map('map', { preferCanvas: true }).setView([22.0, 78.0], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }).addTo(map);

    let layerControl = L.control.layers(null, null, { collapsed: false }).addTo(map);
    let currentAnimationInterval = null;
    let currentBird = null;

    function getEbirdDate(daysAgo) {
        const d = new Date();
        d.setDate(d.getDate() - daysAgo);
        return {
            path: `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`,
            label: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
        };
    }

    async function fetchSnapshot(daysAgo) {
        const dateObj = getEbirdDate(daysAgo);
        let results = [];
        for (const reg of REGIONS) {
            try {
                const res = await fetch(`https://api.ebird.org/v2/data/obs/${reg}/historic/${dateObj.path}?rank=mrec`, {
                    headers: { 'x-ebirdapitoken': EBIRD_API_KEY }
                });
                if (res.ok) results = results.concat(await res.json());
            } catch (e) {}
        }
        return { label: dateObj.label, data: results };
    }

    async function init() {
        if (!EBIRD_API_KEY || EBIRD_API_KEY.includes('YOUR')) return;

        // 1. Fetch all time snapshots
        let snapshots = [];
        for (let days of TIME_STEPS) {
            document.getElementById('status').innerText = `Fetching data from ${days} days ago...`;
            const snap = await fetchSnapshot(days);
            snapshots.push(snap);
            dateLabels.push(snap.label);
        }

        // 2. Determine Top 5 birds across all snapshots
        const freq = {};
        snapshots.forEach(s => s.data.forEach(o => freq[o.comName] = (freq[o.comName] || 0) + 1));
        const topFive = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 5).map(i => i[0]);

        // 3. Create Heat Layers for each bird at each time step
        topFive.forEach(name => {
            birdDataStore[name] = snapshots.map((snap, idx) => {
                const pts = snap.data.filter(o => o.comName === name).map(o => [o.lat, o.lng, 1.0]);

                // Color shifts from Blue (past) to Red (present)
                const grad = idx < 2 ? {0.4: 'blue', 1: 'cyan'} : {0.4: 'orange', 1: 'red'};

                const layer = L.heatLayer(pts, { radius: 45, blur: 25, minOpacity: 0 });
                layer._idx = idx; // Store index for animation logic
                return layer;
            });

            // Add toggle to legend
            const dummyToggle = L.layerGroup();
            dummyToggle.on('add', () => startFadingAnimation(name));
            dummyToggle.on('remove', () => stopAnimation());
            layerControl.addOverlay(dummyToggle, `🐦 ${name}`);
        });

        document.getElementById('status').innerText = "Select a bird to see the flow";
        document.getElementById('hud').style.display = 'block';
    }

    function startFadingAnimation(name) {
        stopAnimation(); // Clean up previous
        currentBird = name;
        document.getElementById('active-bird').innerText = name;

        let step = 0;
        const layers = birdDataStore[name];

        currentAnimationInterval = setInterval(() => {
            // Remove previous layer
            layers.forEach(l => map.removeLayer(l));

            // Add current layer
            const activeLayer = layers[step];
            activeLayer.addTo(map);

            // Apply Fade Effect (CSS transition)
            const canvas = activeLayer._canvas;
            if(canvas) {
                canvas.style.opacity = 0;
                setTimeout(() => canvas.style.opacity = 0.8, 50);
            }

            document.getElementById('active-date').innerText = dateLabels[step];

            step = (step + 1) % layers.length;
        }, 2000); // 2 seconds per stage
    }

    function stopAnimation() {
        clearInterval(currentAnimationInterval);
        if (currentBird && birdDataStore[currentBird]) {
            birdDataStore[currentBird].forEach(l => map.removeLayer(l));
        }
        document.getElementById('active-date').innerText = "---";
    }

    window.onload = init;
</script>
</body>
</html>
