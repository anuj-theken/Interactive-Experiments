<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Overview: Revenue & Capex Ratio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Apache ECharts CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4 sm:p-8">

    <div class="w-full max-w-6xl bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 sm:p-10 flex flex-col gap-4">
        
        <!-- Single Header Text -->
        <div class="text-center sm:text-left">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">
                Financial Overview: Revenue & Capex Ratio
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Historical Trends (FY11 – FY26) & FY27 Target Projection
            </p>
        </div>

        <!-- Main ECharts Chart Container (Legend integrated inside chart top) -->
        <div id="financialChart" class="w-full h-[520px] sm:h-[580px]"></div>

    </div>

    <script>
        const years = [
            'FY11', 'FY12', 'FY13', 'FY14', 'FY15', 'FY16', 'FY17', 
            'FY18', 'FY19', 'FY20', 'FY21', 'FY22', 'FY23', 'FY24', 
            'FY25', 'FY26', 'FY27'
        ];

        // Revenue Data (FY11 - FY27)
        const revenueData = [
            37325, 48894, 62990, 81809, 94648, 108646, 117966, 
            123104, 146463, 156949, 164177, 191754, 225458, 240893, 
            255324, 267021,
            // FY27 Forecast bar styled with distinct semi-translucent fill & dashed border
            {
                value: 267021,
                itemStyle: {
                    color: 'rgba(99, 102, 241, 0.25)',
                    borderColor: '#6366f1',
                    borderWidth: 2,
                    borderType: 'dashed'
                }
            }
        ];

        // Capex Ratio - Historical Solid Line (FY11: 0% through FY26: 0.5%)
        const ratioHistorical = [
            0.0, 2.6, 2.8, 2.7, 1.3, 0.2, 0.0, 
            -0.1, 0.0, 0.2, 0.1, 0.0, -0.2, -0.2, 
            0.7, 0.5, null
        ];

        // Capex Ratio - Dotted Line Segment connecting FY26 (0.5%) to FY27 (2.0%)
        const ratioDottedProjection = [
            null, null, null, null, null, null, null, 
            null, null, null, null, null, null, null, 
            null, 0.5, 2.0
        ];

        // Formatters
        const numberFormatter = (val) => {
            if (val === null || val === undefined) return 'N/A';
            return '₹' + new Intl.NumberFormat('en-IN').format(val) + ' Cr';
        };

        const percentFormatter = (val) => {
            if (val === null || val === undefined) return 'N/A';
            return val.toFixed(1) + '%';
        };

        const chartDom = document.getElementById('financialChart');
        const myChart = echarts.init(chartDom);

        function getOption() {
            const textColor = '#475569';
            const gridBorderColor = '#f1f5f9';

            return {
                animationDuration: 800,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow',
                        shadowStyle: {
                            color: 'rgba(0, 0, 0, 0.02)'
                        }
                    },
                    backgroundColor: 'rgba(255, 255, 255, 0.98)',
                    borderColor: '#e2e8f0',
                    borderWidth: 1,
                    textStyle: {
                        color: '#0f172a',
                        fontSize: 12
                    },
                    padding: [10, 14],
                    extraCssText: 'box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08); border-radius: 8px;',
                    formatter: function(params) {
                        let header = `<div class="font-bold border-b border-slate-100 pb-1 mb-1.5">${params[0].axisValue} ${params[0].axisValue === 'FY27' ? '(Forecast)' : ''}</div>`;
                        let content = '';
                        const seenSeries = new Set();

                        params.forEach(param => {
                            let value = param.value;
                            if (typeof value === 'object' && value !== null) {
                                value = value.value;
                            }
                            if (value === null || value === undefined) return;

                            let seriesLabel = param.seriesName;
                            if (seriesLabel.includes('Ratio')) {
                                seriesLabel = 'Capex Ratio';
                            }

                            if (seenSeries.has(seriesLabel)) return;
                            seenSeries.add(seriesLabel);

                            let formattedVal = (param.seriesName === 'Revenue') 
                                ? numberFormatter(value) 
                                : percentFormatter(value);

                            content += `
                                <div class="flex items-center justify-between gap-4 py-0.5">
                                    <span class="flex items-center gap-1.5">
                                        <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: ${param.color};"></span>
                                        <span class="text-xs text-slate-500">${seriesLabel}:</span>
                                    </span>
                                    <span class="font-semibold text-xs">${formattedVal}</span>
                                </div>
                            `;
                        });
                        return header + content;
                    }
                },
                legend: {
                    top: '0%',
                    left: 'center',
                    icon: 'circle',
                    textStyle: {
                        color: textColor,
                        fontSize: 12,
                        fontWeight: 500
                    },
                    itemGap: 28,
                    data: [
                        { name: 'Revenue (₹ Cr)', icon: 'roundRect' },
                        { name: 'Capex Ratio (%)', icon: 'path://M0 0h24v24H0z' },
                        { name: 'FY27 Target Projection', icon: 'path://M0 0h24v24H0z' }
                    ]
                },
                grid: {
                    left: '2%',
                    right: '2%',
                    bottom: '4%',
                    top: '12%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        data: years,
                        axisPointer: {
                            type: 'shadow'
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#cbd5e1'
                            }
                        },
                        axisTick: {
                            alignWithLabel: true
                        },
                        axisLabel: {
                            color: textColor,
                            fontSize: 11,
                            margin: 12,
                            formatter: function(value) {
                                return value === 'FY27' ? '{forecast|FY27*}' : value;
                            },
                            rich: {
                                forecast: {
                                    color: '#d97706',
                                    fontWeight: 'bold'
                                }
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        type: 'value',
                        name: 'Revenue (₹ Cr)',
                        nameTextStyle: {
                            color: textColor,
                            fontSize: 11,
                            padding: [0, 0, 0, 10]
                        },
                        position: 'left',
                        splitLine: {
                            lineStyle: {
                                color: gridBorderColor,
                                type: 'dashed'
                            }
                        },
                        axisLabel: {
                            color: textColor,
                            fontSize: 11,
                            formatter: function (value) {
                                return (value / 1000).toFixed(0) + 'k Cr';
                            }
                        }
                    },
                    {
                        type: 'value',
                        name: 'Capex Ratio (%)',
                        nameTextStyle: {
                            color: textColor,
                            fontSize: 11,
                            padding: [0, 10, 0, 0]
                        },
                        position: 'right',
                        min: -1.0,
                        max: 6.0,
                        splitLine: {
                            show: false
                        },
                        axisLabel: {
                            color: textColor,
                            fontSize: 11,
                            formatter: '{value}%'
                        }
                    }
                ],
                series: [
                    {
                        name: 'Revenue (₹ Cr)',
                        type: 'bar',
                        yAxisIndex: 0,
                        barMaxWidth: 36,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#6366f1' },
                                { offset: 1, color: '#4f46e5' }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        },
                        emphasis: {
                            itemStyle: {
                                color: '#4338ca'
                            }
                        },
                        data: revenueData
                    },
                    {
                        name: 'Capex Ratio (%)',
                        type: 'line',
                        yAxisIndex: 1,
                        smooth: false,
                        symbol: 'circle',
                        symbolSize: 7,
                        itemStyle: {
                            color: '#d97706',
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        },
                        lineStyle: {
                            width: 3,
                            color: '#d97706',
                            type: 'solid'
                        },
                        data: ratioHistorical
                    },
                    {
                        name: 'FY27 Target Projection',
                        type: 'line',
                        yAxisIndex: 1,
                        smooth: false,
                        connectNulls: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        itemStyle: {
                            color: '#d97706',
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        },
                        lineStyle: {
                            width: 3,
                            color: '#d97706',
                            type: 'dotted'
                        },
                        data: ratioDottedProjection
                    }
                ]
            };
        }

        window.onload = function() {
            myChart.setOption(getOption());
            window.addEventListener('resize', () => {
                myChart.resize();
            });
        };
    </script>
</body>
</html>
