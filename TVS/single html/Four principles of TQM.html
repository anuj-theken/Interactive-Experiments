<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four principles of TQM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#ffffff; --wash:#faf6ee; --ink:#2b2722; --muted:#958d80;
    --track:#efeae1; --tick:#ddd6ca; --ochre:#c38a2e; --ochre-soft:#ead8b6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#1c1a17; --wash:#24211c; --ink:#f3eee6; --muted:#9a9184;
      --track:#2f2b25; --tick:#3d3830; --ochre:#dba54a; --ochre-soft:#5a4626;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#1c1a17; --wash:#24211c; --ink:#f3eee6; --muted:#9a9184;
    --track:#2f2b25; --tick:#3d3830; --ochre:#dba54a; --ochre-soft:#5a4626;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative; height:100vh; height:100svh;
    display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(circle at 50% 50%, var(--wash) 0%, var(--bg) 58%);
  }
  .gauge{position:relative; width:min(86svh, 92vw, 700px); aspect-ratio:1; container-type:inline-size}
  .gauge svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}

  .deco{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .d-arc{fill:none; stroke:var(--tick); stroke-width:1}
  .d-arc.thin{stroke:var(--ochre-soft); stroke-width:1.4; stroke-linecap:round}
  .d-line{stroke:var(--tick); stroke-width:1}
  .d-dots{stroke:var(--ochre-soft); stroke-width:1.6; stroke-dasharray:1 8; stroke-linecap:round}
  .d-plus path,.d-hatch path{fill:none; stroke:var(--muted); stroke-width:1.2; stroke-linecap:round; opacity:.45}
  .d-dot{fill:var(--ochre); opacity:.65}
  .d-ring{fill:none; stroke:var(--ochre); stroke-width:1.2; opacity:.55}
  .d-sq{fill:none; stroke:var(--tick); stroke-width:1.2}
  .orbit{fill:none; stroke:var(--ochre-soft); stroke-width:1.2; stroke-dasharray:1.5 9; stroke-linecap:round}
  .inner{fill:none; stroke:var(--track); stroke-width:1}
  .track{fill:none; stroke:var(--track); stroke-width:14}
  .seg{fill:none; stroke:var(--ochre); stroke-width:14}
  .tick{stroke:var(--tick); stroke-width:1.2; stroke-linecap:round}
  .tick.major{stroke-width:2}
  .tick.lit{stroke:var(--ochre)}
  .badge-bg{fill:var(--bg); stroke:var(--track); stroke-width:1.5}
  .badge-lit{fill:var(--bg); stroke:var(--ochre); stroke-width:1.5}
  .ic path{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  .ic.lit path{stroke:var(--ochre)}
  .needle{fill:var(--ochre)}
  .needle-line{stroke:var(--ink); stroke-width:1; opacity:.3}
  .readout{font-family:"Shippori Mincho",Georgia,serif; font-weight:500; font-size:40px; fill:var(--ink); font-variant-numeric:tabular-nums}
  .readout-label{font-family:"Instrument Sans",system-ui,sans-serif; font-size:13px; fill:var(--muted); letter-spacing:.5px}

  .core{position:absolute; left:50%; top:50%; width:58%; height:58%; transform:translate(-50%,-50%)}
  .slide{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; visibility:hidden}
  .mask{overflow:hidden; padding:.08em 0}
  .ln{display:block; will-change:transform}
  .num{font-size:max(11px,1.9cqw); color:var(--ochre); letter-spacing:.12em; font-variant-numeric:tabular-nums}
  h1,h2{
    margin:.25em 0 0; font-family:"Shippori Mincho",Georgia,"Times New Roman",serif; font-weight:600;
    font-size:clamp(24px, 6.8cqw, 52px); line-height:1.05; letter-spacing:-.01em;
  }
  .bar{display:block; width:max(26px,4.5cqw); height:2px; background:var(--ochre); margin:max(10px,2cqw) auto; transform-origin:50% 50%}
  .desc{margin:0; font-size:max(13px,2.6cqw); line-height:1.5; max-width:41cqw; color:var(--muted); text-wrap:balance}
  .hint{display:inline-flex; flex-direction:column; align-items:center; gap:6px; font-size:max(12px,1.9cqw); color:var(--muted)}
  .hint svg{width:16px; height:16px; color:var(--ochre); animation:nudge 1.8s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes nudge{50%{transform:translateY(5px)}}

  .end{min-height:40vh; display:grid; place-items:center; padding:48px 24px; text-align:center}
  .end p{max-width:30em; margin:0; line-height:1.6; color:var(--muted); font-family:"Shippori Mincho",Georgia,serif; font-size:18px}

  @media (prefers-reduced-motion: reduce){ .hint svg{animation:none} }
</style>
</head>
<body>

<section id="stage" aria-label="Four principles of Total Quality Management">
  <svg class="deco" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="far">
      <circle class="d-arc" cx="500" cy="500" r="470" stroke-dasharray="140 70 3 70"/>
      <circle class="d-arc thin" cx="500" cy="500" r="420" stroke-dasharray="2 14"/>
      <path class="d-line" d="M0 500H140"/>
      <path class="d-line" d="M860 500H1000"/>
      <path class="d-dots" d="M500 0V60"/>
      <path class="d-dots" d="M500 940V1000"/>
    </g>
    <g id="near">
      <g class="d-plus" transform="translate(170 230)"><path d="M-7 0H7M0 -7V7"/></g>
      <g class="d-plus" transform="translate(820 770)"><path d="M-6 0H6M0 -6V6"/></g>
      <g class="d-plus" transform="translate(790 180)"><path d="M-5 0H5M0 -5V5"/></g>
      <circle class="d-dot" cx="240" cy="790" r="4"/>
      <circle class="d-dot" cx="880" cy="330" r="3"/>
      <circle class="d-ring" cx="120" cy="640" r="7"/>
      <circle class="d-ring" cx="910" cy="580" r="5"/>
      <rect class="d-sq" x="744" y="864" width="12" height="12"/>
      <rect class="d-sq" x="275" y="95" width="9" height="9"/>
      <g class="d-hatch" transform="translate(130 120)"><path d="M0 14L14 0M7 14L21 0M14 14L28 0"/></g>
      <g class="d-hatch" transform="translate(840 880)"><path d="M0 12L12 0M6 12L18 0"/></g>
    </g>
  </svg>
  <div class="gauge">
    <svg id="g" viewBox="-10 -10 620 620" role="img" aria-label="Gauge with four sections, one per principle"></svg>
    <div class="core" id="core">
      <div class="slide intro">
        <div class="mask"><span class="ln num">Total Quality Management</span></div>
        <div class="mask"><h1 class="ln">Four principles</h1></div>
        <span class="bar"></span>
        <div class="mask"><span class="ln hint">Scroll to begin
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span></div>
      </div>
    </div>
  </div>
</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(() => {
  const ICONS = {
    kaizen:   ['M3 21h5v-4h5v-4h5V9h3', 'M15 3h6v6', 'M21 3l-6 6'],
    atarimae: ['M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z', 'M8.5 12l2.5 2.5 4.5-5'],
    kansei:   ['M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', 'M7.5 11.5h2.5l1-2 2 4 1-2h2.5'],
    miryoku:  ['M6 4h12l3 5-9 11L3 9z', 'M3 9h18', 'M9.5 4L8 9l4 11', 'M14.5 4L16 9l-4 11']
  };
  const DATA = [
    { key:'kaizen',   term:'Kaizen',                desc:'Make small and systematic improvements to processes every day.' },
    { key:'atarimae', term:'Atarimae hinshitsu',    desc:'Products or services should work as intended, without failure.' },
    { key:'kansei',   term:'Kansei',                desc:'Examine how a user interacts with a product physically and emotionally to drive design improvements.' },
    { key:'miryoku',  term:'Miryokuteki hinshitsu', desc:'Add aesthetic appeal, charm, and emotional value beyond basic functionality.' }
  ];

  /* centre slides */
  const core = document.getElementById('core');
  DATA.forEach((d,i) => core.insertAdjacentHTML('beforeend', `
    <div class="slide step">
      <div class="mask"><span class="ln num">${String(i+1).padStart(2,'0')} / 04</span></div>
      <div class="mask"><h2 class="ln">${d.term}</h2></div>
      <span class="bar"></span>
      <div class="mask"><p class="ln desc">${d.desc}</p></div>
    </div>`));
  core.insertAdjacentHTML('beforeend', `
    <div class="slide outro">
      <div class="mask"><span class="ln num">04 / 04</span></div>
      <div class="mask"><h2 class="ln">Total quality</h2></div>
      <span class="bar"></span>
      <div class="mask"><p class="ln desc">Improve daily, work reliably, design for feeling, delight beyond function.</p></div>
    </div>`);

  /* gauge */
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('g');
  const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const C = 300, R = 220, A0 = -135, SPAN = 270, SEG = SPAN/4, GAP = 3;
  const pt = (a, r) => { const t = a*Math.PI/180; return [C + r*Math.sin(t), C - r*Math.cos(t)]; };
  const arc = (a0, a1, r) => { const [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r); return `M${x0} ${y0} A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1} ${y1}`; };
  const dash = p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return p; };

  const orbit = el('circle', { cx:C, cy:C, r:302, class:'orbit' });
  const inner = el('circle', { cx:C, cy:C, r:172, class:'inner' });

  const tracks = [], segs = [];
  for (let i = 0; i < 4; i++) {
    const a0 = A0 + i*SEG + GAP/2, a1 = A0 + (i+1)*SEG - GAP/2;
    tracks.push(dash(el('path', { d:arc(a0,a1,R), class:'track' })));
  }
  for (let i = 0; i < 4; i++) {
    const a0 = A0 + i*SEG + GAP/2, a1 = A0 + (i+1)*SEG - GAP/2;
    segs.push(dash(el('path', { d:arc(a0,a1,R), class:'seg' })));
  }

  const tickG = el('g', {}), litG = el('g', {});
  const ticks = [], litTicks = [[],[],[],[]];
  for (let k = 0; k <= 40; k++) {
    const a = A0 + k*(SPAN/40), major = k % 5 === 0;
    const [x0,y0] = pt(a, 238), [x1,y1] = pt(a, major ? 252 : 245);
    const at = { x1:x0, y1:y0, x2:x1, y2:y1 };
    ticks.push(el('line', { ...at, class:'tick' + (major?' major':'') }, tickG));
    litTicks[k === 0 ? 0 : Math.ceil(k/10)-1].push(el('line', { ...at, class:'tick lit' + (major?' major':''), opacity:0 }, litG));
  }

  const badges = DATA.map((d,i) => {
    const [x,y] = pt(A0 + (i+.5)*SEG, 280);
    const wrap = el('g', { transform:`translate(${x} ${y})` });
    const g = el('g', {}, wrap);
    el('circle', { r:18, class:'badge-bg' }, g);
    const ring = el('circle', { r:18, class:'badge-lit', opacity:0 }, g);
    const mk = (cls, op) => { const ig = el('g', { class:cls, transform:'translate(-9.6 -9.6) scale(.8)', opacity:op }, g); ICONS[d.key].forEach(dd => el('path', { d:dd }, ig)); return ig; };
    mk('ic', 1);
    const lit = mk('ic lit', 0);
    return { g, lit:[ring, lit] };
  });

  const needle = el('g', {});
  el('line', { x1:C, y1:C-150, x2:C, y2:C-186, class:'needle-line' }, needle);
  el('polygon', { points:`${C-5},${C-186} ${C+5},${C-186} ${C},${C-206}`, class:'needle' }, needle);

  const ro = el('text', { x:C, y:506, 'text-anchor':'middle', class:'readout' }); ro.textContent = '000';
  const roL = el('text', { x:C, y:532, 'text-anchor':'middle', class:'readout-label' }); roL.textContent = 'quality %';

  /* initial state */
  gsap.registerPlugin(ScrollTrigger);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  gsap.set(needle, { rotation:A0, svgOrigin:`${C} ${C}` });
  gsap.set(orbit, { svgOrigin:`${C} ${C}` });
  gsap.set(badges.map(b => b.g), { transformOrigin:'50% 50%' });

  const intro = core.querySelector('.intro');
  const steps = [...core.querySelectorAll('.step')];
  const outro = core.querySelector('.outro');
  const lines = s => s.querySelectorAll('.ln');
  const bar = s => s.querySelector('.bar');
  gsap.set([...steps, outro], { autoAlpha:0 });
  gsap.set(intro, { autoAlpha:1 });

  /* opening: the instrument assembles once on load */
  const load = gsap.timeline({ defaults:{ ease:'power3.inOut' } });
  if (reduce) {
    tracks.forEach(t => t.style.strokeDashoffset = 0);
  } else {
    load.from(orbit, { opacity:0, scale:.94, duration:1.4, ease:'power2.out' }, 0)
        .from(inner, { opacity:0, scale:.8, svgOrigin:`${C} ${C}`, duration:1.2, ease:'power3.out' }, .1)
        .to(tracks, { strokeDashoffset:0, duration:1.1, stagger:.12 }, .15)
        .from(ticks, { opacity:0, duration:.4, stagger:{ each:.015, ease:'power1.in' }, ease:'power1.out' }, .35)
        .from(badges.map(b => b.g), { scale:0, opacity:0, duration:.7, stagger:.1, ease:'back.out(1.6)' }, .7)
        .from(needle, { opacity:0, duration:.5, ease:'power2.out' }, .8)
        .to(needle, { rotation:A0 + 28, duration:.55, ease:'power2.out' }, 1.0)
        .to(needle, { rotation:A0, duration:.8, ease:'elastic.out(1,.55)' }, 1.55)
        .from(lines(intro), { yPercent:110, duration:.9, stagger:.1, ease:'power4.out' }, .9)
        .from(bar(intro), { scaleX:0, duration:.8, ease:'power3.out' }, 1.1);
  }

  /* scroll story */
  const counter = { v:0 };
  const paint = () => { ro.textContent = String(Math.round(counter.v)).padStart(3,'0'); };

  // Gauge is scroll-linked (scrubbed). Text is NOT scrubbed: it plays its own
  // eased transition when you cross into a new principle, so it never gets caught half-way.
  const tl = gsap.timeline({ defaults:{ ease:'power2.inOut' } });

  tl.to({}, { duration:1.2 });
  DATA.forEach((d,i) => {
    const go = 'go' + i, end = A0 + (i+1)*SEG - GAP/2;
    tl.addLabel(go)
      .to(segs[i],     { strokeDashoffset:0, duration:1.1, ease:'power3.inOut' }, go)
      .to(needle,      { rotation:end, duration:1.1, ease:'power3.inOut' }, go)
      .to(counter,     { v:(i+1)*25, duration:1.1, ease:'power3.inOut', onUpdate:paint }, go)
      .to(litTicks[i], { opacity:1, duration:.25, stagger:{ each:.08, ease:'power2.in' }, ease:'power1.out' }, go)
      .to(badges[i].lit, { opacity:1, duration:.4, ease:'power2.out' }, go + '+=.8');
    if (i > 0) tl.to(segs[i-1], { opacity:.4, duration:.8 }, go);
    tl.to({}, { duration:1.9 });
  });
  tl.addLabel('fin')
    .to(segs, { opacity:1, duration:.8 }, 'fin')
    .to(inner, { attr:{ r:180 }, duration:.9, ease:'power3.inOut' }, 'fin')
    .to({}, { duration:1.2 });

  /* text state machine */
  const states = [intro, ...steps, outro];
  let cur = 0, swap = null;
  const show = n => {
    if (n === cur) return;
    if (load.isActive()) load.progress(1);
    if (swap) swap.progress(1).kill();
    const from = states[cur], to = states[n], dir = n > cur ? 1 : -1;
    cur = n;
    gsap.fromTo('.d-dot, .d-ring', { scale:1 }, { scale:2.3, duration:.5, ease:'power2.out', yoyo:true, repeat:1, stagger:.06, overwrite:'auto' });
    swap = gsap.timeline()
      .to(lines(from), { yPercent:-110*dir, duration:.32, stagger:.04, ease:'power3.in' })
      .to(bar(from), { scaleX:0, duration:.28, ease:'power3.in' }, 0)
      .set(from, { autoAlpha:0 })
      .set(to, { autoAlpha:1 })
      .fromTo(lines(to), { yPercent:110*dir }, { yPercent:0, duration:.7, stagger:.07, ease:'power4.out' })
      .fromTo(bar(to), { scaleX:0 }, { scaleX:1, duration:.6, ease:'power3.out' }, '<+=.12');
  };

  const stateAt = t => {
    if (t >= tl.labels.fin + .2) return 5;
    let n = 0;
    DATA.forEach((d,i) => { if (t >= tl.labels['go'+i] + .45) n = i + 1; });
    return n;
  };

  ScrollTrigger.create({
    trigger:'#stage', start:'top top', end:'+=820%', pin:true,
    animation:tl, scrub:.5,
    onUpdate: self => show(stateAt(self.progress * tl.duration()))
  });

  // slow drift of the outer orbit across the whole story
  tl.to(orbit, { rotation:90, duration:tl.duration(), ease:'sine.inOut' }, 0);

  /* subtle surrounding lines and shapes */
  const arcs = document.querySelectorAll('.d-arc');
  const decoLines = document.querySelectorAll('.d-line, .d-dots');
  const shapes = [...document.querySelectorAll('#near > *')];
  gsap.set(arcs, { svgOrigin:'500 500' });
  gsap.set(shapes, { transformOrigin:'50% 50%' });

  // parallax: far layer drifts one way, near layer the other, as you scroll
  tl.to('#far',  { y:140, duration:tl.duration(), ease:'sine.inOut' }, 0)
    .to('#near', { y:-280, duration:tl.duration(), ease:'sine.inOut' }, 0)
    .to(arcs[0], { rotation:-140, duration:tl.duration(), ease:'sine.inOut' }, 0)
    .to(shapes, { rotation:(i) => (i % 2 ? 1 : -1) * 180, duration:tl.duration(), ease:'sine.inOut' }, 0);

  if (!reduce) {
    load.from(arcs, { opacity:0, rotation:-25, duration:2.2, stagger:.2, ease:'power3.out' }, 0)
        .from(decoLines, { opacity:0, duration:1.4, stagger:.1, ease:'power2.out' }, .3)
        .from(shapes, { opacity:0, scale:0, duration:.8, stagger:{ each:.07, from:'random' }, ease:'back.out(1.8)' }, .6);

    // gentle idle float so the page breathes while you read
    shapes.forEach((s, i) => {
      const spin = s.matches('.d-plus, .d-sq, .d-hatch');
      gsap.to(s, {
        y:`+=${(i % 2 ? 1 : -1) * (18 + (i % 3) * 10)}`,
        x:`+=${(i % 3 - 1) * 16 + (i % 2 ? 8 : -8)}`,
        duration:2.6 + (i % 4) * .7, ease:'sine.inOut', yoyo:true, repeat:-1, delay:1.6 + i * .12
      });
      if (spin) gsap.to(s, { scale:1.25, duration:2.2 + (i % 3) * .6, ease:'sine.inOut', yoyo:true, repeat:-1, delay:1.6 + i * .1 });
    });
    gsap.to(arcs[1], { rotation:70, duration:12, ease:'sine.inOut', yoyo:true, repeat:-1 });
  }
})();
</script>
</body>
</html>
