<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gattu — TVS, 1946–1961</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E4E1; --ink:#1C1F22; --muted:#5B6066; --frame:#F8F8F6;
  --line:rgba(28,31,34,.18); --signal:#B8862A; --ph-a:#D3D5D1; --ph-b:#CACDC8;
  --shadow:0 22px 44px -22px rgba(28,31,34,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191B1D; --ink:#ECEDEA; --muted:#9BA0A5; --frame:#2A2D30;
    --line:rgba(236,237,234,.18); --signal:#D9A646; --ph-a:#2E3236; --ph-b:#35393D;
    --shadow:0 22px 44px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191B1D; --ink:#ECEDEA; --muted:#9BA0A5; --frame:#2A2D30;
  --line:rgba(236,237,234,.18); --signal:#D9A646; --ph-a:#2E3236; --ph-b:#35393D;
  --shadow:0 22px 44px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Newsreader",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}

.stage{position:relative;height:100vh;height:100svh;overflow:hidden}

.masthead{position:absolute;inset:0 0 auto;z-index:30;padding:calc(22px + env(safe-area-inset-top,0px)) clamp(20px,5vw,72px) 0}
.brand{font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:125%;font-weight:800;font-size:1.05rem}
.brand small{display:block;font-weight:400;font-stretch:100%;font-size:.72rem;color:var(--muted);margin-top:2px}

.counter{position:absolute;z-index:30;left:clamp(20px,5vw,72px);bottom:calc(28px + env(safe-area-inset-bottom,0px));
  font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:75%;font-weight:500;font-size:.85rem;color:var(--muted);
  display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:700}
.counter .track{width:120px;height:1px;background:var(--line);position:relative;overflow:hidden}
.counter .fill{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}

/* tire */
.tire{position:absolute;z-index:2;will-change:transform;pointer-events:none;user-select:none}
.tire img{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 50px rgba(0,0,0,.16))}

/* images riding the orbit */
.orbit{position:absolute;inset:0;z-index:5;pointer-events:none}
.shot{position:absolute;left:0;top:0;background:var(--frame);padding:8px;box-shadow:var(--shadow);will-change:transform,opacity}
.shot .ph{width:100%;height:100%;position:relative;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--ph-a) 0 10px,var(--ph-b) 10px 20px);display:flex;align-items:flex-end;padding:8px}
.shot .ph span{font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:87%;font-size:.66rem;color:var(--muted);background:var(--frame);padding:3px 6px}
.shot svg{position:absolute;inset:0;width:100%;height:100%}

/* text, free-standing like the reference */
.copy{position:absolute;inset:0;z-index:20;pointer-events:none}
.yr,.txt{position:absolute;left:0;top:0;visibility:hidden}
.yr{font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:clamp(2.2rem,3.6vw,3.4rem);
  color:var(--muted);opacity:.75;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.txt h2{font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:118%;font-weight:800;line-height:.98;letter-spacing:-.005em;
  font-size:clamp(1.9rem,3.2vw,3.2rem);margin-bottom:16px;text-wrap:balance}
.txt p{font-size:clamp(1rem,1.15vw,1.15rem);line-height:1.5;color:var(--ink);max-width:54ch}
.txt.statement{display:flex;align-items:center}
.txt.statement h2{font-size:clamp(2rem,3.6vw,3.4rem);font-stretch:112%;margin:0;max-width:14ch}
.txt.statement.light h2{font-weight:600}

.hint{position:absolute;z-index:30;right:clamp(20px,5vw,72px);top:calc(24px + env(safe-area-inset-top,0px));
  font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:87%;font-size:.78rem;color:var(--muted)}

.after{min-height:60vh;display:grid;place-items:center;padding:60px 24px;color:var(--muted);
  font-family:"Archivo",Helvetica,Arial,sans-serif;font-stretch:87%;font-size:.85rem}

@media (max-width:699px){
  .txt h2{font-size:clamp(1.6rem,7.6vw,2.2rem);margin-bottom:10px}
  .txt.statement h2{font-size:clamp(1.6rem,7.4vw,2.1rem)}
  .txt p{font-size:1rem;line-height:1.45}
  .hint{display:none}
}
</style>
</head>

<script>
/* ---------- content ---------- */
// img: placeholder label (swap for a real <img> later) · null = text-only beat
const STORY = [
  { kicker:'1946', title:'Southern Roadways', img:'Logo / photo: Southern Roadways',
    body:'Southern Roadways is founded in 1946 to offer passenger bus and cargo services.' },
  { kicker:'Late 1940s', title:'Madras Motor Insurance', img:'Logo / photo: Madras Motor Insurance',
    body:'Madras Motor Insurance is set up in the late 1940s.' },
  { kicker:'1954', title:'Sundaram Finance', img:'Logo / photo: Sundaram Finance',
    body:'Sundaram Finance is established in 1954 to help transport operators purchase vehicles. It eventually becomes one of the larger NBFCs of India, with more than Rs 62,000 crore under assets under management as of 30 June 2026.' },
  { kicker:'1954', title:'General Motors', img:'Logo / photo: General Motors',
    body:'At the same time, in 1954, General Motors exits India, believing the country does not have a proper industrial base. TVS’s business around being a GM dealership comes to an end after 25 years.' },
  { kicker:'1955', statement:'Sundaram dies in 1955.', img:null },
  { title:'Srinivasan', img:'Photo: Srinivasan',
    body:'Sundaram’s youngest son, Srinivasan, urges his older brothers to get into manufacturing.' },
  { statement:'The TVS group sets up four British-partnered ventures.', light:true, img:null },
  { kicker:'1961', title:'Wheels India', img:'Logo / photo: Wheels India × Dunlop',
    body:'Wheels India is formed with Dunlop in 1961 to make wheels for cars and trucks.' },
  { title:'Lucas TVS', img:'Logo / photo: Lucas TVS',
    body:'Lucas TVS is established with Lucas to make electrical equipment for automobiles.' },
  { title:'Brakes India', img:'Logo / photo: Brakes India',
    body:'Brakes India is formed with Lucas Girling to make hydraulic brake systems.' },
  { title:'Sundaram Clayton', img:'Logo / photo: Sundaram Clayton',
    body:'Sundaram Clayton is a joint venture with Clayton Dewandre to make brake systems for commercial vehicles. This company later gives the TVS group its first two-wheeler.' },
  { kicker:'Padi, Madras', title:'265 acres', img:'map',
    body:'To accommodate these operations, Srinivasan locates 265 acres in Padi, on the outskirts of Madras.' }
];

/* ---------- build DOM ---------- */
const orbitEl = document.getElementById('orbit');
const copyEl  = document.getElementById('copy');
const shots = [], entries = [];
STORY.forEach((s, i) => {
  if (s.img){
    const f = document.createElement('figure');
    f.className = 'shot';
    f.innerHTML = s.img === 'map'
      ? `<div class="ph">${document.getElementById('map').innerHTML}</div>`
      : `<div class="ph"><span>${s.img}</span></div>`;
    f._i = i;
    orbitEl.appendChild(f); shots.push(f);
  }
  const yr = document.createElement('div');
  yr.className = 'yr';
  yr.textContent = s.kicker || '';
  const tx = document.createElement('article');
  tx.className = 'txt' + (s.statement ? ' statement' : '') + (s.light ? ' light' : '');
  tx.innerHTML = s.statement ? `<h2>${s.statement}</h2>` : `<h2>${s.title}</h2><p>${s.body}</p>`;
  copyEl.append(yr, tx);
  entries.push({ yr: s.kicker ? yr : null, tx, statement: !!s.statement });
});

/* ---------- motion ---------- */
gsap.registerPlugin(ScrollTrigger);
const stage = document.getElementById('stage');
const tire  = document.getElementById('tire');
const hint  = document.getElementById('hint');
const cur   = document.getElementById('cur');
const fill  = document.getElementById('fill');
const N = STORY.length;
document.getElementById('tot').textContent = String(N).padStart(2,'0');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const STEP_DEG = 20;       // how far the wheel turns per beat
const MOVE = 1.8;            // seconds for one step: slow, unhurried
const EASE = 'sine.inOut';

let geo = {};
const disp = { p: 0 };
let idx = 0;

function layout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const mobile = W < 700;
  const margin = mobile ? 24 : Math.round(Math.min(Math.max(W * 0.05, 24), 72));
  const yrH = entries.find(e => e.yr).yr.offsetHeight;
  const yrGap = mobile ? 12 : 18, txGap = mobile ? 18 : 26;
  const topPad = mobile ? 80 : 76, botPad = mobile ? 24 : 60;
  const textEntries = entries.filter(e => !e.statement);

  // stack per beat:  year / image / heading + text, all on the left edge
  let imgW = mobile ? W - margin * 2 : Math.round(Math.min(W * 0.55, 860));
  let imgH, txW, maxTx;
  for (;;){
    imgH = Math.round(imgW * 0.62);
    txW = mobile ? imgW : Math.round(Math.min(imgW, 620));
    textEntries.forEach(e => e.tx.style.width = txW + 'px');
    maxTx = Math.max(...textEntries.map(e => e.tx.offsetHeight));
    const need = topPad + yrH + yrGap + imgH + txGap + maxTx + botPad;
    if (need <= H || imgW <= 260) break;
    imgW -= 20;
  }
  const block = yrH + yrGap + imgH + txGap + maxTx;
  const room = mobile ? H - W * 1.8 * 0.16 : H;          // leave the wheel's arc free on phones
  const imgTop = Math.max(topPad, (room - block) / 2) + yrH + yrGap;
  const imgL = margin;
  const icx = imgL + imgW / 2, icy = imgTop + imgH / 2;

  if (!mobile){
    // hub on the right edge, level with the image; tread tucks under the image's right side
    // smaller wheel; hub moves in so the tread still tucks under the image's right side
    // wheel's top edge sits at the top of the frame (never cropped there);
    // hub as far right as it can go while the tread still meets the image
    const cy = icy;
    const S = Math.round(2 * cy);
    const cx = Math.max(W - S * 0.3, imgL + imgW * 0.85 + S / 2);
    geo = { mode:'side', cx, cy, R: cx - icx, stepDeg: STEP_DEG, imgW, imgH, dir: -1 };
    gsap.set(tire, { width:S, height:S, left:cx - S/2, top:cy - S/2 });
  } else {
    // phone: wheel rises from the bottom edge, images revolve over it
    const S = W * 1.8;
    const textBottom = imgTop + imgH + txGap + maxTx;
    const treadTop = Math.max(textBottom + 20, H - S * 0.16);
    const cx = W / 2, cy = treadTop + S / 2;
    geo = { mode:'top', cx, cy, R: cy - icy, stepDeg: STEP_DEG * 0.6, imgW, imgH, dir: 1 };
    gsap.set(tire, { width:S, height:S, left:cx - S/2, top:cy - S/2 });
  }

  shots.forEach(s => gsap.set(s, { width: imgW, height: imgH }));
  entries.forEach(e => {
    if (e.yr) gsap.set(e.yr, { left: imgL, top: imgTop - yrGap - yrH });
    if (e.statement) gsap.set(e.tx, { left: imgL, top: imgTop, width: imgW, height: imgH });
    else gsap.set(e.tx, { left: imgL, top: imgTop + imgH + txGap });
  });
  render(disp.p);
}

function render(p){
  const { cx, cy, R, stepDeg, imgW, imgH, dir, mode } = geo;
  // the wheel turns by exactly the angle the images travel, so they read as attached
  tire.style.transform = `rotate(${p * stepDeg * -dir}deg)`;

  shots.forEach(s => {
    const k = s._i - p;
    const theta = k * stepDeg * dir;           // 0 = the reading position
    const d = Math.abs(k);
    const o = Math.max(0, 1 - d * 1.3);   // only the highlighted image is visible
    // revolve around the hub but stay upright (no spin of the image itself)
    const a = theta * Math.PI / 180;
    const px = mode === 'side' ? cx - R * Math.cos(a) : cx + R * Math.sin(a);
    const py = mode === 'side' ? cy - R * Math.sin(a) : cy - R * Math.cos(a);
    s.style.transform = `translate3d(${px - imgW/2}px, ${py - imgH/2}px, 0)`;
    s.style.opacity = o;
    s.style.zIndex = 100 - Math.round(d * 10);
    s.style.visibility = o <= 0.01 ? 'hidden' : 'visible';
  });
  fill.style.transform = `scaleX(${p / (N - 1)})`;
}

function parts(e){ return e ? [e.yr, ...e.tx.children].filter(Boolean) : []; }
function showText(next, prev){
  const inE = entries[next], outE = prev != null && prev !== next ? entries[prev] : null;
  if (reduce){
    entries.forEach(e => { e.tx.style.visibility = 'hidden'; if (e.yr) e.yr.style.visibility = 'hidden'; });
    inE.tx.style.visibility = 'visible'; if (inE.yr) inE.yr.style.visibility = 'visible';
    gsap.set(parts(inE), { opacity:1, y:0 });
    return;
  }
  if (outE){
    gsap.to(parts(outE), { opacity:0, y:-12, duration:.55, ease:'sine.in', stagger:.04, overwrite:true,
      onComplete(){ outE.tx.style.visibility = 'hidden'; if (outE.yr) outE.yr.style.visibility = 'hidden'; } });
  }
  inE.tx.style.visibility = 'visible'; if (inE.yr) inE.yr.style.visibility = 'visible';
  gsap.fromTo(parts(inE), { opacity:0, y:16 },
    { opacity:1, y:0, duration:1.0, ease:'sine.out', stagger:.08, delay: outE ? .6 : 0, overwrite:true });
}

function goTo(i){
  const prev = idx;
  idx = i;
  cur.textContent = String(i + 1).padStart(2,'0');
  entries.forEach((e, j) => e.tx.setAttribute('aria-hidden', j === i ? 'false' : 'true'));
  showText(i, prev);
  gsap.to(disp, { p:i, duration: reduce ? 0 : MOVE, ease: EASE, overwrite:true, onUpdate:() => render(disp.p) });
  gsap.to(hint, { opacity: i === 0 ? 1 : 0, duration:.6 });
}

ScrollTrigger.create({
  trigger: stage,
  start: 'top top',
  end: () => '+=' + (N - 1) * window.innerHeight * 1.6,   // generous scroll distance per beat
  pin: true,
  invalidateOnRefresh: true,
  snap: { snapTo: 1 / (N - 1), duration: { min: .4, max: .9 }, delay: .15, ease: 'sine.inOut', inertia: false },
  onUpdate: self => {
    const i = Math.round(self.progress * (N - 1));
    if (i !== idx) goTo(i);
  }
});

ScrollTrigger.addEventListener('refreshInit', layout);
document.fonts && document.fonts.ready.then(() => ScrollTrigger.refresh());
layout();
entries.forEach((e, j) => e.tx.setAttribute('aria-hidden', j === 0 ? 'false' : 'true'));
entries[0].tx.style.visibility = 'visible'; if (entries[0].yr) entries[0].yr.style.visibility = 'visible';
gsap.set(entries.slice(1).flatMap(parts), { opacity:0 });
</script>
</body>
