<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GSAP Responsive Image Swap</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-transparent font-sans antialiased m-0 p-0">
        <div class="flex flex-col md:flex-row min-h-screen">
            <div
                class="w-full md:w-1/2 h-[50vh] md:h-screen sticky top-0 overflow-visible bg-transparent flex items-center justify-center z-10"
            >
                <div
                    class="relative w-3/4 h-3/4 max-w-md max-h-[70vh] overflow-visible"
                >
                    <img
                        id="img1"
                        src="image1.png"
                        alt="First Local Image"
                        class="absolute inset-0 w-full h-full object-contain opacity-100"
                    />
                    <img
                        id="img2"
                        src="image2.png"
                        alt="Second Local Image"
                        class="absolute inset-0 w-full h-full object-contain opacity-0"
                    />
                </div>
            </div>

            <div
                class="story-container w-full md:w-1/2 px-6 md:px-12 py-12 md:py-24 flex flex-col justify-center gap-50 h-[100vh] bg-transparent"
            >
                <div>
                    <h1
                        class="text-3xl md:text-4xl font-bold mb-4 text-gray-800"
                    >
                        Welcome to Story One
                    </h1>
                    <p
                        class="text-base md:text-lg text-gray-600 leading-relaxed"
                    >
                        This is the first part of your content. As you begin
                        scrolling down, the first image remains fixed.
                    </p>
                </div>

                <div>
                    <h2
                        class="text-3xl md:text-4xl font-bold mb-4 text-gray-800"
                    >
                        Transition to Story Two
                    </h2>
                    <p
                        class="text-base md:text-lg text-gray-600 leading-relaxed"
                    >
                        Look at that! Once you crossed the halfway mark of the
                        scroll, GSAP smoothly faded out the first image.
                    </p>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

        <script>
            gsap.registerPlugin(ScrollTrigger);

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "body",
                    start: "top top",
                    end: "bottom bottom",
                    scrub: 1,
                },
            });

            tl.to("#img1", { opacity: 0, duration: 1 }).to(
                "#img2",
                { opacity: 1, duration: 1 },
                "<",
            );
        </script>
    </body>
</html>
