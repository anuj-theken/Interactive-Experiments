<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Timeline - Asian Paints</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Founding Fathers</h1>
            <div class="legend">
                <div class="legend-item">
                    <span class="square"></span>
                    <span>Founders</span>
                </div>
                <div class="legend-item">
                    <span class="line"></span>
                    <span>1 year</span>
                </div>
            </div>
        </header>

        <div id="timeline-chart"></div>

        <div id="info-card" class="card">
            <h2 id="founder-name">Jairam Mangesh Nadkarni <small id="founder-year">. 1952</small></h2>
            <p id="founder-desc">Best polymer scientist of his time, joined as chief scientist and set up Asian Paints’ R&D lab</p>
        </div>

        <p class="footer-hint">Hover over the squares to see more</p>
    </div>

    <script src="timeline.js"></script>
</body>
</html>
